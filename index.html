<style>
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
/* Layout: single phone column, sticky top bar, fixed bottom tab bar; soft white cards on blush, serif for titles and numbers, spaced caps for labels */
:root{
  --bg:#f6eeec; --surface:#ffffff; --sunk:#faf4f3; --ink:#3d1621; --muted:#8c6f76; --line:#ecdfe0;
  --accent:#9c4d62; --accent-soft:#f5e1e6; --on-accent:#ffffff; --rose:#d995a3; --gold:#d8aa6e;
  --good:#5f8a5a; --good-soft:#e7f0e3; --warn:#a8742a; --warn-soft:#f7ecd9;
  --pS:#9c4d62; --pF:#5d8584; --pT:#b5813a;
  --shadow:0 6px 22px rgba(120,60,75,.08), 0 1px 3px rgba(120,60,75,.06);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --mskin:#efe3e5; --mbase:#d8c0c6;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-bottom:max(12px,var(--safe-bottom));
  --nav-height:calc(65px + 4px + var(--nav-bottom));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1115; --surface:#26181e; --sunk:#201419; --ink:#f4e7ea; --muted:#b99aa2; --line:#3a2830;
    --accent:#e39aad; --accent-soft:#40232c; --on-accent:#2a0f17; --rose:#c9798a; --gold:#e2b679;
    --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812;
    --pS:#e39aad; --pF:#8cc2c0; --pT:#e2b679; --shadow:0 6px 22px rgba(0,0,0,.35); --mskin:#33232a; --mbase:#4b3540; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1115; --surface:#26181e; --sunk:#201419; --ink:#f4e7ea; --muted:#b99aa2; --line:#3a2830;
  --accent:#e39aad; --accent-soft:#40232c; --on-accent:#2a0f17; --rose:#c9798a; --gold:#e2b679;
  --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812;
  --pS:#e39aad; --pF:#8cc2c0; --pT:#e2b679; --shadow:0 6px 22px rgba(0,0,0,.35); --mskin:#33232a; --mbase:#4b3540; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
/* Keep touch gestures vertical without trapping document or sheet scrolling. */
html{touch-action:pan-y;overflow-x:clip}
body{padding-top:env(safe-area-inset-top,0px);overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{min-width:0;max-width:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-height) + 40px) max(16px,env(safe-area-inset-left,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.sync{font:inherit;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.S{color:var(--pS);border-color:currentColor} .chip.F{color:var(--pF);border-color:currentColor} .chip.T{color:var(--pT);border-color:currentColor}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* Today */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.weekbar{display:flex;gap:4px}
.weekbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.weekbar span.done{background:var(--ink)} .weekbar span.now{background:var(--accent)}
.day{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;text-align:left}
.day .idx{font-family:var(--display);font-size:26px;font-weight:700;width:34px;text-align:center;color:var(--muted)}
.day.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.next .idx{color:var(--accent)}
.day.done .idx{color:var(--good)}
.day .grow{flex:1;min-width:0}
.day .t{font-family:var(--display);font-size:22px;font-weight:700}
/* Workout */
.phase{border-left:4px solid var(--ink);padding-left:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.check label{flex:1}
.ex{padding:0;overflow:hidden}
.ex .head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.ex .name{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.05}
.ex .n{font-family:var(--display);color:var(--accent);font-weight:700;margin-right:6px}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--sunk);padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.target b{font-family:var(--display);font-size:20px}
.sets{padding:8px 16px 12px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px 0}
.set .sn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:18px}
.set.isdone .sn{color:var(--good)}
.field{position:relative}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 34px 0 10px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.field span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--muted)}
.set.isdone .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.isdone input{background:var(--good-soft);border-color:transparent}
.cue{font-size:14px;color:var(--muted)}
.exfoot{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.timer{position:fixed;left:0;right:0;bottom:var(--nav-height);z-index:6}
.timer .in{max-width:560px;margin:0 auto 8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.timer .box{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .clock{font-family:var(--display);font-size:32px;font-weight:700;min-width:72px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:8px;padding:6px 8px;font-weight:600;font-size:14px}
/* Plan & library */
.slotrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slotrow:first-of-type{border-top:0}
.lib-item{border-top:1px solid var(--line);padding:10px 0}
.lib-item:first-child{border-top:0}
.lib-item button.lt{all:unset;cursor:pointer;display:block;width:100%}
.lib-item button.lt:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.lib-arrow{flex-shrink:0;color:var(--muted);opacity:.65;font-size:24px;font-weight:400;padding:0 4px}
.lib-item .ln{font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.search{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.search{grid-column:1/-1}
/* History */
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist:first-child{border-top:0}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
/* Settings */
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;font-size:12px;font-family:ui-monospace,monospace}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) var(--nav-bottom) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;touch-action:pan-y;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + var(--safe-bottom)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;font-weight:600;font-size:14px;max-width:90%}
@media (prefers-reduced-motion: no-preference){ .timer .bar i{transition:width .9s linear} }

/* Blush theme refinements */
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
:root{ --h1:color-mix(in srgb, var(--rose) 50%, var(--mskin)); --h2:var(--rose); --h3:var(--accent); }
.mthumb{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--sunk);border:1.5px solid var(--line);padding:0;display:inline-flex;align-items:center;justify-content:center}
.mthumb svg{width:100%;height:100%;display:block}
button.mthumb:active{transform:scale(.96)}
.slotrow.mrow3{grid-template-columns:46px 1fr auto;gap:10px}
.musline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.musline .dotp,.musline .dots,.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.musline .dotp{background:var(--accent)} .musline .dots{background:var(--rose);margin-left:6px}
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);border-radius:14px;padding:10px}
.bodybig{width:100%;height:auto;max-height:300px}
:root{--map-skin:color-mix(in srgb,var(--surface) 40%,var(--mskin))}
.bodybig .selected-region{stroke:var(--ink);stroke-width:1.15;paint-order:stroke fill}
#musclemap{--mbase:color-mix(in srgb,var(--mskin) 55%,var(--muted));--h1:color-mix(in srgb,var(--rose) 55%,var(--mskin));--h2:color-mix(in srgb,var(--rose) 85%,var(--accent))}
#musclemap .bodypair{padding:16px 10px 12px;gap:14px;background:linear-gradient(180deg,var(--surface),var(--sunk))}
#musclemap .bodybig{display:block;max-height:320px}
.map-view-label{text-align:center;font-size:12px;color:var(--muted);margin-top:6px;letter-spacing:.06em}
#musclemap .legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px}
#musclemap .legend span{gap:4px;white-space:nowrap}
#musclemap .legend i{width:8px;height:8px}
.map-detail.is-selected{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.map-select-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:6px}
.map-select-header .selector-count{font-family:var(--body);font-size:12px;font-weight:800;color:var(--accent);flex:none;white-space:nowrap}
.map-detail .mrow{grid-template-columns:36px 1fr;padding:8px 0}
.map-detail .mthumb{width:36px;height:36px}
.map-detail .eyebrow{font-size:11px}
.muscle-chooser-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border-color:var(--accent);color:var(--accent);background:var(--surface);margin-top:4px;min-height:48px}
.muscle-chooser-btn .selector-caret{display:block;width:18px;height:18px;flex:none;color:var(--accent)}
.map-detail.is-selected .muscle-chooser-btn{width:auto;max-width:100%;display:inline-flex;gap:14px;text-align:left;border:1.5px solid var(--accent);border-radius:12px;padding:9px 14px;color:var(--ink);margin-top:0}
.map-detail.is-selected .selector-name{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;min-width:0}
.sheet.muscle-picker{padding:0;gap:0;overflow:hidden;max-height:85dvh}
.picker-head{padding:20px 16px 12px;flex:none;border-bottom:1px solid var(--line)}
.picker-head h2{font-size:26px}
.picker-head p{margin:8px 0 0}
.picker-content{padding:16px 16px max(16px,var(--safe-bottom));overflow:auto;overscroll-behavior:contain}
.picker-content section+section{margin-top:18px}
.picker-content h3{font-family:var(--body);font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker-grid button{min-height:44px;width:100%;text-align:left;display:flex;align-items:center;padding:8px 10px;line-height:1.25;font-size:14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-weight:600}
.picker-grid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.legend{gap:12px;font-size:12px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:5px}
.pchip{background:var(--accent);color:var(--on-accent);border-color:transparent}
.schip{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.mrow{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.timer .box{flex-wrap:wrap}
.tlabel{flex-basis:100%;font-size:14px;line-height:1.3}
body.has-timer #app{padding-bottom:calc(140px + var(--safe-bottom))}
.tlabel .tip{opacity:.85;font-size:13px}
.adj{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.adj:first-child{border-top:0}
.adj input{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-size:18px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 40px 0 14px;font-weight:700;font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none;box-shadow:var(--shadow);
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
h1,h2,h3{font-weight:600;letter-spacing:0}
h1{font-size:34px;font-style:italic}
h2{font-size:26px} h3{font-size:21px}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px;text-transform:none;letter-spacing:0}
.brand b{color:var(--rose);font-weight:500;margin:0 2px}
.top{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.card,.day{border-color:transparent;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--accent)}
.stat{background:var(--sunk);border-radius:14px}
.stat .l{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.stat:nth-child(3) .l{color:var(--gold)}
.stat .v{font-weight:500;font-size:30px}
.weekbar span.done{background:var(--rose)} .weekbar span.now{background:var(--accent)}
.btn{border-radius:999px;font-weight:700}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.seg{border-radius:999px;border-color:var(--line)}
.seg button{font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-radius:999px}
.chip{font-weight:700}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.day .idx,.set .sn,.ex .n,.timer .clock,.stat .v,.target b{font-family:var(--display)}
.day .idx{font-weight:500;font-size:24px}
.day .t{font-weight:600;font-size:21px}
.day.next{border-color:transparent;box-shadow:var(--shadow),0 0 0 2px var(--rose) inset}
.ex .name{font-weight:600;font-size:22px}
.ex .n{color:var(--rose);font-style:italic;font-weight:500}
.target{background:var(--sunk);border-color:var(--line)}
.target b{font-weight:600;font-size:19px}
.field input{border-radius:12px;font-family:var(--body);font-weight:700}
.tick{border-radius:12px}
.set.isdone .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.isdone .sn{color:var(--accent)}
.set.isdone input{background:var(--accent-soft)}
.phase{border-left:0;position:relative;padding-left:20px}
.phase::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--rose)}
.check input{accent-color:var(--accent)}
.timer .box{background:var(--accent);color:var(--on-accent);border-radius:20px}
.timer .bar i{background:var(--on-accent)}
.timer .bar{background:rgba(255,255,255,.3)}
.timer .clock{font-weight:500}
nav.tabs{box-shadow:0 -4px 18px rgba(120,60,75,.06);border-top-color:var(--line)}
.sheet{border-radius:24px 24px 0 0}
.banner{background:var(--accent-soft);border-radius:var(--r)}
.toast{background:var(--accent);color:var(--on-accent);border-radius:20px;text-align:center;padding:11px 18px;line-height:1.35;width:max-content;max-width:min(320px,88vw)}
.filters select,.search,#histex{border-radius:12px}
/* Color themes (blush is the default in :root above) */
:root[data-color="green"]{ --bg:#eef3ee; --surface:#ffffff; --sunk:#f4f8f4; --ink:#1d3324; --muted:#6c8072; --line:#dfe8e0;
  --accent:#3f7a52; --accent-soft:#e1efe4; --on-accent:#ffffff; --rose:#8cbf98; --gold:#c9a45c; --pS:#3f7a52; --pF:#4f7f98; --pT:#b5813a;
  --mskin:#e3ece4; --mbase:#bfd3c3; --shadow:0 6px 22px rgba(40,80,50,.08), 0 1px 3px rgba(40,80,50,.06); color-scheme:light; }
:root[data-color="blue"]{ --bg:#eef2f8; --surface:#ffffff; --sunk:#f4f7fb; --ink:#172a45; --muted:#6b7a90; --line:#dde4ee;
  --accent:#3567b0; --accent-soft:#e1eaf7; --on-accent:#ffffff; --rose:#8fb0de; --gold:#e0a458; --pS:#3567b0; --pF:#3d8a86; --pT:#c0802f;
  --mskin:#e3e9f2; --mbase:#bccbe0; --shadow:0 6px 22px rgba(30,50,90,.08), 0 1px 3px rgba(30,50,90,.06); color-scheme:light; }
@media (prefers-color-scheme: dark){
  :root[data-color="green"]:not([data-theme="light"]){ --bg:#111a14; --surface:#18241c; --sunk:#141f18; --ink:#e6f0e8; --muted:#9db3a3; --line:#28392d;
    --accent:#7cc493; --accent-soft:#1f3326; --on-accent:#0e1a12; --rose:#4f8a5f; --gold:#d8b46e; --pS:#7cc493; --mskin:#223127; --mbase:#3a5142; color-scheme:dark; }
  :root[data-color="blue"]:not([data-theme="light"]){ --bg:#0f1520; --surface:#16202f; --sunk:#121a27; --ink:#e5ecf7; --muted:#97a6bd; --line:#26334a;
    --accent:#7ea8ea; --accent-soft:#1d2c45; --on-accent:#0c1422; --rose:#4a6ea8; --gold:#e6b26e; --pS:#7ea8ea; --mskin:#1f2a3c; --mbase:#384a66; color-scheme:dark; }
}
:root[data-theme="dark"][data-color="green"]{ --bg:#111a14; --surface:#18241c; --sunk:#141f18; --ink:#e6f0e8; --muted:#9db3a3; --line:#28392d;
  --accent:#7cc493; --accent-soft:#1f3326; --on-accent:#0e1a12; --rose:#4f8a5f; --gold:#d8b46e; --pS:#7cc493; --mskin:#223127; --mbase:#3a5142; --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark; }
:root[data-theme="dark"][data-color="blue"]{ --bg:#0f1520; --surface:#16202f; --sunk:#121a27; --ink:#e5ecf7; --muted:#97a6bd; --line:#26334a;
  --accent:#7ea8ea; --accent-soft:#1d2c45; --on-accent:#0c1422; --rose:#4a6ea8; --gold:#e6b26e; --pS:#7ea8ea; --mskin:#1f2a3c; --mbase:#384a66; --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark; }
html:root[data-color="noir"]{ --bg:#0f0f0f; --surface:#1a1a1a; --sunk:#141414; --ink:#f5f3ea; --muted:#a19e92; --line:#2c2c2a;
  --accent:#f5c518; --accent-soft:#3a3210; --on-accent:#111111; --rose:#c9a227; --gold:#fff0a8; --pS:#f5c518; --pF:#9fd3c7; --pT:#f0a04b;
  --good:#9ccc65; --good-soft:#1f2a14; --warn:#f0a04b; --warn-soft:#33240f;
  --mskin:#262624; --mbase:#45443e; --shadow:0 6px 22px rgba(0,0,0,.45); color-scheme:dark; }
html:root[data-color="noir"] .brand b{color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
.swatch i{display:flex;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch i b{flex:1}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* Profile dropdown */
.prof-head{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px}
.prof-av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:600}
.prof-chev{color:var(--accent);font-size:18px}

/* ---------- Setup wizard and new screens ---------- */
body.in-setup nav.tabs{display:none}
body.in-setup .wrap{padding-bottom:calc(24px + var(--safe-bottom))}
.ob{max-width:430px;margin:0 auto;min-height:calc(100vh - 80px);padding:2px 0 24px;display:flex;flex-direction:column;gap:16px}
.ob-top{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.ob-back{border:0;background:none;padding:0;font-weight:700;color:var(--muted);font-size:15px}
.ob-step{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ob-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ob-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.ob h1{font-size:31px;line-height:1.08}
.ob .lead{font-size:15px;color:var(--muted);margin:-6px 0 0}
.opt,.gym{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;box-shadow:var(--shadow);border-radius:18px;padding:14px 16px;color:var(--ink)}
.opt .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
.opt b{font-size:17px;display:block}.opt span.d{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.opt.sel .ic{background:var(--accent);color:var(--on-accent)}
.tkb{flex:none;align-self:center;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--on-accent)}
.opt.sel .tkb{background:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.painchip{padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px;color:var(--ink)}
.painchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.health{background:var(--warn-soft);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.45}
.spacer{flex:1}
.cta{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;min-height:52px;font-weight:800;font-size:16px;width:100%;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.later{border:0;background:none;text-align:center;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:-6px;padding:6px}
.result{background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.badge{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.wk{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.wk b{font-family:var(--display);font-size:16px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.lvl{display:block;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;border-radius:18px;padding:12px 14px;color:var(--ink)}
.lvl.sel{border-color:var(--accent)}
.lvl .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl .h b{font-size:16.5px}
.lvlpick{border:0;background:none;padding:0;text-align:left;color:inherit;display:block}
.lvl .more{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.field2{display:flex;flex-direction:column;gap:6px}
.flabel{font-weight:700;font-size:15px}
.field2 .in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-size:17px;font-weight:600;color:var(--ink)}
.inwrap{position:relative;display:block}
.inwrap .in{padding-right:96px}
.inwrap .seg.mini{position:absolute;right:5px;top:50%;transform:translateY(-50%)}
.inwrap .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:700}
.seg.mini button{min-height:34px;padding:4px 10px;font-size:13px}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.eqhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.eqhead b{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.selall{border:0;background:none;padding:0;font-size:13px;font-weight:800;color:var(--accent)}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:700;line-height:1.15;min-height:104px;color:var(--ink)}
.eq svg{width:46px;height:46px;color:var(--ink);opacity:.35}
.eq.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 40%,var(--surface))}
.eq.on svg{color:var(--accent);opacity:1}
.eq .tk{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:12px;display:flex;align-items:center;justify-content:center;color:transparent}
.eq.on .tk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs2{display:flex;gap:8px;background:var(--sunk);padding:4px;border-radius:999px}
.tabs2 button{flex:1;border:0;background:none;padding:9px 0;border-radius:999px;font-weight:800;font-size:14.5px;color:var(--muted)}
.tabs2 button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day7{aspect-ratio:1/1.15;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;gap:2px;color:var(--ink);padding:0}
.day7 small{font-size:10px;font-weight:700;color:var(--muted)}
.day7.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day7.on small{color:var(--on-accent);opacity:.85}
.mins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.min{border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:10px 4px;text-align:center;color:var(--ink)}
.min b{font-family:var(--display);font-size:24px;display:block;line-height:1}
.min span{font-size:11.5px;color:var(--muted);font-weight:700}
.min.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.note2{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:13.5px}
.wday{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px}
.wday .h{display:flex;justify-content:space-between;align-items:baseline}
.wday .h b{font-family:var(--display);font-size:20px}
.wex{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
.wex:first-of-type{border-top:0}
.wex span:last-child{color:var(--muted);white-space:nowrap}
.why{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.why ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.wcard{display:flex;align-items:center;gap:12px;background:var(--surface);box-shadow:var(--shadow);border:0;border-radius:18px;padding:12px 14px;width:100%;color:var(--ink)}
.wcard .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}
.skip{font-size:14px;font-weight:800;color:var(--accent)}
.guide{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px}
.guide ol{margin:6px 0 0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1}
.where{display:flex;align-items:center;gap:10px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:10px 12px;flex-wrap:wrap}
.where .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:14.5px;background:var(--surface);color:var(--ink)}
.wchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wchip svg{width:18px;height:18px}
.adapt{background:var(--accent-soft);border-radius:14px;padding:10px 12px;font-size:13.5px}
.day .idx{font-size:15px;font-family:var(--body);font-weight:800;width:40px}
.day.done .idx{font-size:22px}
/* Week order */
.ordrow{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:8px 8px 8px 12px}
.ordday{flex:none;width:38px;font-weight:800;font-size:14px;color:var(--accent)}
.ordbtn{flex:none;width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px}
.ordbtn:disabled{opacity:.3}
/* Settings sections */
.sec-head{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:16px}
.sec-t{font-family:var(--display);font-size:21px;font-weight:600}
.sec-body{padding:2px 16px 16px;border-top:1px solid var(--line);padding-top:12px}
/* Warm-up / cool-down rows */
.xrow{align-items:center}
.xrow label{font-size:15px}
.xrow.skipped label{opacity:.5;text-decoration:line-through}
.xbtns{display:flex;gap:4px;flex:none}
.xd{display:block;font-size:13.5px}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
/* Progress rings */
.rings{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center;padding:20px}
.rings svg{width:132px;height:132px;display:block}
.rings .ml{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.rings .mv{font-family:var(--display);font-size:28px;font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.rings .mv small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;margin-left:4px}
.rings .m{margin-bottom:10px} .rings .m:last-child{margin-bottom:0}
.rings .r1{color:var(--accent)} .rings .r2{color:var(--rose)} .rings .r3{color:var(--gold)}
@media (prefers-reduced-motion: no-preference){ .rings circle.arc{transition:stroke-dasharray .8s ease} }

/* focus workout flow */
body.in-focus nav.tabs, body.in-focus header.top{display:none}
body.in-focus .wrap{padding-bottom:calc(24px + var(--safe-bottom))}
.focus{display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px)}
.focus h1{font-size:30px;line-height:1.1;margin:2px 0 0}
.focus.fcenter{align-items:center;text-align:center}
.ftop{display:flex;align-items:center;gap:10px;width:100%;padding-top:4px}
.ficon{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ficon.sm{width:40px;height:40px;font-size:22px}
.fsegs{display:flex;gap:4px;flex:1}.fsegs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.fsegs i.d{background:var(--accent)}.fsegs i.c{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ffoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;width:100%;padding-top:6px}
.fbig{min-height:58px;border-radius:18px;font-size:18px;font-weight:800}
.ftarget{margin:2px 0}.ftarget .big{font-size:44px;font-weight:600}.ftarget .mid{font-size:28px}
.fstep{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;min-width:0}
.fstep .fl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fstep .frow{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.fval{display:flex;align-items:baseline;justify-content:center;min-width:0;flex:1}
.fval input{width:100%;max-width:84px;border:0;background:transparent;text-align:center;font-size:34px;font-weight:600;padding:0}
.fval input:focus{outline:2px solid var(--accent);border-radius:8px}
.fval small{font-size:13px;color:var(--muted);margin-left:-2px}
.fdots{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fdot{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:var(--line)}
.fdot.d{background:var(--accent);cursor:pointer}.fdot.c{width:28px;background:var(--accent)}
.fdots .tiny{margin-left:6px}
.fcue{background:var(--sunk);box-shadow:none;border:1px solid var(--line)}
.flinks{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.flinks .linkbtn{text-decoration:none;font-size:15px}
.fring{width:250px;height:250px;margin:4px 0}
.fclock{font-family:var(--display);font-size:60px;font-weight:600;fill:var(--ink)}
.fsub{font-family:var(--body);font-size:15px;font-weight:700;fill:var(--muted)}
.fdone{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto}
.frec{background:var(--accent);color:var(--on-accent);display:flex;justify-content:space-between;align-items:center;gap:10px}
.frec .num{font-size:40px;font-weight:600;line-height:1.1}

function reqFor(e){
  const g=[], n=e.n;
  for(const c of e.eq){
    if(c==='bw') continue;
    if(c==='mc'){ const m=MACH_BY_NAME.find(([re])=>re.test(n)); g.push([m?m[1]:'chestpress']); continue; }
    if(c==='bb'){
      if(/^Trap Bar/.test(n)) g.push(['trap']);
      else if(/^EZ-Bar/.test(n)) g.push(['ez']);
      else if(/^Barbell (Curl|Skull)/.test(n)) g.push(['bb','ez']);
      else { g.push(['bb']); if(RACK_LIFTS.test(n)) g.push(['rack','smith']); }
      continue; }
    if(c==='bn'){
      if(STEP_UPS.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(SPLIT_BENCH.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(INCLINE.test(n)) g.push(['adjb']);
      else g.push(['bn','adjb']);
      continue; }
    if(c==='bx'){ g.push(BOX_STEPS.test(n)?['bx','step','rigstep','bn','adjb']:PLATFORM_JUMPS.test(n)?['bx','step','rigstep']:['bx']); continue; }
    if(c==='bd'){ g.push(/Mini-Band|Banded Clamshell|Banded Glute Bridge/.test(n)?['minib']:['bd']); continue; }
    if(c==='mb'){ g.push(/Slam/.test(n)?['slam','mb']:['mb']); continue; }
    if(c==='cb'){
      if(/^(Lat Pulldown|Close-Grip Lat Pulldown)$/.test(n)) g.push(['pulldown','cb']);
      else if(/^(Single-Arm Lat Pulldown|Straight-Arm Cable Pulldown)$/.test(n)) g.push(['cb','pulldown']);
      else if(n==='Seated Cable Row') g.push(['rowm','cb']);
      else g.push(['cb']);
      continue; }
    g.push([c]);
  }
  return g;
}

  if(AUTH.user||rememberedAcct()){
    const ids=new Map();
    logs.forEach(l=>{ const id=newLogId(); ids.set(l.id,id); l.id=id; });
    for(const d of [state.draft,state.prevBlock&&state.prevBlock.draft]) if(d&&ids.has(d.logId)) d.logId=ids.get(d.logId);
  }
}

async function onSignedIn(u){
  if(AUTH.deleting) return;
  if(CM.owner!==u.id){cmReset(u.id);FB.box=null;FB.unread={app:0,coach:0};FBS={side:'app',tag:'',text:'',busy:false};}
  AUTH.user=u; AUTH.busy=false;
  if(AUTH.access!=='ok' && !(await checkAccess(u))) return;
  if(!AUTH.user || AUTH.user.id!==u.id) return;
  const prevOwner=(rememberedAcct()||{}).id || lsGet('strongstart_owner');
  if((prevOwner && prevOwner!==u.id) || (SYNC.owner && SYNC.owner!==u.id)){
    state=defaults(); logs=[]; SYNC={owner:u.id,base:null,conflict:null,recovery:null};
  }
  SYNC.owner=u.id;
  lsSet(ACCT_KEY,JSON.stringify({id:u.id,email:u.email})); lsSet('strongstart_owner',u.id); lsSet(LOCAL_ONLY_KEY,null);
  if(hsStandalone()) lsSet(HS_WELCOMED,'1');
  AUTH.mode='signin'; AUTH.pw=''; AUTH.err=''; AUTH.msg=''; persistLocal(); render();
  try{
    const [co,ow]=await Promise.all([sb.rpc('is_coach'),sb.rpc('is_app_owner')]);
    if(!AUTH.user || AUTH.user.id!==u.id) return;
    AUTH.coach=!co.error&&co.data===true; FB.owner=!ow.error&&ow.data===true;
    sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',u.id).then(()=>{},()=>{});
    CLOUD.ok=true;
    await pushCloud();
    if(!AUTH.user || AUTH.user.id!==u.id) return;
    if(state.draft && !state.setup && !state.draft.partialSaved) ui.tab='workout';
    render(); refreshUnread();
  }catch(e){ CLOUD.failed=true; setSync(); }
}
function queueCloud(){
  if(coachMode || AUTH.deleting) return;
  if(AUTH.user||rememberedAcct()) CLOUD.pending=true;
  if(CLOUD.busy) CLOUD.again=true;
  clearTimeout(CLOUD.t);
  if(CLOUD.ok && AUTH.user && !SYNC.conflict) CLOUD.t=setTimeout(()=>{CLOUD.t=null;pushCloud();},1200);
  setSync();
}
function pushCloud(){
  if(!CLOUD.ok || !AUTH.user || !sb || coachMode || AUTH.deleting) return Promise.resolve(false);
  clearTimeout(CLOUD.t); CLOUD.t=null;
  if(CLOUD.flight){ CLOUD.again=true; return CLOUD.flight; }
  CLOUD.busy=true; CLOUD.failed=false; setSync();
  const uid=AUTH.user.id, current=()=>AUTH.user&&AUTH.user.id===uid&&!coachMode&&!AUTH.deleting;
  CLOUD.flight=(async()=>{
    await Promise.resolve();
    try{
      for(let attempt=0;attempt<8;attempt++){
        CLOUD.again=false;
        const {data,error}=await sb.rpc('read_account_snapshot');
        if(!current()) return false;
        if(!error && !data){
          const status=await sb.rpc('account_status');
          if(current() && !status.error && status.data==='none'){
            await clearDeletedAccount(); toast('This account is no longer available. Its saved copy was removed from this device.'); return false;
          }
        }
        if(error || !data) throw error||Error('Account unavailable');
        const account=normalizeSnapshot(data), local=deviceSnapshot();
        const merged=mergeSnapshots(SYNC.base,local,account);
        if(merged.conflicts.length){ setSyncConflict(account); return false; }
        adoptSnapshot(merged,account);
        if(!storageOk) throw Error('Device save failed');
        const sent=deviceSnapshot();
        // First commit local changes; only a clean shared snapshot may receive
        // coach changes. A retry after a lost response therefore remains safe.
        const applyCoach=sameSync(sent.state,account.state)&&sameSync(sent.logs,account.logs);
        const response=await sb.rpc('commit_account_snapshot',{
          p_revision:account.revision,p_state:sent.state,p_logs:sent.logs,p_apply_coach:applyCoach
        });
        if(!current()) return false;
        if(response.error) throw response.error;
        if(!response.data || !response.data.snapshot) throw Error('Invalid sync response');
        if(!response.data.ok) continue; // Another device won the revision check. Read and reconcile again.
        const committed=normalizeSnapshot(response.data.snapshot), latest=deviceSnapshot();
        const after=mergeSnapshots(sent,latest,committed);
        if(after.conflicts.length){ SYNC.base=sent; setSyncConflict(committed); return false; }
        adoptSnapshot(after,committed);
        if(!storageOk) throw Error('Device save failed');
        if(response.data.applied) toast(`${coachName()[0].toUpperCase()+coachName().slice(1)} updated your plan`);
        if(!CLOUD.again && sameSync(after.state,committed.state)&&sameSync(after.logs,committed.logs) && applyCoach){
          CLOUD.pending=false; return true;
        }
      }
      throw Error('Account changed repeatedly; retry sync');
    }catch(e){ if(current()){ CLOUD.failed=true; CLOUD.pending=true; } return false; }
    finally{ CLOUD.busy=false; CLOUD.flight=null; setSync(); }
  })();
  return CLOUD.flight;
}
async function flushCloud(){
  clearTimeout(CLOUD.t); CLOUD.t=null;
  if(SYNC.conflict) return false;
  return await pushCloud();
}
async function pullCloud(){
  if(!CLOUD.ok || !AUTH.user || coachMode || CLOUD.busy) return;
  await pushCloud(); refreshUnread();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible') pullCloud();});
window.addEventListener('online',()=>{setSync();if(AUTH.user){if(CLOUD.ok) pullCloud();else onSignedIn(AUTH.user);}});

  if(!AUTH.user || coachMode || !state.block || state.draft) return;
  return await pushCloud(); // Server applies and acknowledges in the save transaction.
}

function authFriendly(e){
  const s=String((e&&(e.message||e.error_description))||e||'');
  if(/invalid login/i.test(s)) return 'That email and password don’t match. Check them, or reset your password.';
  if(/not confirmed/i.test(s)) return 'Please confirm your email first. Look for the link we sent you.';
  if(/already registered|already exists/i.test(s)) return 'There’s already an account with that email. Sign in instead.';
  if(/rate limit|too many/i.test(s)) return 'Too many tries. Wait a few minutes and try again.';
  if(/password/i.test(s) && /(6|8|short|weak|characters)/i.test(s)) return 'Pick a longer password (8 or more characters).';
  if(/fetch|network|timeout/i.test(s)) return 'Can’t reach the internet. Check your connection and try again.';
  return s || 'Something went wrong. Try again.';
}

function cmLiveStart(){

      .on('postgres_changes',{event:'INSERT',schema:'public',table:'coach_messages'},()=>cmLiveSchedule(live))
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'coach_messages'},()=>cmLiveSchedule(live));
    live.channel.subscribe(status=>{if(!cmLiveCurrent(live))return;live.status=status;cmLiveStatus();

function startWorkout(key){
  const w=weekNum();
  state.draft = {key, week:Math.min(w,PROGRAM.blockLen), block:state.block.n, mode:splitN(), place:curPlace().k, startedAt:Date.now(), warm:{}, cool:{}, sets:{}, planCounts:{}, subs:{}, feel:{}};
  for(const s of sessionSlots(key)){
    const t=target(s);
    state.draft.planned=state.draft.planned||{}; state.draft.planned[s.pk]=usesLoad(t.ex)?(t.w ?? t.sug ?? null):null;
    state.draft.sets[s.pk] = Array.from({length:t.sets},(_,i)=>({w: usesLoad(t.ex) ? String(t.w ?? (t.last&&t.last[i]?t.last[i].w:null) ?? t.sug ?? '') : '', r:'', done:false}));
    state.draft.planCounts[s.pk]=t.sets;
  }

function sparkChart(pts,label){
  if(pts.length<1) return '<p class="muted small">No sets logged yet.</p>';
  const W=320,H=150,pl=36,pr=10,pt=12,pb=24;
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi-lo<1){lo-=5;hi+=5;} const pad=(hi-lo)*.1; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=> pts.length===1? (pl+(W-pl-pr)/2) : pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=> pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  const ticks=[lo,(lo+hi)/2,hi];
  const last=pts[pts.length-1], first=pts[0], diff=last.v-first.v;
  return `<div class="row between"><span class="small muted">${label}</span><span class="small"><b class="num">${Math.round(last.v)}</b> ${pts.length>1?`<span class="chip ${diff>=0?'good':'warn'}">${diff>=0?'+':''}${Math.round(diff)}</span>`:''}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} over time">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:2.5}" fill="var(--accent)"/>`).join('')}
    <text x="${pl}" y="${H-6}">${first.d.toLocaleDateString([], {month:'short',day:'numeric'})}</text>
    ${pts.length>1?`<text x="${W-pr}" y="${H-6}" text-anchor="end">${last.d.toLocaleDateString([], {month:'short',day:'numeric'})}</text>`:''}
  </svg>`;
}

const C_STYLES = [['walk','Walk'],['jog','Jog or run'],['bike','Bike'],['row','Rower'],['ellip','Elliptical'],['stairs','Stair climber'],['mix','Mix it up']];

function cGoal(){ return hasGoal('lose')?'lose':hasGoal('health')?'health':hasGoal('sport')?'sport':'lift'; }

function cWhy(){ return {lose:'Burns a little extra for your fat-loss goal. After lifting is the best time for longer cardio.',

  sport:'Builds stamina for your sport without taking away from your lifting.',
  lift:'Good for your heart, and kept this short it won’t hurt your gains.'}[cGoal()]; }
// Cardio picks are stored as "walk,bike" (or "mix" for all of them)
function cStyles(st){ return String(st||'').split(',').filter(Boolean); }
function cToggle(st,v){ if(v==='mix') return st==='mix' ? '' : 'mix'; const a=cStyles(st).filter(x=>x!=='mix'); const i=a.indexOf(v); if(i>=0) a.splice(i,1); else a.push(v); return a.join(','); }
function cStyleLabel(st){ const a=cStyles(st); return a.length ? a.map(k=>(C_STYLES.find(x=>x[0]===k)||['',k])[1]).join(', ') : 'Walk'; }
function cModes(eq){ // cardio types this person can do at this place
  const m=['walk']; if(!lowImpact() && cLevel()>=1) m.push('jog');

function cMode(key, eq){

function gAction(a,b){

    case 'gseg': { closeModal(); const it=gItems(G.ph)[G.i], S=it&&segsFor(it), n=+b.dataset.n; if(!S||!S.segs[n]) return true;
      G.mode='run'; G.s=n; G.tot=S.segs[n].sec; G.end=Date.now()+G.tot*1000; beep(); buzz(150); save(); render(); return true; }
    case 'gskipall': if(G.mode==='paused') G.mode=G.pmode; gNextItem(false); save(); render(); window.scrollTo(0,0); return true;
    case 'gskip': if(G.mode==='paused') G.mode=G.pmode;
      { const it=gItems(G.ph)[G.i]; if(it&&it.phases&&G.mode==='run'){ if(gSeek(it,15)) gNextItem(true); save(); render(); return true; } } gNextItem(false); save(); render(); window.scrollTo(0,0); return true;
    case 'gprev': if(G.mode==='paused'){ G.mode=G.pmode; G.end=Date.now()+G.left; }
      { const it=gItems(G.ph)[G.i]; if(it&&it.phases&&G.mode==='run'){ gSeek(it,-15); save(); render(); return true; } } if(G.mode==='ready'||G.mode==='reps'||G.s===0) G.i=Math.max(0,G.i-1); G.s=0; G.mode='ready'; G.end=Date.now()+READY*1000; save(); render(); return true;
    case 'gpause': if(['ready','run','gap'].includes(G.mode)){ G.pmode=G.mode; G.left=Math.max(0,G.end-Date.now()); G.mode='paused'; save(); } render(); return true;
    case 'gresume': closeModal(); if(G.mode==='paused'){ G.mode=G.pmode; G.end=Date.now()+G.left; save(); } render(); return true;
    case 'ghowto': { const it=gItems(G.ph)[G.i]; if(!it) return true; if(['ready','run','gap'].includes(G.mode)){ G.pmode=G.mode; G.left=Math.max(0,G.end-Date.now()); G.mode='paused'; save(); render(); } modal(gHowTo(it)); return true; }
    case 'gmute': state.settings.sound = state.settings.sound===false; save(); render(); return true;
    case 'glist': d.listView=true; save(); render(); return true;
    case 'gguide': d.listView=false; if(!d.guide || d.guide.ph!==d.step.ph) gStart(d.step.ph); save(); render(); return true;
    case 'gback': G.mode='ready'; G.i=Math.max(0,gItems(G.ph).length-1); G.end=Date.now()+READY*1000; save(); render(); return true;
    case 'framp': d.rampDone=(d.rampDone||0)+1; save(); render(); window.scrollTo(0,0); return true;

function migrate(st){
  if(!st) return st;
  if((st.v||1)<4){
    const old=st.settings||{};
    st.v=4;
    st.settings={units:old.units||'lb', days:[1,3,5], mins:45, bw:old.bw||null, name:old.name||'', age:null, gender:old.gender||'', color:old.color||'blush', goals:[], level:'start', comfort:'machines', pain:[],

    st.places=[]; st.curPlace=null; st.weigh={on:false, day:1, hide:false, list:[]}; st.coach={note:''}; st.checkin=null; st.easeUntil=0;
    if(st.block){ st.block.orig={...(st.block.plan||{})}; }
    st.setup={step:'about', a:{name:old.name||'', bw:old.bw||'', units:old.units||'lb', gender:old.gender||'', color:old.color||'blush', goals:[], places:[], days:[1,3,5], mins:45, pain:[]}};
    st.draft=null; st.onboarded=false; delete st.mySubs;
  }
  st.weigh=st.weigh||{on:false, day:1, hide:false, list:[]}; st.coach=st.coach||{note:''}; st.adj=st.adj||{}; st.ex=st.ex||{};
  if((st.v||4)<5){ st.v=5; if(st.onboarded && st.settings && !st.settings.split){ const n=st.settings.flex?(+st.settings.nDays||3):(st.settings.days||[1,3,5]).length; st.settings.split={2:'ul2',3:'ppl3',4:'ul4',5:'pplul5'}[Math.max(2,Math.min(5,n))]; } }
  if((st.v||5)<6){ st.v=6; st.weightUnits=st.settings.units||'lb'; }
  st.weightUnits=st.weightUnits||st.settings.units||'lb';
  if(st.draft && !st.draft.planCounts) st.draft.planCounts=Object.fromEntries(Object.entries(st.draft.sets||{}).map(([k,v])=>[k,v.length]));
  return st;
}

let timerInt=null, audioCtx=null;
// Phones only let sound start from a tap, and pause it again after a lock, call, headphone change or app switch.
// Every tap re-arms the sound, so a timer that ends later (or was restored after a reload) can still beep.
function unlockAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(audioCtx && audioCtx.state==='closed') audioCtx=null;
    const fresh=!audioCtx; if(fresh) audioCtx=new AC();
    const asleep=audioCtx.state!=='running';
    if(asleep){ const p=audioCtx.resume(); if(p&&p.catch) p.catch(()=>{}); }
    if(fresh||asleep){ const s=audioCtx.createBufferSource(); s.buffer=audioCtx.createBuffer(1,1,22050); s.connect(audioCtx.destination); s.start(0); }
  }catch(e){}
}
['pointerdown','touchend','click','keydown'].forEach(t=>document.addEventListener(t,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && audioCtx) unlockAudio(); });
function tone(freq,vol,dur){
  try{
    if(!audioCtx || state.settings.sound===false) return;
    const play=()=>{ try{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime; o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.start(t); o.stop(t+dur+.01); }catch(e){} };
    if(audioCtx.state==='running') return play();
    // Paused by the phone: try to wake it, but drop the beep if that takes too long to still be useful.
    const asked=Date.now(), p=audioCtx.resume(); if(p&&p.then) p.then(()=>{ if(Date.now()-asked<1500) play(); }).catch(()=>{});
  }catch(e){}
}

function recovery(slot){

  let sec = c.after!=null ? c.after
    : ['squat','hinge','push_h','pull_v','pull_h','sl_knee'].includes(c.s) ? 90

  if(left<=0){ const t=ui.timer; ui.timer=null; clearInterval(timerInt); beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}

let modalReturn=null, modalInert=[];
function focusKey(el){
  if(!el || !el.getAttribute) return null;
  if(el.id) return '#'+CSS.escape(el.id);
  const attrs=['data-action','data-pk','data-id','data-v','data-k','data-tab','data-c','data-g'];
  const parts=attrs.filter(k=>el.hasAttribute(k)).map(k=>'['+k+'="'+CSS.escape(el.getAttribute(k))+'"]');
  return parts.length?parts.join(''):null;
}
function modalFocusables(sheet){
  return [...sheet.querySelectorAll('a[href],button,input,select,textarea,summary,[tabindex]')]
    .filter(el=>!el.disabled && el.tabIndex>=0 && !el.closest('[hidden],[inert]') && el.getClientRects().length);
}
function modal(html){
  const host=$('#modal'), previous=host.querySelector('.sheet'), active=document.activeElement;
  const keep=previous&&previous.contains(active)?focusKey(active):null;
  if(!previous){
    modalReturn={element:active,key:focusKey(active)};
    modalInert=[...document.body.children].filter(el=>el!==host && el.id!=='toast' && !['SCRIPT','STYLE'].includes(el.tagName)).map(el=>[el,el.inert]);
    modalInert.forEach(([el])=>{el.inert=true;});
  }
  host.innerHTML=`<div class="scrim" data-action="closemodal"><div class="sheet" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
  const sheet=host.querySelector('.sheet'), title=sheet.querySelector('h1,h2,h3');
  if(title){ title.id=title.id||'modal-title'; title.tabIndex=-1; sheet.setAttribute('aria-labelledby',title.id); }
  else sheet.setAttribute('aria-label','Strong Start dialog');
  const retained=keep&&sheet.querySelector(keep);
  (retained || sheet.querySelector('[data-modal-initial]') || title || sheet).focus({preventScroll:true});
}
function closeModal(){
  cmClose();
  const host=$('#modal'); if(!host.querySelector('.sheet')) return;
  host.innerHTML=''; confirmCb=null;
  modalInert.forEach(([el,was])=>{el.inert=was;}); modalInert=[];
  const back=modalReturn; modalReturn=null;
  // Callers often rerender after closing. Find the equivalent control after that render.
  setTimeout(()=>{
    if(host.querySelector('.sheet')) return;
    const target=(back&&back.element&&back.element.isConnected&&back.element) || (back&&back.key&&document.querySelector(back.key));
    if(target && !target.disabled && target.getClientRects().length) target.focus({preventScroll:true});
    else { const fallback=$('#app h1, #app h2, #app'); if(fallback){fallback.tabIndex=-1;fallback.focus({preventScroll:true});} }
  },0);
}
document.addEventListener('keydown',e=>{
  const sheet=$('#modal .sheet'); if(!sheet) return;
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closeModal();return;}
  if(e.key!=='Tab') return;
  const items=modalFocusables(sheet), first=items[0], last=items[items.length-1], active=document.activeElement;
  if(!first){e.preventDefault();sheet.focus();return;}
  if(e.shiftKey && (active===first || !items.includes(active))){e.preventDefault();last.focus();}
  else if(!e.shiftKey && (active===last || !items.includes(active))){e.preventDefault();first.focus();}
},true);
document.addEventListener('focusin',e=>{
  const sheet=$('#modal .sheet'); if(sheet&&!sheet.contains(e.target)) sheet.focus({preventScroll:true});
});

function similarity(a,b){
  const words=x=>new Set(x.m.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>2&&!['and','the','with'].includes(w)));
  const wa=words(a), wb=words(b); let ov=0; wa.forEach(w=>{ if(wb.has(w)) ov++; });
  return ov*2 + (a.pl===b.pl?1:0) + (primeEq(a)===primeEq(b)?0.75:0) + (a.uni===b.uni?0.5:0) + (a.t===b.t?0.5:0) + (a.mode===b.mode?0.5:0);
}

  const cur = (slotNow && slotNow.id) || planId(pk);
  const curEx = EX[cur], base=origId(pk);
  const all=candidates(cfg.s, placeEq(state.curPlace||homeBase())).filter(e=>e.id!==cur).map(e=>({e,sc:similarity(curEx,e)+prefBonus(e)*2})).sort((a,b)=>b.sc-a.sc);
  if(base && cur!==base && EX[base] && available(EX[base]) && !all.some(x=>x.e.id===base)) all.unshift({e:EX[base],sc:99});
  const best=all.slice(0,3).map(x=>x.e), rest=all.slice(3).map(x=>x.e).sort((a,b)=>a.n.localeCompare(b.n));

  modal(`<div><div class="eyebrow">${SLOT_NAMES[cfg.s]}</div><h2>Swap ${esc(curEx.n)}</h2>
    <p class="tiny muted" style="margin:4px 0 0">Machine taken or it doesn't feel right? Every option works the same muscles and fits your level. ${inWorkout?'<b>Today</b> swaps it for this workout only. <b>Keep</b> uses it from now on.':'Your swap stays until you change it again.'}</p></div>

    ${rest.length?`<div><div class="eyebrow" style="margin-bottom:2px">Other options</div>${rest.map(row).join('')}</div>`:''}
    <button class="btn block" data-action="libpick" data-pk="${pk}">Not seeing it? Pick from the whole library</button>
    <button class="btn ghost" data-action="closemodal">Close</button>`);

function finishWorkout(){
  const d=state.draft, slots=dSlots(), entries=[], completion=workoutCompletion(d);
  const previous=logs.find(l=>l.id===d.logId);
  d.progressBefore=d.progressBefore||{};
  for(const s of slots){
    const done=(d.sets[s.pk]||[]).filter(x=>x.done && (+x.r>0));
    if(!done.length) continue;
    const old=previous&&previous.entries.find(e=>e.pk===s.pk&&e.ex===s.id);
    const rows=done.map(x=>({w:x.w===''?null:+x.w,r:+x.r})), feel=(d.feel||{})[s.pk]||null;
    let msg;
    if(old && JSON.stringify(old.sets)===JSON.stringify(rows) && old.feel===feel) msg=old.msg;
    else {
      if(!Object.prototype.hasOwnProperty.call(d.progressBefore,s.id)) d.progressBefore[s.id]=JSON.parse(JSON.stringify(state.ex[s.id]||{}));
      state.ex[s.id]=JSON.parse(JSON.stringify(d.progressBefore[s.id]));
      msg=applyProgression(s,done,feel);
    }
    const tg0=target(s);
    entries.push({pk:s.pk, ex:s.id, name:EX[s.id].n, sets:done.map(x=>({w:x.w===''?null:+x.w, r:+x.r})), msg,
      plan:`${tg0.sets}×${usesLoad(tg0.ex)?tg0.lo+'–'+tg0.hi:tg0.r} ${tg0.unit}`, feel:(d.feel||{})[s.pk]||null, planned:(d.planned||{})[s.pk]||null,
      swap: s.placeFrom ? EX[s.placeFrom].n : (origId(s.pk) && s.id!==origId(s.pk) && EX[origId(s.pk)]) ? EX[origId(s.pk)].n : null, today:!!s.sub||!!s.placeFrom, place:s.placeFrom?curPlace().n:null, of:(d.sets[s.pk]||[]).length});
  }
  if(!entries.length){ toast('Mark at least one set done first.'); return; }
  const elapsed=(d.elapsedMs||0)+(d.partialSaved?0:Math.max(0,Date.now()-d.startedAt));
  const l={id:d.logId||newLogId(), date:previous?previous.date:new Date().toISOString(), updatedAt:Math.max(Date.now(),(previous&&previous.updatedAt||0)+1), units:state.settings.units, key:d.key, name:tplOf(d.key).name, block:d.block, week:d.week, mode:d.mode, dur:Math.round(elapsed/60000), entries, ...completion};
  if(d.cardioDone) l.cardio=d.cardioDone;
  logs=logs.filter(x=>x.id!==l.id); logs.unshift(l);
  if(l.status==='partial'){ d.logId=l.id; d.elapsedMs=elapsed; d.partialSaved=true; }
  else state.draft=null;
  fClearTimer(); ui.timer=null; clearInterval(timerInt); save(); pushLog(l);
  ui.tab='today'; render(); window.scrollTo(0,0);
  modal(`<div class="eyebrow">${l.status==='partial'?'Partial workout saved':'Workout saved'}</div><h2>${esc(l.name)} ${l.status==='partial'?'partly finished':'done'}</h2><p class="small muted" style="margin:0">${l.completed} of ${l.planned} sets · ${l.dur} min logged.${l.status==='partial'?' Resume the remaining sets from Today. This does not count as a completed workout.':''} Next targets:</p>
    <div>${entries.map(e=>`<div class="slotrow" style="grid-template-columns:1fr"><div><b>${esc(e.name)}</b><div class="small muted">${esc(e.msg)}</div></div></div>`).join('')}</div>
    <p class="small" style="margin:0">Great job showing up. Don't skip the walk and stretches, and drink some water.</p>
    ${AUTH.user && !AUTH.coach && !coachMode ? `<div class="small" style="background:var(--accent-soft);border-radius:14px;padding:12px">${esc(saveStatus()[2])} Your coach can see this workout after it syncs.</div>
    <div class="row"><button class="btn primary" data-action="closemodal">Done</button><button class="btn" data-action="msgopen" data-side="coach" data-log="${esc(l.id)}">Tell your coach how it went</button></div>` : `<div class="row"><button class="btn primary" data-action="closemodal">Done</button></div>`}`);
}
