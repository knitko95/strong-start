<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strong Start</title>
<meta name="apple-mobile-web-app-title" content="Strong Start">
<meta name="application-name" content="Strong Start">
<meta name="theme-color" content="#9c4d62">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: single phone column, sticky top bar, fixed bottom tab bar; soft white cards on blush, serif for titles and numbers, spaced caps for labels */
:root{
  --bg:#f6eeec; --surface:#ffffff; --sunk:#faf4f3; --ink:#3d1621; --muted:#8c6f76; --line:#ecdfe0;
  --accent:#9c4d62; --accent-soft:#f5e1e6; --on-accent:#ffffff; --rose:#d995a3; --gold:#d8aa6e;
  --good:#5f8a5a; --good-soft:#e7f0e3; --warn:#a8742a; --warn-soft:#f7ecd9;
  --pS:#9c4d62; --pF:#5d8584; --pT:#b5813a;
  --shadow:0 6px 22px rgba(120,60,75,.08), 0 1px 3px rgba(120,60,75,.06);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --mskin:#efe3e5; --mbase:#d8c0c6;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1115; --surface:#26181e; --sunk:#201419; --ink:#f4e7ea; --muted:#b99aa2; --line:#3a2830;
    --accent:#e39aad; --accent-soft:#40232c; --on-accent:#2a0f17; --rose:#c9798a; --gold:#e2b679;
    --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812;
    --pS:#e39aad; --pF:#8cc2c0; --pT:#e2b679; --shadow:0 6px 22px rgba(0,0,0,.35); --mskin:#33232a; --mbase:#4b3540; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1115; --surface:#26181e; --sunk:#201419; --ink:#f4e7ea; --muted:#b99aa2; --line:#3a2830;
  --accent:#e39aad; --accent-soft:#40232c; --on-accent:#2a0f17; --rose:#c9798a; --gold:#e2b679;
  --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812;
  --pS:#e39aad; --pF:#8cc2c0; --pT:#e2b679; --shadow:0 6px 22px rgba(0,0,0,.35); --mskin:#33232a; --mbase:#4b3540; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;min-height:40px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.S{color:var(--pS);border-color:currentColor} .chip.F{color:var(--pF);border-color:currentColor} .chip.T{color:var(--pT);border-color:currentColor}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* Today */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.weekbar{display:flex;gap:4px}
.weekbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.weekbar span.done{background:var(--ink)} .weekbar span.now{background:var(--accent)}
.day{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;text-align:left}
.day .idx{font-family:var(--display);font-size:26px;font-weight:700;width:34px;text-align:center;color:var(--muted)}
.day.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.next .idx{color:var(--accent)}
.day.done .idx{color:var(--good)}
.day .grow{flex:1;min-width:0}
.day .t{font-family:var(--display);font-size:22px;font-weight:700}
/* Workout */
.phase{border-left:4px solid var(--ink);padding-left:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.check label{flex:1}
.ex{padding:0;overflow:hidden}
.ex .head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.ex .name{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.05}
.ex .n{font-family:var(--display);color:var(--accent);font-weight:700;margin-right:6px}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--sunk);padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.target b{font-family:var(--display);font-size:20px}
.sets{padding:8px 16px 12px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px 0}
.set .sn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:18px}
.set.isdone .sn{color:var(--good)}
.field{position:relative}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 34px 0 10px;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.field span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;color:var(--muted)}
.set.isdone .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.isdone input{background:var(--good-soft);border-color:transparent}
.cue{font-size:14px;color:var(--muted)}
.exfoot{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:6}
.timer .in{max-width:560px;margin:0 auto 8px;padding:0 16px}
.timer .box{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .clock{font-family:var(--display);font-size:32px;font-weight:700;min-width:72px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:8px;padding:6px 8px;font-weight:600;font-size:14px}
/* Plan & library */
.slotrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slotrow:first-of-type{border-top:0}
.lib-item{border-top:1px solid var(--line);padding:10px 0}
.lib-item:first-child{border-top:0}
.lib-item button.lt{all:unset;cursor:pointer;display:block;width:100%}
.lib-item .ln{font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.search{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.search{grid-column:1/-1}
/* History */
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist:first-child{border-top:0}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
/* Settings */
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;font-size:12px;font-family:ui-monospace,monospace}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;font-weight:600;font-size:14px;max-width:90%}
@media (prefers-reduced-motion: no-preference){ .timer .bar i{transition:width .9s linear} }

/* Blush theme refinements */
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
:root{ --h1:color-mix(in srgb, var(--rose) 50%, var(--mskin)); --h2:var(--rose); --h3:var(--accent); }
.mthumb{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--sunk);border:1.5px solid var(--line);padding:0;display:inline-flex;align-items:center;justify-content:center}
.mthumb svg{width:100%;height:100%;display:block}
button.mthumb:active{transform:scale(.96)}
.slotrow.mrow3{grid-template-columns:46px 1fr auto;gap:10px}
.musline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.musline .dotp,.musline .dots,.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.musline .dotp{background:var(--accent)} .musline .dots{background:var(--rose);margin-left:6px}
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);border-radius:14px;padding:10px}
.bodybig{width:100%;height:auto;max-height:300px}
.legend{gap:12px;font-size:12px;color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:5px}
.pchip{background:var(--accent);color:var(--on-accent);border-color:transparent}
.schip{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.mrow{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.timer .box{flex-wrap:wrap}
.tlabel{flex-basis:100%;font-size:14px;line-height:1.3}
body.has-timer #app{padding-bottom:140px}
.tlabel .tip{opacity:.85;font-size:13px}
.adj{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.adj:first-child{border-top:0}
.adj input{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-size:18px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 40px 0 14px;font-weight:700;font-size:16px;color:var(--ink);appearance:none;-webkit-appearance:none;box-shadow:var(--shadow);
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
h1,h2,h3{font-weight:600;letter-spacing:0}
h1{font-size:34px;font-style:italic}
h2{font-size:26px} h3{font-size:21px}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:24px;text-transform:none;letter-spacing:0}
.brand b{color:var(--rose);font-weight:500;margin:0 2px}
.top{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.card,.day{border-color:transparent;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:.16em;color:var(--accent)}
.stat{background:var(--sunk);border-radius:14px}
.stat .l{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.stat:nth-child(3) .l{color:var(--gold)}
.stat .v{font-weight:500;font-size:30px}
.weekbar span.done{background:var(--rose)} .weekbar span.now{background:var(--accent)}
.btn{border-radius:999px;font-weight:700}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.seg{border-radius:999px;border-color:var(--line)}
.seg button{font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-radius:999px}
.chip{font-weight:700}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.day .idx,.set .sn,.ex .n,.timer .clock,.stat .v,.target b{font-family:var(--display)}
.day .idx{font-weight:500;font-size:24px}
.day .t{font-weight:600;font-size:21px}
.day.next{border-color:transparent;box-shadow:var(--shadow),0 0 0 2px var(--rose) inset}
.ex .name{font-weight:600;font-size:22px}
.ex .n{color:var(--rose);font-style:italic;font-weight:500}
.target{background:var(--sunk);border-color:var(--line)}
.target b{font-weight:600;font-size:19px}
.field input{border-radius:12px;font-family:var(--body);font-weight:700}
.tick{border-radius:12px}
.set.isdone .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.isdone .sn{color:var(--accent)}
.set.isdone input{background:var(--accent-soft)}
.phase{border-left:0;position:relative;padding-left:20px}
.phase::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--rose)}
.check input{accent-color:var(--accent)}
.timer .box{background:var(--accent);color:var(--on-accent);border-radius:20px}
.timer .bar i{background:var(--on-accent)}
.timer .bar{background:rgba(255,255,255,.3)}
.timer .clock{font-weight:500}
nav.tabs{box-shadow:0 -4px 18px rgba(120,60,75,.06);border-top-color:var(--line)}
.sheet{border-radius:24px 24px 0 0}
.banner{background:var(--accent-soft);border-radius:var(--r)}
.toast{background:var(--accent);color:var(--on-accent);border-radius:20px;text-align:center;padding:11px 18px;line-height:1.35;width:max-content;max-width:min(320px,88vw)}
.filters select,.search,#histex{border-radius:12px}
/* Color themes (blush is the default in :root above) */
:root[data-color="green"]{ --bg:#eef3ee; --surface:#ffffff; --sunk:#f4f8f4; --ink:#1d3324; --muted:#6c8072; --line:#dfe8e0;
  --accent:#3f7a52; --accent-soft:#e1efe4; --on-accent:#ffffff; --rose:#8cbf98; --gold:#c9a45c; --pS:#3f7a52; --pF:#4f7f98; --pT:#b5813a;
  --mskin:#e3ece4; --mbase:#bfd3c3; --shadow:0 6px 22px rgba(40,80,50,.08), 0 1px 3px rgba(40,80,50,.06); color-scheme:light; }
:root[data-color="blue"]{ --bg:#eef2f8; --surface:#ffffff; --sunk:#f4f7fb; --ink:#172a45; --muted:#6b7a90; --line:#dde4ee;
  --accent:#3567b0; --accent-soft:#e1eaf7; --on-accent:#ffffff; --rose:#8fb0de; --gold:#e0a458; --pS:#3567b0; --pF:#3d8a86; --pT:#c0802f;
  --mskin:#e3e9f2; --mbase:#bccbe0; --shadow:0 6px 22px rgba(30,50,90,.08), 0 1px 3px rgba(30,50,90,.06); color-scheme:light; }
@media (prefers-color-scheme: dark){
  :root[data-color="green"]:not([data-theme="light"]){ --bg:#111a14; --surface:#18241c; --sunk:#141f18; --ink:#e6f0e8; --muted:#9db3a3; --line:#28392d;
    --accent:#7cc493; --accent-soft:#1f3326; --on-accent:#0e1a12; --rose:#4f8a5f; --gold:#d8b46e; --pS:#7cc493; --mskin:#223127; --mbase:#3a5142; color-scheme:dark; }
  :root[data-color="blue"]:not([data-theme="light"]){ --bg:#0f1520; --surface:#16202f; --sunk:#121a27; --ink:#e5ecf7; --muted:#97a6bd; --line:#26334a;
    --accent:#7ea8ea; --accent-soft:#1d2c45; --on-accent:#0c1422; --rose:#4a6ea8; --gold:#e6b26e; --pS:#7ea8ea; --mskin:#1f2a3c; --mbase:#384a66; color-scheme:dark; }
}
:root[data-theme="dark"][data-color="green"]{ --bg:#111a14; --surface:#18241c; --sunk:#141f18; --ink:#e6f0e8; --muted:#9db3a3; --line:#28392d;
  --accent:#7cc493; --accent-soft:#1f3326; --on-accent:#0e1a12; --rose:#4f8a5f; --gold:#d8b46e; --pS:#7cc493; --mskin:#223127; --mbase:#3a5142; --good:#8fc18a; --good-soft:#1f2e1f; --warn:#e2b061; --warn-soft:#352812; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark; }
:root[data-theme="dark"][data-color="blue"]{ --bg:#0f1520; --surface:#16202f; --sunk:#121a27; --ink:#e5ecf7; --muted:#97a6bd; --line:#26334a;

function reqFor(e){

    if(c==='mc'){ const m=MACH_BY_NAME.find(([re])=>re.test(n)); g.push([m?m[1]:'chestpress']); continue; }
    if(c==='bb'){
      if(/^Trap Bar/.test(n)) g.push(['trap']);
      else if(/^EZ-Bar/.test(n)) g.push(['ez']);
      else if(/^Barbell (Curl|Skull)/.test(n)) g.push(['bb','ez']);
      else { g.push(['bb']); if(RACK_LIFTS.test(n)) g.push(['rack','smith']); }
      continue; }
    if(c==='bn'){
      if(STEP_UPS.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(SPLIT_BENCH.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(INCLINE.test(n)) g.push(['adjb']);
      else g.push(['bn','adjb']);
      continue; }
    if(c==='bx'){ g.push(BOX_STEPS.test(n)?['bx','step','rigstep','bn','adjb']:PLATFORM_JUMPS.test(n)?['bx','step','rigstep']:['bx']); continue; }
    if(c==='bd'){ g.push(/Mini-Band|Banded Clamshell|Banded Glute Bridge/.test(n)?['minib']:['bd']); continue; }
    if(c==='mb'){ g.push(/Slam/.test(n)?['slam','mb']:['mb']); continue; }
    if(c==='cb'){
      if(/^(Lat Pulldown|Close-Grip Lat Pulldown)$/.test(n)) g.push(['pulldown','cb']);

      else if(n==='Seated Cable Row') g.push(['rowm','cb']);
      else g.push(['cb']);
      continue; }
    g.push([c]);
  }
  return g;
}

  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==='PASSWORD_RECOVERY'){ AUTH.recovery=true; AUTH.err=''; AUTH.msg=''; render(); }
    const u=session&&session.user||null;
    if(u && (!AUTH.user || AUTH.user.id!==u.id)){ AUTH.user=u; setTimeout(()=>onSignedIn(u),0); }   // never await Supabase inside this callback
  });
  try{
    const {data}=await withTimeout(sb.auth.getSession(),8000);
    const u=data&&data.session&&data.session.user;
    if(u){ if(!AUTH.user){ AUTH.user=u; onSignedIn(u); } }
    else if(rememberedAcct() && navigator.onLine){ lsSet(ACCT_KEY,null); }   // signed out elsewhere or session expired: ask to sign in again
    else if(rememberedAcct()) setSync('off');
  }catch(e){ if(rememberedAcct()) setSync('off'); }
  AUTH.ready=true; render();
  if(!AUTH.user && !rememberedAcct()) setSync('local');
}

async function onSignedIn(u){
  const prevOwner=(rememberedAcct()||{}).owner || lsGet('strongstart_owner');
  if(prevOwner && prevOwner!==u.id){ state=defaults(); state.updatedAt=0; logs=[]; }   // this phone held someone else's data
  lsSet(ACCT_KEY, JSON.stringify({id:u.id, email:u.email})); lsSet('strongstart_owner',u.id); lsSet(LOCAL_ONLY_KEY,null);
  AUTH.mode='signin'; AUTH.pw=''; AUTH.err=''; AUTH.msg='';
  render();
  try{
    setSync('saving');
    const [st,lg,co]=await Promise.all([
      sb.from('app_state').select('state,updated_at').eq('user_id',u.id).maybeSingle(),
      sb.from('workout_logs').select('id,data').eq('user_id',u.id).order('date',{ascending:false}),
      sb.rpc('is_coach')
    ]);
    if(st.error) throw st.error; if(lg.error) throw lg.error;
    AUTH.coach=!co.error && co.data===true;
    const rs=st.data&&st.data.state, rl=(lg.data||[]).map(r=>r.data);
    CLOUD.written={}; rl.forEach(l=>CLOUD.written[l.id]=JSON.stringify(l));
    // Workouts: keep every one from both places. Setup and plan: keep the newer copy.
    const byId=new Map(); rl.concat(logs).forEach(l=>{ if(l&&l.id&&!byId.has(l.id)) byId.set(l.id,l); });
    const merged=[...byId.values()].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const remoteNewer = rs && substantive(rs,rl) && (!substantive(state,[]) || (+st.data.updated_at||0) >= (state.updatedAt||0));
    if(remoteNewer && !coachMode){ state=migrate(rs); CLOUD.stateJson=JSON.stringify(state); if(state.block && state.places && state.places.length) ensurePlan(); }
    if(!coachMode){ logs=merged; persistLocal(); }
    CLOUD.ok=true; CLOUD.name=undefined;
    sb.from('profiles').update({last_seen:new Date().toISOString()}).eq('id',u.id).then(()=>{},()=>{});
    if(!coachMode){
      if(state.draft && !state.setup && ui.tab!=='workout') ui.tab='workout';
      render(); await pushCloud(); await applyPlanUpdates();
    } else render();
    setSync('cloud');
  }catch(e){ CLOUD.ok=!!AUTH.user; setSync('off'); }
}

function queueCloud(){ if(!CLOUD.ok || !AUTH.user) return; clearTimeout(CLOUD.t); CLOUD.t=setTimeout(pushCloud,1200); }
async function pushCloud(){
  if(!CLOUD.ok || !AUTH.user || coachMode) return; if(CLOUD.busy){ CLOUD.again=true; return; }
  CLOUD.busy=true; CLOUD.failed=false; setSync('saving');
  try{
    const uid=AUTH.user.id, sj=JSON.stringify(state);
    if(sj!==CLOUD.stateJson){ const {error}=await sb.from('app_state').upsert({user_id:uid, state, updated_at:state.updatedAt||Date.now(), saved_at:new Date().toISOString()}); if(error) throw error; CLOUD.stateJson=sj; }
    const ids=new Set(), rows=[];
    for(const l of logs){ if(!l.id) l.id='log-'+(Date.parse(l.date)||Date.now()); ids.add(l.id); const j=JSON.stringify(l); if(CLOUD.written[l.id]!==j) rows.push({user_id:uid, id:l.id, date:l.date||new Date().toISOString(), data:l}); }
    if(rows.length){ const {error}=await sb.from('workout_logs').upsert(rows); if(error) throw error; rows.forEach(r=>CLOUD.written[r.id]=JSON.stringify(r.data)); }
    const gone=Object.keys(CLOUD.written).filter(id=>!ids.has(id));
    if(gone.length){ const {error}=await sb.from('workout_logs').delete().eq('user_id',uid).in('id',gone); if(error) throw error; gone.forEach(id=>delete CLOUD.written[id]); }
    const nm=(state.settings&&state.settings.name)||null;
    if(nm!==CLOUD.name){ const {error}=await sb.from('profiles').update({name:nm}).eq('id',uid); if(!error) CLOUD.name=nm; }
    setSync('cloud');
  }catch(e){ CLOUD.failed=true; setSync('off'); }
  CLOUD.busy=false; if(CLOUD.again){ CLOUD.again=false; pushCloud(); }
}
// Coming back to the app: send anything that didn't go through, and pick up changes from another device or the coach
async function pullCloud(){
  if(!CLOUD.ok || !AUTH.user || coachMode || CLOUD.busy) return;
  if(CLOUD.failed){ await pushCloud(); if(CLOUD.failed) return; }
  try{
    const {data,error}=await sb.from('app_state').select('updated_at').eq('user_id',AUTH.user.id).maybeSingle();
    if(!error && data && (+data.updated_at||0) > (state.updatedAt||0) && !state.draft){ AUTH.user && onSignedIn(AUTH.user); return; }
    await applyPlanUpdates();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') pullCloud(); });
window.addEventListener('online',()=>{ if(AUTH.user) pullCloud(); });

function applyPlanCode(o){ state.block.plan={...state.block.plan,...o.plan}; if(o.orig) state.block.orig=o.orig; state.adj=o.adj||{}; state.coach={note:o.note||''}; if(o.level&&LEVELS[o.level]) state.settings.level=o.level; }
async function applyPlanUpdates(){
  if(!AUTH.user || coachMode || !state.block || state.draft) return;   // never change a plan mid-workout; it waits for next time
  const {data,error}=await sb.from('plan_updates').select('id,update').eq('user_id',AUTH.user.id).is('applied_at',null).order('id');
  if(error || !data || !data.length) return;
  for(const r of data){ if(r.update && r.update.plan) applyPlanCode(r.update); }
  const {error:e2}=await sb.from('plan_updates').update({applied_at:new Date().toISOString()}).in('id',data.map(r=>r.id));
  if(e2) return;
  save(); render(); toast(`${coachName()[0].toUpperCase()+coachName().slice(1)} updated your plan`);
}

function authFriendly(e){
  const s=String((e&&(e.message||e.error_description))||e||'');
  if(/invalid login/i.test(s)) return 'That email and password don’t match. Check them, or reset your password.';
  if(/not confirmed/i.test(s)) return 'Please confirm your email first. Look for the link we sent you.';
  if(/already registered|already exists/i.test(s)) return 'There’s already an account with that email. Sign in instead.';
  if(/rate limit|too many/i.test(s)) return 'Too many tries. Wait a few minutes and try again.';
  if(/password/i.test(s) && /(6|8|short|weak|characters)/i.test(s)) return 'Pick a longer password (8 or more characters).';
  if(/fetch|network|timeout/i.test(s)) return 'Can’t reach the internet. Check your connection and try again.';
  return s || 'Something went wrong. Try again.';
}
async function authSubmit(kind){
  if(AUTH.busy) return;
  const em=($('#au-email')||{}).value, p=($('#au-pw')||{}).value;
  if(em!=null) AUTH.email=em.trim(); if(p!=null) AUTH.pw=p;
  AUTH.err=''; AUTH.msg='';
  if(kind!=='recovery' && !/^\S+@\S+\.\S+$/.test(AUTH.email)){ AUTH.err='Enter your email address.'; render(); return; }
  if(kind!=='forgot' && (AUTH.pw||'').length<8){ AUTH.err='Your password needs 8 or more characters.'; render(); return; }
  AUTH.busy=true; render();
  try{
    if(kind==='signin'){ const {error}=await sb.auth.signInWithPassword({email:AUTH.email, password:AUTH.pw}); if(error) throw error; }
    else if(kind==='signup'){ const {data,error}=await sb.auth.signUp({email:AUTH.email, password:AUTH.pw, options:{emailRedirectTo:SITE_URL}}); if(error) throw error;
      if(!data.session){ if(data.user && Array.isArray(data.user.identities) && !data.user.identities.length) throw {message:'already registered'}; AUTH.mode='check'; AUTH.pw=''; } }
    else if(kind==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(AUTH.email,{redirectTo:SITE_URL}); if(error) throw error;
      AUTH.msg='If that email has an account, a reset link is on its way. No email after a few minutes? Ask your coach to help.'; }
    else if(kind==='recovery'){ const {error}=await sb.auth.updateUser({password:AUTH.pw}); if(error) throw error; AUTH.recovery=false; AUTH.pw=''; toast('Password saved'); }
  }catch(e){ AUTH.err=authFriendly(e); }
  AUTH.busy=false; render();
}
function authAction(a,b){
  if(a==='authmode'){ AUTH.mode=b.dataset.v; AUTH.err=''; AUTH.msg=''; render(); window.scrollTo(0,0); }
  else if(a==='authlocal'){ lsSet(LOCAL_ONLY_KEY,'1'); render(); setSync('local'); }
  else if(a==='authstart'){ lsSet(LOCAL_ONLY_KEY,null); AUTH.mode=b.dataset.v||'signup'; render(); window.scrollTo(0,0); }
  else if(a==='authout') confirmBox('Sign out?','Everything is saved to your account. This phone forgets it until you sign in again.','Sign out',signOut);
}

function ringStats(w, keys, wl, o){
  const L=o.L, wk=Math.min(w,L), perWeek=keys.length;
  const blockTotal = o.total + Math.max(0,perWeek-wl.length) + Math.max(0,L-wk)*perWeek;
  const fmtLeft=(n,u)=> n<=0 ? 'done!' : `${n} ${u}${n===1?'':'s'} to go`;
  return [
    {cls:'r1', label:'This week', v:wl.length, of:perWeek, unit:'workouts', sub: fmtLeft(perWeek-wl.length,'workout')},

      <button class="btn sm ghost" data-action="dellog" data-id="${l.id}" style="align-self:flex-start">Delete session</button></div>`:''}
  </div>`).join('')||'<p class="muted small" style="margin:0">No sessions yet.</p>'}</div></section>`;

function sparkChart(pts,label){
  if(pts.length<1) return '<p class="muted small">No sets logged yet.</p>';
  const W=320,H=150,pl=36,pr=10,pt=12,pb=24;
  const vs=pts.map(p=>p.v); let lo=Math.min(...vs), hi=Math.max(...vs); if(hi-lo<1){lo-=5;hi+=5;} const pad=(hi-lo)*.1; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=> pts.length===1? (pl+(W-pl-pr)/2) : pl+i*(W-pl-pr)/(pts.length-1);
  const y=v=> pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(pts.length-1).toFixed(1)},${H-pb}L${x(0).toFixed(1)},${H-pb}Z`;
  const ticks=[lo,(lo+hi)/2,hi];
  const last=pts[pts.length-1], first=pts[0], diff=last.v-first.v;
  return `<div class="row between"><span class="small muted">${label}</span><span class="small"><b class="num">${Math.round(last.v)}</b> ${pts.length>1?`<span class="chip ${diff>=0?'good':'warn'}">${diff>=0?'+':''}${Math.round(diff)}</span>`:''}</span></div>
  <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)} over time">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:2.5}" fill="var(--accent)"/>`).join('')}
    <text x="${pl}" y="${H-6}">${first.d.toLocaleDateString([], {month:'short',day:'numeric'})}</text>
    ${pts.length>1?`<text x="${W-pr}" y="${H-6}" text-anchor="end">${last.d.toLocaleDateString([], {month:'short',day:'numeric'})}</text>`:''}
  </svg>`;
}

/* ---------------- Setup wizard ---------------- */
const SETUP_ORDER = ['about','goal','places','equip','routine','last','years','comfort','style','pain','cardio','schedule','result','week1'];
function setupSteps(a){ return SETUP_ORDER.filter(k => k==='style' ? needStyle(a.places) : k==='last' ? a.routine==='yes' : k==='years' ? (a.routine==='yes' && (a.last==='still'||a.last==='month')) : true); }
function computeLevel(a){
  if(a.routine!=='yes' || a.last==='more6') return 'start';
  if(a.last==='1to6') return a.comfort==='learning' ? 'start' : 'back';
  let L = (a.years==='1to3' || a.years==='3plus') ? 'up' : 'regular';
  if(a.comfort==='learning') L='back';
  return L;
}
function prefillSetup(){
  const s=state.settings||{};
  return {name:s.name||'', age:s.age||'', bw:s.bw||'', units:s.units||'lb', gender:s.gender||'', color:s.color||'blush', goals:(s.goals||[]).slice(),
    places:(state.places||[]).map(p=>({k:p.k, eq:p.eq.slice()})), days:(s.days&&s.days.length?s.days:[1,3,5]).slice(), mins:s.mins||45, flex:!!s.flex, nDays:s.nDays||3, pain:(s.pain||[]).slice(), painNone:!(s.pain||[]).length, comfort:s.comfort||'', level:s.level||null,
    tstyle:s.tstyleAuto?null:(s.tstyle||null), cstyle:s.cardio&&s.cardio.style||null, cjog:s.cardio&&s.cardio.jog||null};
}
function startSetup(prefill){ state.setup={step:'about', a: prefill ? prefillSetup() : {units:'lb', color:'blush', goals:[], places:[], days:[1,3,5], mins:45, pain:[]}}; }
function suOpt(action, val, ic, t, d, sel, check){
  return `<button class="opt ${sel?'sel':''}" data-action="${action}" data-v="${val}" aria-pressed="${!!sel}"><span class="ic">${ic}</span><span style="flex:1"><b>${t}</b>${d?`<span class="d">${d}</span>`:''}</span>${check?`<span class="tkb">${sel?'&#10003;':''}</span>`:''}</button>`;
}
function eqGrid(eqArr, action){
  const on=new Set(eqArr);
  return EQ_GROUPS.map(([sec,items],gi)=>{ const n=items.filter(([k])=>on.has(k)).length, all=n===items.length;
    return `<div class="eqhead"><b>${esc(sec)}</b><span class="tiny muted">${n} of ${items.length} · <button class="selall" data-action="${action}all" data-g="${gi}" data-on="${all?0:1}">${all?'Clear':'Select all'}</button></span></div>
      <div class="eqgrid">${items.map(([k,l])=>`<button class="eq ${on.has(k)?'on':''}" data-action="${action}" data-k="${k}" aria-pressed="${on.has(k)}"><span class="tk">&#10003;</span>${EQ_ICON[k]||EQ_ICON.mcgen}<span>${esc(l)}</span></button>`).join('')}</div>`; }).join('');
}
function setupValid(step,a){
  if(step==='goal') return a.goals.length>0;
  if(step==='places') return a.places.length>0;
  if(step==='routine') return !!a.routine;
  if(step==='last') return !!a.last;
  if(step==='years') return !!a.years;

}

function gAction(a,b){
  const d=state.draft, G=d&&d.guide; if(!d) return false;

    case 'gcmin': d.cmin=+b.dataset.v; d._x=null; save(); render(); return true;
    case 'gfin': G.fin=b.dataset.v; G.mode='ready'; G.i=0; G.end=Date.now()+READY*1000; save(); render(); return true;
    case 'gnow': G.end=Date.now(); gAdvance(); save(); render(); return true;
    case 'gdone': gNextItem(true); save(); render(); window.scrollTo(0,0); return true;
    case 'gseg': { closeModal(); const it=gItems(G.ph)[G.i], S=it&&segsFor(it), n=+b.dataset.n; if(!S||!S.segs[n]) return true;
      G.mode='run'; G.s=n; G.tot=S.segs[n].sec; G.end=Date.now()+G.tot*1000; beep(); buzz(150); save(); render(); return true; }
    case 'gskipall': if(G.mode==='paused') G.mode=G.pmode; gNextItem(false); save(); render(); window.scrollTo(0,0); return true;
    case 'gskip': if(G.mode==='paused') G.mode=G.pmode;
      { const it=gItems(G.ph)[G.i]; if(it&&it.phases&&G.mode==='run'){ if(gSeek(it,15)) gNextItem(true); save(); render(); return true; } } gNextItem(false); save(); render(); window.scrollTo(0,0); return true;
    case 'gprev': if(G.mode==='paused'){ G.mode=G.pmode; G.end=Date.now()+G.left; }
      { const it=gItems(G.ph)[G.i]; if(it&&it.phases&&G.mode==='run'){ gSeek(it,-15); save(); render(); return true; } } if(G.mode==='ready'||G.mode==='reps'||G.s===0) G.i=Math.max(0,G.i-1); G.s=0; G.mode='ready'; G.end=Date.now()+READY*1000; save(); render(); return true;
    case 'gpause': if(['ready','run','gap'].includes(G.mode)){ G.pmode=G.mode; G.left=Math.max(0,G.end-Date.now()); G.mode='paused'; save(); } render(); return true;
    case 'gresume': closeModal(); if(G.mode==='paused'){ G.mode=G.pmode; G.end=Date.now()+G.left; save(); } render(); return true;
    case 'ghowto': { const it=gItems(G.ph)[G.i]; if(!it) return true; if(['ready','run','gap'].includes(G.mode)){ G.pmode=G.mode; G.left=Math.max(0,G.end-Date.now()); G.mode='paused'; save(); render(); } modal(gHowTo(it)); return true; }
    case 'gmute': state.settings.sound = state.settings.sound===false; save(); render(); return true;
    case 'glist': d.listView=true; save(); render(); return true;
    case 'gguide': d.listView=false; if(!d.guide || d.guide.ph!==d.step.ph) gStart(d.step.ph); save(); render(); return true;
    case 'gback': G.mode='ready'; G.i=Math.max(0,gItems(G.ph).length-1); G.end=Date.now()+READY*1000; save(); render(); return true;
    case 'framp': d.rampDone=(d.rampDone||0)+1; save(); render(); window.scrollTo(0,0); return true;
    case 'frampskip': d.rampDone=99; save(); render(); return true;
  }

}

function migrate(st){

    const old=st.settings||{};
    st.v=4;
    st.settings={units:old.units||'lb', days:[1,3,5], mins:45, bw:old.bw||null, name:old.name||'', age:null, gender:old.gender||'', color:old.color||'blush', goals:[], level:'start', comfort:'machines', pain:[],
      autoRest:old.autoRest, betweenTimer:old.betweenTimer, sound:old.sound};
    st.places=[]; st.curPlace=null; st.weigh={on:false, day:1, hide:false, list:[]}; st.coach={note:''}; st.checkin=null; st.easeUntil=0;
    if(st.block){ st.block.orig={...(st.block.plan||{})}; }
    st.setup={step:'about', a:{name:old.name||'', bw:old.bw||'', units:old.units||'lb', gender:old.gender||'', color:old.color||'blush', goals:[], places:[], days:[1,3,5], mins:45, pain:[]}};
    st.draft=null; st.onboarded=false; delete st.mySubs;
  }
  st.weigh=st.weigh||{on:false, day:1, hide:false, list:[]}; st.coach=st.coach||{note:''}; st.adj=st.adj||{}; st.ex=st.ex||{};
  if((st.v||4)<5){ st.v=5; if(st.onboarded && st.settings && !st.settings.split){ const n=st.settings.flex?(+st.settings.nDays||3):(st.settings.days||[1,3,5]).length; st.settings.split={2:'ul2',3:'ppl3',4:'ul4',5:'pplul5'}[Math.max(2,Math.min(5,n))]; } }
  return st;
}

function recovery(slot){
  const ex=EX[slot.id], c=slot.cfg;
  let sec = c.after!=null ? c.after
    : ['squat','hinge','push_h','pull_v','pull_h','sl_knee'].includes(c.s) ? 90
    : 60;
  return {sec, tip:RECOVER_TIPS[c.s]||'Walk and breathe.'};
}
function startRest(sec, info={}){
  try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  if(!sec) return;
  ui.timer={end:Date.now()+sec*1000,total:sec,label:info.label||'Rest',tip:info.tip||'',next:info.next||''};
  clearInterval(timerInt); timerInt=setInterval(tick,500); renderTimer();
}
function beep(){ try{ if(!audioCtx || state.settings.sound===false) return; const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(.2,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6); o.start(); o.stop(audioCtx.currentTime+.6);}catch(e){} }
function tick(){
  if(!ui.timer) return;
  const left=Math.ceil((ui.timer.end-Date.now())/1000);
  if(left<=0){ const t=ui.timer; ui.timer=null; clearInterval(timerInt); beep(); try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
    const d=state.draft; if(d&&d.step) delete d.step.tEnd;
    if(d && d.step && ui.tab==='workout' && !$('#modal').innerHTML){ if(d.step.ph==='rest'){ d.step.ph='ex'; save(); render(); toast('Rest is up. Next set.'); return; } if(d.step.ph==='exdone'){ render(); toast(`Ready: ${t.next}`); return; } }
    renderTimer(); toast(t.label==='Recover'?`Ready: ${t.next}`:'Rest done. Next set.'); return; }
  const fc=document.getElementById('fclock'); if(fc){ fc.textContent=mmss(left); const fr=document.getElementById('fring'); if(fr){ const C=2*Math.PI*110; fr.setAttribute('stroke-dasharray',`${(C*left/ui.timer.total).toFixed(1)} ${C.toFixed(1)}`); } }
  const c=document.querySelector('.timer .clock'), b=document.querySelector('.timer .bar i');
  if(c){ c.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`; b.style.width=`${100*left/ui.timer.total}%`; } else renderTimer();
}
function renderTimer(){
  const el=$('#timer');
  const inF = ui.tab==='workout' && state.draft;
  document.body.classList.toggle('has-timer',!!ui.timer && !inF);
  if(!ui.timer || inF){ el.innerHTML=''; return; }
  const left=Math.max(0,Math.ceil((ui.timer.end-Date.now())/1000));
  const T=ui.timer;
  el.innerHTML=`<div class="timer"><div class="in"><div class="box" role="timer" aria-label="${esc(T.label)} timer">
    ${T.label==='Recover'?`<div class="tlabel"><b>Recover</b> · next: ${esc(T.next)}<div class="tip">${esc(T.tip)}</div></div>`:''}
    <span class="clock num">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</span><span class="bar"><i style="width:${100*left/ui.timer.total}%"></i></span>
    <button data-action="tadd" data-sec="-15">−15</button><button data-action="tadd" data-sec="15">+15</button><button data-action="tskip">Skip</button></div></div></div>`;
}

function toast(t){ const el=$('#toast'); el.innerHTML=`<div class="toast" role="status">${esc(t)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>el.innerHTML='',2600); }

function similarity(a,b){
  const words=x=>new Set(x.m.toLowerCase().split(/[^a-z]+/).filter(w=>w.length>2&&!['and','the','with'].includes(w)));
  const wa=words(a), wb=words(b); let ov=0; wa.forEach(w=>{ if(wb.has(w)) ov++; });
  return ov*2 + (a.pl===b.pl?1:0) + (primeEq(a)===primeEq(b)?0.75:0) + (a.uni===b.uni?0.5:0) + (a.t===b.t?0.5:0) + (a.mode===b.mode?0.5:0);
}
function swapSheet(pk){
  const [k,i]=pk.split('.'), cfg=TPL[k].slots[+i];
  const inWorkout = ui.tab==='workout' && state.draft && state.draft.sets[pk];
  const slotNow = (inWorkout?dSlots():Object.keys(TPL).flatMap(()=>[]).concat(weekKeys().flatMap(sessionSlots))).find(x=>x.pk===pk);
  const cur = (slotNow && slotNow.id) || planId(pk);
  const curEx = EX[cur], base=origId(pk);
  const all=candidates(cfg.s, placeEq(state.curPlace||homeBase())).filter(e=>e.id!==cur).map(e=>({e,sc:similarity(curEx,e)+prefBonus(e)*2})).sort((a,b)=>b.sc-a.sc);
  if(base && cur!==base && EX[base] && available(EX[base]) && !all.some(x=>x.e.id===base)) all.unshift({e:EX[base],sc:99});
  const best=all.slice(0,3).map(x=>x.e), rest=all.slice(3).map(x=>x.e).sort((a,b)=>a.n.localeCompare(b.n));
  const row=e=>`<div class="slotrow mrow3">${musThumb(e.id)}<div><div style="font-weight:600">${esc(e.n)}${e.id===base?` <span class="chip acc">Original pick</span>`:''}</div>${musLine(e.id)}<div class="tiny muted">${eqLabelList(e).join(' · ')||'No equipment'}</div></div>
    <div class="row" style="flex-wrap:nowrap">${inWorkout?`<button class="btn sm primary" data-action="subtoday" data-pk="${pk}" data-id="${e.id}">Today</button>`:''}<button class="btn sm" data-action="doswap" data-pk="${pk}" data-id="${e.id}">${inWorkout?'Keep':'Use'}</button></div></div>`;
  modal(`<div><div class="eyebrow">${SLOT_NAMES[cfg.s]}</div><h2>Swap ${esc(curEx.n)}</h2>
    <p class="tiny muted" style="margin:4px 0 0">Machine taken or it doesn't feel right? Every option works the same muscles and fits your level. ${inWorkout?'<b>Today</b> swaps it for this workout only. <b>Keep</b> uses it from now on.':'Your swap stays until you change it again.'}</p></div>
    ${inWorkout&&state.draft.subs&&state.draft.subs[pk]?`<button class="btn sm" data-action="unsub" data-pk="${pk}">Go back to ${esc(EX[planId(pk)].n)} for today</button>`:''}
    <div><div class="eyebrow" style="margin-bottom:2px">Closest matches</div>${best.map(row).join('')||'<p class="small muted">No other options with this equipment.</p>'}</div>
    ${rest.length?`<div><div class="eyebrow" style="margin-bottom:2px">Other options</div>${rest.map(row).join('')}</div>`:''}
    <button class="btn block" data-action="libpick" data-pk="${pk}">Not seeing it? Pick from the whole library</button>
    <button class="btn ghost" data-action="closemodal">Close</button>`);
}
// Pick any exercise from the library as a swap (filters start on the body part this exercise works)
function libPickSheet(pk){
  if(pk){ const [k,i]=pk.split('.'), cfg=TPL[k].slots[+i], inW=ui.tab==='workout'&&state.draft&&state.draft.sets[pk];
    const cur=(inW&&state.draft.subs&&state.draft.subs[pk])||planId(pk), m=EXM[cur]||{p:[]};
    const body=Object.keys(LIB_BODY).find(b=>LIB_BODY[b][1].some(x=>m.p.includes(x)))||'';
    ui.lp={pk, cur, q:'', eq:'', body, move:'', inW:!!inW}; }
  const L=ui.lp; if(!L) return;
  const list=LIB.filter(e=>available(e) && allowed(e) && e.id!==L.cur && libMatch(e,L)).sort((a,b)=>a.n.localeCompare(b.n));
  const row=e=>`<div class="slotrow mrow3">${musThumb(e.id)}<div><div style="font-weight:600">${esc(e.n)}</div>${musLine(e.id)}<div class="tiny muted">${eqLabelList(e).join(' · ')||'No equipment'}</div></div>
    <div class="row" style="flex-wrap:nowrap">${L.inW?`<button class="btn sm primary" data-action="subtoday" data-pk="${L.pk}" data-id="${e.id}">Today</button>`:''}<button class="btn sm" data-action="doswap" data-pk="${L.pk}" data-id="${e.id}">${L.inW?'Keep':'Use'}</button></div></div>`;
  modal(`<div><div class="eyebrow">Swap from the library</div><h2>Pick any exercise</h2><div class="tiny muted">Instead of ${esc(EX[L.cur].n)}. Only moves that fit your level and equipment.</div></div>
    <div class="filters">${libFilters(L,{q:'lpq',eq:'lpeq',body:'lpbody',move:'lpmove'})}</div>
    <div class="tiny muted"><span class="num">${list.length}</span> shown</div>
    <div>${list.slice(0,60).map(row).join('')||'<p class="small muted">Nothing matches. Clear a filter.</p>'}</div>
    <button class="btn ghost" data-action="swap" data-pk="${L.pk}">Back to suggestions</button>`);
}
function defW(tg){ if(!usesLoad(tg.ex)) return ''; const v=tg.w ?? tg.sug; return v!=null?String(v):''; }
function resetRows(pk){
  const d=state.draft; if(!d||!d.sets[pk]) return;
  const slot=dSlots().find(x=>x.pk===pk); if(!slot) return; const tg=target(slot);
  d.sets[pk]=Array.from({length:tg.sets},()=>({w:defW(tg),r:'',done:false}));
  d.planned=d.planned||{}; d.planned[pk]=usesLoad(tg.ex)?(tg.w ?? tg.sug ?? null):null; if(d.feel) d.feel[pk]=null;
}
function adjustSheet(pk){
  const inWorkout = ui.tab==='workout' && state.draft;
  const slot=(inWorkout?dSlots():Object.values(SPLITS).flatMap(o=>o.keys).flatMap(sessionSlots)).find(x=>x.pk===pk);
  const tg=target(slot), ex=tg.ex, r=recovery(slot), unit=tg.unit==='sec'?'seconds':'reps';
  const f=(id,label,val,hint='')=>`<label class="adj" for="${id}"><span>${label}${hint?`<br><span class="tiny muted">${hint}</span>`:''}</span><input id="${id}" inputmode="decimal" value="${val??''}"></label>`;
  modal(`<div><div class="eyebrow">Adjust</div><h2>${esc(ex.n)}</h2><p class="tiny muted" style="margin:4px 0 0">Your own tweak to ${esc(coachName())}'s plan. It stays until you reset it, and shows in your progress report.</p></div>
    <div class="stack" style="gap:8px">
      ${f('adj-sets','Sets',tg.sets)}
      ${f('adj-lo',`Low end (${unit})`,tg.lo)}
      ${f('adj-hi',`High end (${unit})`,tg.hi)}
      ${f('adj-rest','Rest between sets (sec)',slot.cfg.rest, tg.ssFirst?'Supersets: rest happens after the paired exercise':'')}
      ${f('adj-after','Recovery after exercise (sec)',r.sec,'Starts when every set is checked off')}
      ${usesLoad(ex)?f('adj-w',`Working weight (${state.settings.units})`,tg.w,'Next targets build from this'):''}
    </div>
    <div class="row"><button class="btn primary" data-action="adjsave" data-pk="${pk}" data-id="${slot.id}">Save</button><button class="btn" data-action="adjreset" data-pk="${pk}">Back to ${esc(PROGRAM.coach||'coach')}'s plan</button><button class="btn ghost" data-action="closemodal">Cancel</button></div>`);
}

function reportText(){
  const u=state.settings.units, since=logs.slice(0,12).reverse();
  const nm=state.settings.name||'Strong Start';
  const feelTxt={easy:'felt too easy',good:'felt just right',hard:'felt too heavy'};
  let t=`${nm}: progress report (${new Date().toLocaleDateString([], {month:'short',day:'numeric',year:'numeric'})})\n`;
  t+=`Block ${state.block.n}, week ${Math.min(weekNum(),PROGRAM.blockLen)} of ${PROGRAM.blockLen} · ${nDays()} days${isFlex()?' (flexible)':''} (${splitLabel()}) · ${(n=>n+' workout'+(n===1?'':'s'))(logs.filter(l=>l.block===state.block.n).length)} this block, ${logs.length} total\n`;
  if(state.settings.bw) t+=`Body weight entered: ${state.settings.bw} ${u}\n`;
  t+=`Level: ${LEVELS[lvl()].n} · Goals: ${goals().map(g=>GOALS[g].n).join(', ')} · ${state.settings.mins||45} min · Places: ${(state.places||[]).map(p=>p.n).join(', ')}${(state.settings.pain||[]).length?` · Avoiding: ${state.settings.pain.map(k=>PAIN[k].n).join(', ')}`:''}\n`;
  const subs=Object.keys(state.block.plan).filter(pk=>origId(pk) && state.block.plan[pk]!==origId(pk) && EX[origId(pk)] && EX[state.block.plan[pk]]);
  if(subs.length) t+=`My standing swaps: ${subs.map(pk=>`${EX[origId(pk)].n} → ${EX[state.block.plan[pk]].n}`).join('; ')}\n`;
  const adj=Object.entries(state.adj||{}).filter(([pk,a])=>a.ex===planId(pk)).map(([pk,a])=>{ const [k,i]=pk.split('.'), c=TPL[k].slots[+i];
    const parts=[a.sets!=null&&a.sets!==c.sets&&!(easeIn()&&a.sets===2)?a.sets+' sets':'', a.lo!=null&&(a.lo!==c.lo||a.hi!==c.hi)?a.lo+'–'+a.hi+' reps':'', a.rest!=null&&a.rest!==c.rest?'rest '+a.rest+' s':''].filter(Boolean);
    return parts.length?`${EX[planId(pk)].n} (${parts.join(', ')})`:null; }).filter(Boolean);
  if(adj.length) t+=`My tweaks: ${adj.join('; ')}\n`;
  for(const l of since){
    t+=`\n${new Date(l.date).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}: ${l.name} (wk ${l.week}, ${l.dur} min)\n`;
    for(const e of l.entries){
      const sets=e.sets.map(x=>(x.w!=null?`${x.w}×`:'')+x.r).join(', ');
      t+=`- ${e.name}${e.swap?` (swapped from ${e.swap}${e.place?`, at ${e.place}`:e.today?', today only':''})`:''}: did ${sets}${e.of&&e.of>e.sets.length?` (${e.sets.length} of ${e.of} sets)`:''}${e.plan?` · plan ${e.plan}${e.planned!=null?' @ '+e.planned+' '+u:''}`:''}${e.feel?` · ${feelTxt[e.feel]}`:''}\n`;
    }
  }
  if(!since.length) t+='\nNo workouts logged yet.\n';
  return t;
}

/* ---------------- Actions ---------------- */
function finishWorkout(){
  const d=state.draft, slots=dSlots(), entries=[];
  for(const s of slots){
    const done=(d.sets[s.pk]||[]).filter(x=>x.done && (+x.r>0));
    if(!done.length) continue;
    const msg=applyProgression(s,done,(d.feel||{})[s.pk]);
    const tg0=target(s);
    entries.push({pk:s.pk, ex:s.id, name:EX[s.id].n, sets:done.map(x=>({w:x.w===''?null:+x.w, r:+x.r})), msg,
      plan:`${tg0.sets}×${usesLoad(tg0.ex)?tg0.lo+'–'+tg0.hi:tg0.r} ${tg0.unit}`, feel:(d.feel||{})[s.pk]||null, planned:(d.planned||{})[s.pk]||null,
      swap: s.placeFrom ? EX[s.placeFrom].n : (origId(s.pk) && s.id!==origId(s.pk) && EX[origId(s.pk)]) ? EX[origId(s.pk)].n : null, today:!!s.sub||!!s.placeFrom, place:s.placeFrom?curPlace().n:null, of:(d.sets[s.pk]||[]).length});
  }
  if(!entries.length){ toast('Mark at least one set done first.'); return; }
  const l={id:'log-'+Date.now(), date:new Date().toISOString(), key:d.key, name:tplOf(d.key).name, block:d.block, week:d.week, mode:d.mode, dur:Math.round((Date.now()-d.startedAt)/60000), entries};
  if(d.cardioDone) l.cardio=d.cardioDone;
  logs.unshift(l); state.draft=null; ui.timer=null; clearInterval(timerInt); save(); pushLog(l);
  ui.tab='today'; render(); window.scrollTo(0,0);
  modal(`<div class="eyebrow">Workout saved</div><h2>${esc(l.name)} done</h2><p class="small muted" style="margin:0">${l.dur} min logged. Next time:</p>
    <div>${entries.map(e=>`<div class="slotrow" style="grid-template-columns:1fr"><div><b>${esc(e.name)}</b><div class="small muted">${esc(e.msg)}</div></div></div>`).join('')}</div>
    <p class="small" style="margin:0">Great job showing up. Don't skip the walk and stretches, and drink some water.</p>
    <div class="stack" style="gap:6px;background:var(--accent-soft);border-radius:14px;padding:12px">
      <b>Send this to ${esc(coachName())}</b>
      <div class="small">Tap <b>Send progress</b>, copy the report and text it to ${esc(coachName())}. That's how your plan gets updated: what you lifted, how it felt and any swaps you made.</div>
    </div>
    <div class="row"><button class="btn primary" data-action="copyreport">Send progress</button><button class="btn ghost" data-action="closemodal">Later</button></div>`);
}

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action;
  if(a==='closemodal'){ if(e.target!==b && b.classList.contains('scrim')) return; closeModal(); return; }
  if(a.startsWith('auth')){ authAction(a,b); return; }
  if(a==='people'){ ui.tab='people'; loadPeople(); window.scrollTo(0,0); return; }
  if(a==='peoplereload'){ loadPeople(); return; }
  if(a==='personopen'){ openPerson(b.dataset.id,b.dataset.n); return; }
  if(a==='coachsendopen'){ coachSendSheet(); return; }
  if(a==='coachsend'){ coachSend(); return; }
  if(a==='suedit' && !state.setup && ui.editFromSettings) state.setup={step:'week1', a:prefillSetup()};
  if(a.startsWith('su') && a!=='subtoday' && state.setup){ if(a==='suresume'){ state.setup.paused=false; save(); render(); window.scrollTo(0,0); return; } setupAction(a,b); return; }
  if(a[0]==='f' && fAction(a,b)) return;
  if(a[0]==='c' && cAction(a,b)) return;
  if((a[0]==='g'||a==='framp'||a==='frampskip') && gAction(a,b)) return;
  switch(a){
    case 'tab': ui.tab=b.dataset.tab; if(ui.tab==='today'&&state.draft&&false){} render(); window.scrollTo(0,0); break;
    case 'open': { const key=b.dataset.key;
      if(state.draft && state.draft.key===key){ ui.tab='workout'; render(); window.scrollTo(0,0); break; }
      ui.preview=key; ui.tab='preview'; render(); window.scrollTo(0,0); break;
      if(state.draft && state.draft.key!==key){ confirmBox('Switch workouts?',`You have ${esc(tplOf(state.draft.key).name)} in progress. Starting ${esc(tplOf(key).name)} discards it.`,'Discard and start',()=>{ startWorkout(key); ui.tab='workout'; render(); window.scrollTo(0,0); }); return; }
      if(!state.draft) startWorkout(key);
      ui.tab='workout'; render(); window.scrollTo(0,0);
      state.tips=state.tips||{}; if(!state.tips.workout){ state.tips.workout=true; save(); workoutTips(); } break; }
    case 'resume': ui.tab='workout'; render(); window.scrollTo(0,0); break;
    case 'done': { const s=state.draft.sets[b.dataset.pk][+b.dataset.i];
      s.done=!s.done;
      if(s.done){ const all=dSlots(), slot=all.find(x=>x.pk===b.dataset.pk), tg=target(slot);
        if(s.r==='') s.r=String(usesLoad(tg.ex)?tg.lo:tg.r);
        if(usesLoad(tg.ex) && s.w==='' && tg.w!=null) s.w=String(tg.w);
        const exDone = state.draft.sets[slot.pk].every(x=>x.done);
        if(tg.ssFirst){ const p=all.find(x=>x.g===slot.g&&x.pk!==slot.pk); toast(`Now do ${p?EX[p.id].n:'the paired exercise'}`); }
        else if(exDone && state.settings.betweenTimer!==false){
          const nxt=all.find(x=>x.g>slot.g); const r=recovery(slot);
          startRest(r.sec,{label:'Recover', tip:r.tip, next:nxt?EX[nxt.id].n:'Cool-down'}); }
        else if(state.settings.autoRest!==false && tg.rest) startRest(tg.rest,{label:'Rest'}); }
      save(); render(); break; }
    case 'proftoggle': ui.profOpen=!ui.profOpen; render(); break;
    case 'sectoggle': ui.open=ui.open||{}; ui.open[b.dataset.v]=!ui.open[b.dataset.v]; render(); break;
    case 'setgender': state.settings.gender=b.dataset.g; save(); render(); toast('Saved. New exercises use this for starting weights.'); break;
    case 'setcolor': state.settings.color=b.dataset.c; save(); render(); break;
    case 'settheme': state.settings.theme=b.dataset.t; save(); render(); break;
    case 'feel': { const pk=b.dataset.pk, f=b.dataset.f, d=state.draft; d.feel=d.feel||{};
      const prev=d.feel[pk]; d.feel[pk]= prev===f ? null : f;
      const slot=dSlots().find(x=>x.pk===pk), ex=EX[slot.id], arr=d.sets[pk];
      if(prev!==f && (f==='easy'||f==='hard')){ const ref=+(arr.filter(x=>x.done).pop()||{}).w||+arr[0].w||0;
        if(ref>0){ const nw = f==='easy'? nextLoad(ex,ref) : prevLoad(ex,ref); let ch=0; arr.forEach(x=>{ if(!x.done){ x.w=String(nw); ch++; } });
          if(ch) d.feel[pk]=null;
          toast(ch?`Next sets: ${fmtW(nw)}. Rate it again after your next set.`:`Noted. Next time: ${fmtW(nw)}`); } }
      save(); render(); break; }
    case 'leveldismiss': state.levelDismiss=`${state.block.n}-${weekNum()}`; save(); render(); break;
    case 'addset': { const arr=state.draft.sets[b.dataset.pk]; const last=arr[arr.length-1]||{w:''}; arr.push({w:last.w,r:'',done:false}); save(); render(); break; }
    case 'rmset': { const arr=state.draft.sets[b.dataset.pk]; if(arr.length>1) arr.pop(); save(); render(); break; }
    case 'rest': startRest(+b.dataset.sec,{label:'Rest'}); break;
    case 'tadd': if(ui.timer){ ui.timer.end+= +b.dataset.sec*1000; if(state.draft&&state.draft.step&&state.draft.step.tEnd) state.draft.step.tEnd=ui.timer.end; ui.timer.total=Math.max(ui.timer.total,Math.ceil((ui.timer.end-Date.now())/1000)); tick(); } break;
    case 'tskip': ui.timer=null; clearInterval(timerInt); renderTimer(); break;
    case 'finish': { const d=state.draft, all=Object.values(d.sets).flat(), open=all.filter(s=>!s.done).length;
      if(open) confirmBox('Finish workout?',`${open} set${open>1?'s are':' is'} not checked off. Unchecked sets aren't counted toward progression.`,'Finish',finishWorkout); else finishWorkout(); break; }
    case 'discard': confirmBox('Discard this workout?','Nothing from this session will be saved.','Discard',()=>{ state.draft=null; ui.timer=null; clearInterval(timerInt); save(); ui.tab='today'; render(); }); break;
    case 'swap': swapSheet(b.dataset.pk); break;
    case 'libpick': libPickSheet(b.dataset.pk); break;
    case 'musinfo': musInfo(b.dataset.id); break;
    case 'exinfo': exInfo(b.dataset.id, b.dataset.pk); break;
    case 'reorder': reorderSheet(b.dataset.key); break;
    case 'settstyle': { state.settings.tstyle=b.dataset.v; delete state.settings.tstyleAuto; const n=applyStylePref(); save(); render(); if(n) toast(`${n} move${n>1?'s':''} you haven’t done yet switched to match`); break; }
    case 'setvariety': state.settings.variety=b.dataset.v; save(); render(); toast('Takes effect when your next 6-week program starts'); break;
    case 'addcardio': state.settings.cardio=Object.assign(cSet()||{style:'walk',jog:'none',adj:0},{after:10}); save(); render(); toast('Added 10 min of cardio. Change or turn it off anytime in Settings.'); break;
    case 'ordmv': { const k=b.dataset.key, sl=sessionSlots(k).map(x=>x.pk), i=sl.indexOf(b.dataset.pk), j=i+(+b.dataset.dir);
      if(i<0||j<0||j>=sl.length) break; [sl[i],sl[j]]=[sl[j],sl[i]]; state.order=state.order||{}; state.order[k]=sl; if(state.draft&&state.draft.key===k) state.draft._x=null; save(); render(); reorderSheet(k); break; }
    case 'ordreset': { const k=b.dataset.key; if(state.order) delete state.order[k]; save(); render(); reorderSheet(k); break; }
    case 'muscle': ui.musSel = ui.musSel===b.dataset.m?null:b.dataset.m; render(); { const el=document.getElementById('musclemap'); if(el && ui.musSel) setTimeout(()=>{ const pn=el.querySelector('.stack:last-child'); pn&&pn.scrollIntoView({block:'nearest',behavior:'smooth'}); },30); } break;
    case 'openmap': ui.tab='plan'; render(); setTimeout(()=>{ const el=document.getElementById('musclemap'); el&&el.scrollIntoView({block:'start'}); window.scrollBy(0,-64); },30); break;
    case 'xswap': xSwapSheet(b.dataset.g,b.dataset.k); break;
    case 'xpick': { const d=state.draft; d.wsub=d.wsub||{}; const i=+b.dataset.i; if(i<0) delete d.wsub[b.dataset.g+b.dataset.k]; else d.wsub[b.dataset.g+b.dataset.k]=i; save(); closeModal(); render(); break; }
    case 'xskip': { const d=state.draft; d.wskip=d.wskip||{}; const k=b.dataset.g+b.dataset.k; d.wskip[k]=!d.wskip[k]; if(d.wskip[k]) d[b.dataset.g][b.dataset.k]=false; save(); render(); break; }
    case 'subtoday': { const pk=b.dataset.pk; state.draft.subs=state.draft.subs||{}; state.draft.subs[pk]=b.dataset.id; resetRows(pk); save(); closeModal(); render(); toast(`${EX[b.dataset.id].n} for today`); break; }
    case 'unsub': { const pk=b.dataset.pk; delete state.draft.subs[pk]; resetRows(pk); save(); closeModal(); render(); break; }
    case 'adjust': adjustSheet(b.dataset.pk); break;
    case 'adjsave': { const pk=b.dataset.pk, v=id=>{ const el=$('#'+id); if(!el) return null; const n=parseFloat(el.value); return isFinite(n)&&n>=0?n:null; };
      const a={...(state.adj[pk]||{})};
      const sets=v('adj-sets'), lo=v('adj-lo'), hi=v('adj-hi'), rest=v('adj-rest'), after=v('adj-after'), w=v('adj-w');
      if(sets!=null) a.sets=Math.max(1,Math.min(10,Math.round(sets)));
      if(lo!=null&&hi!=null){ a.lo=Math.round(Math.min(lo,hi)); a.hi=Math.round(Math.max(lo,hi)); }
      if(rest!=null) a.rest=Math.round(rest); if(after!=null) a.after=Math.round(after);
      a.ex=b.dataset.id; state.adj[pk]=a;
      if(w!=null){ const id=b.dataset.id; state.ex[id]={...(state.ex[id]||{}), w}; }
      const d=state.draft;
      if(d && d.sets[pk]){ const slot=dSlots().find(x=>x.pk===pk), tg=target(slot), arr=d.sets[pk];
        while(arr.length<tg.sets) arr.push({w:defW(tg),r:'',done:false});
        while(arr.length>tg.sets && !arr[arr.length-1].done) arr.pop();
        if(w!=null) arr.forEach(x=>{ if(!x.done) x.w=String(w); }); }
      save(); closeModal(); render(); toast('Adjusted'); break; }
    case 'adjreset': { const pk=b.dataset.pk; delete state.adj[pk]; const d=state.draft;
      if(d && d.sets[pk]){ const tg=target(dSlots().find(x=>x.pk===pk)), arr=d.sets[pk];
        while(arr.length<tg.sets) arr.push({w:defW(tg),r:'',done:false});
        while(arr.length>tg.sets && !arr[arr.length-1].done) arr.pop(); }
      save(); closeModal(); render(); toast(`Back to ${coachName()}'s plan`); break; }
    case 'doswap': { const pk=b.dataset.pk; state.block.plan[pk]=b.dataset.id;
      if(state.draft && state.draft.sets[pk]){ if(state.draft.subs) delete state.draft.subs[pk]; resetRows(pk); }
      save(); closeModal(); render(); toast(b.dataset.id===origId(pk)?'Back to the original pick':'Swapped from now on'); break; }
    case 'setplace': state.curPlace=b.dataset.v; save(); render(); toast(`${curPlace().n} today`); break;
    case 'setgoal': { const v=b.dataset.v, g=(state.settings.goals||[]).slice(), ix=g.indexOf(v); if(ix>=0){ if(g.length===1){ toast('Keep at least one goal'); return; } g.splice(ix,1); } else { if(g.length>=2){ toast('Pick up to two'); return; } g.push(v); }
      state.settings.goals=g; const rep=ensurePlan(); save(); render(); announceReplaced(rep); break; }
    case 'setday': { const v=+b.dataset.v, d=(state.settings.days||[]).slice(), ix=d.indexOf(v); if(ix>=0){ if(d.length<=2){ toast('Keep at least 2 days'); return; } d.splice(ix,1); } else { if(d.length>=5){ toast('5 days max for now. Rest days are when you get stronger.'); return; } d.push(v); }
      state.settings.days=d; save(); render(); break; }
    case 'opensched': ui.tab='settings'; ui.open=ui.open||{}; ui.open.schedule=true; render(); setTimeout(()=>{ const el=document.querySelector('.days'); el&&el.scrollIntoView({block:'center'}); },30); break;
    case 'ordmove': { const id=splitId(), keys=weekKeys().slice(), i=+b.dataset.i, j=i+(+b.dataset.d); if(j<0||j>=keys.length) return;
      [keys[i],keys[j]]=[keys[j],keys[i]]; state.settings.order=state.settings.order||{}; state.settings.order[id]=keys; save(); render(); break; }
    case 'ordreset': { if(state.settings.order) delete state.settings.order[splitId()]; save(); render(); toast('Back to the recommended order'); break; }
    case 'setsplit': { if(state.draft){ toast('Finish or discard your current workout first'); return; } state.settings.split=b.dataset.v; save(); render(); toast(`Split: ${SPLITS[b.dataset.v].label}`); break; }
    case 'setflex': state.settings.flex = b.dataset.v==='1'; if(state.settings.flex && !state.settings.nDays) state.settings.nDays=Math.max(2,Math.min(5,(state.settings.days||[]).length||3)); save(); render(); break;
    case 'setndays': state.settings.nDays=+b.dataset.v; save(); render(); break;
    case 'setmins': state.settings.mins=+b.dataset.v; save(); render(); toast(`${b.dataset.v}-minute workouts`); break;
    case 'editeq': ui.eqPlace=b.dataset.v; ui.tab='equip'; render(); window.scrollTo(0,0); break;
    case 'seteq': case 'seteqall': { const p=state.places.find(x=>x.k===ui.eqPlace)||state.places[0];
      if(a==='seteq'){ const k=b.dataset.k, ix=p.eq.indexOf(k); if(ix>=0) p.eq.splice(ix,1); else p.eq.push(k); }
      else { const items=EQ_GROUPS[+b.dataset.g][1].map(x=>x[0]); p.eq = b.dataset.on==='1' ? [...new Set(p.eq.concat(items))] : p.eq.filter(k=>!items.includes(k)); }
      const y=window.scrollY; save(); render(); window.scrollTo(0,y); break; }
    case 'eqdone': { const rep=ensurePlan(); ui.tab='settings'; save(); render(); announceReplaced(rep); break; }
    case 'addplace': { const k=b.dataset.v; state.places.push({k, n:PLACE_TYPES[k].n, eq:PLACE_TYPES[k].eq.split(' ')}); ui.eqPlace=k; ui.tab='equip'; save(); render(); window.scrollTo(0,0); toast(`${PLACE_TYPES[k].n} added. Check what's there.`); break; }
    case 'rmplace': { const k=b.dataset.v; confirmBox('Remove this place?','Its equipment list is deleted. Your plan stays.','Remove',()=>{ state.places=state.places.filter(p=>p.k!==k); if(state.curPlace===k) state.curPlace=state.places[0].k; const rep=ensurePlan(); save(); render(); announceReplaced(rep); }); break; }
    case 'pickLevel': levelSheet(); break;
    case 'setlevel': { state.settings.level=b.dataset.v; const rep=ensurePlan(); save(); closeModal(); render(); toast(`Level: ${LEVELS[lvl()].n}`); announceReplaced(rep); break; }
    case 'setpain': { const v=b.dataset.v, P=(state.settings.pain||[]).slice(), ix=P.indexOf(v); if(ix>=0) P.splice(ix,1); else P.push(v); state.settings.pain=P; const rep=ensurePlan(); save(); render(); announceReplaced(rep); break; }
    case 'checkin': { const v=b.dataset.v; state.checkin=v;
      if(v==='easy'){ for(const id of Object.keys(state.ex)){ const st=state.ex[id]; if(st.w!=null && EX[id]) st.w=nextLoad(EX[id],+st.w); } toast('Weights bumped up a step. Keep rating your sets.'); }
      else if(v==='much'){ for(const id of Object.keys(state.ex)){ const st=state.ex[id]; if(st.w!=null && EX[id]) st.w=prevLoad(EX[id],+st.w); } state.easeUntil=weekNum(); toast('Weights eased back a step, and 2 sets each this week.'); }
      else toast('Great. Keep it up!');
      save(); render(); break; }
    case 'weighsave': { const v=parseFloat(($('#wi-w')||{}).value); if(!isFinite(v)||v<40||v>900){ toast('Enter your weight'); return; }
      const today=dayStart(new Date()).toISOString(); state.weigh.list=state.weigh.list.filter(x=>x.d!==today); state.weigh.list.push({d:today,w:v}); state.weigh.list.sort((x,y)=>x.d<y.d?-1:1);
      state.settings.bw=v; save(); render(); toast('Saved'); break; }
    case 'weighdel': state.weigh.list=state.weigh.list.filter(x=>x.d!==b.dataset.d); save(); render(); break;
    case 'editsetup': editSheet(true); break;
    case 'redosetup': confirmBox('Redo setup?','You’ll answer the setup questions again and get a fresh plan. Your history and weights stay.','Redo setup',()=>{ startSetup(true); save(); render(); window.scrollTo(0,0); }); break;
    case 'newblock': newBlock(); save(); ui.tab='today'; render(); window.scrollTo(0,0); toast('Your next program started. Changed your mind? Go back anytime in Settings.'); break;
    case 'prevblock': confirmBox('Go back to your previous program?','You’ll get your previous exercises and swaps back. Your history and weights stay.','Go back',()=>{ goBackBlock(); save(); render(); toast('You’re back on your previous program'); }); break;
    case 'copyplan': { const n=$('#coachnote'); if(n){ state.coach.note=n.value.trim(); save(); } const txt=planCode(); try{ navigator.clipboard.writeText(txt).then(()=>toast('Plan update copied. Send it to them.'),()=>{ $('#plancode').value=txt; toast('Copy blocked. Code placed in the box above.'); }); }catch(err){ $('#plancode').value=txt; } break; }
    case 'loadplan': { try{ const o=JSON.parse($('#plancode').value); if(o.t!=='ssplan'||!o.plan) throw 0;
      confirmBox('Load this plan update?','Your exercises, tweaks and coach note are replaced with your coach’s version. Your history and weights stay.','Load',()=>{ applyPlanCode(o); save(); ui.tab='today'; render(); toast('Plan updated'); }); }catch(err){ toast('That code could not be read. Paste the whole thing.'); } break; }
    case 'copyreport': copyReport(); break;
    case 'copyfull': { const txt=JSON.stringify({state,logs}); const ta=$('#reporttxt');
      try{ navigator.clipboard.writeText(txt).then(()=>toast('Full data copied. Paste it into a text or email.'),()=>{ ta.value=txt; ta.select(); toast('Select all and copy'); }); }catch(err){ ta.value=txt; ta.select(); toast('Select all and copy'); } break; }
    case 'docopyreport': { const ta=$('#reporttxt'); try{ navigator.clipboard.writeText(ta.value).then(()=>toast('Copied. Paste it into a text or email.'),()=>{ ta.select(); toast('Select all and copy'); }); }catch(err){ ta.select(); toast('Select all and copy'); } break; }
    case 'restartblock': confirmBox('Restart at week 1?','Week 1 starts today with the same plan. Your weights and history stay.','Restart',()=>{ state.block.start=dayStart(new Date()).toISOString(); state.weekModes={}; save(); ui.tab='today'; render(); }); break;
    case 'libshowall': ui.libShowAll=!ui.libShowAll; render(); break;
    case 'libopen': ui.libOpen = ui.libOpen===b.dataset.id?null:b.dataset.id; render(); break;
    case 'histopen': ui.histOpen = ui.histOpen===b.dataset.id?null:b.dataset.id; render(); break;
    case 'dellog': { const id=b.dataset.id; confirmBox('Delete this session?','It is removed from history. Working weights are not rolled back.','Delete',()=>{ logs=logs.filter(l=>l.id!==id); save(); deleteRemoteLog(id); render(); }); break; }
    case 'setunits': state.settings.units=b.dataset.u; save(); render(); toast('Units changed. Re-enter weights in the new unit.'); break;
    case 'copybackup': { const txt=JSON.stringify({state,logs}); try{ navigator.clipboard.writeText(txt).then(()=>toast('Backup copied'),()=>{ $('#restore').value=txt; toast('Copy blocked. Backup placed in the box below.'); }); }catch(err){ $('#restore').value=txt; } break; }
    case 'restore': { try{ const o=JSON.parse($('#restore').value); if(!o.state||!o.state.block) throw 0;
      confirmBox('Load this data?',`It replaces everything on this device with ${o.state.settings&&o.state.settings.name?esc(o.state.settings.name)+"'s":'the pasted'} plan, weights and history.`,'Load',()=>{ state=migrate(o.state); logs=o.logs||[]; save(); ui.tab='today'; render(); window.scrollTo(0,0); toast('Loaded'); }); }catch(err){ toast('That backup could not be read. Paste the full text.'); } break; }
    case 'coachview': { let o=null; try{ o=JSON.parse($('#coachcode').value); }catch(err){}
      if(!o||!o.state||!o.state.block){ toast('That could not be read. Paste the full text they sent.'); break; }
      coachMode={own:{state:JSON.parse(JSON.stringify(state)), logs:JSON.parse(JSON.stringify(logs))}, name:(o.state.settings&&o.state.settings.name)||'their'};
      fClearTimer && fClearTimer(); state=migrate(o.state); logs=o.logs||[]; ui.tab='today'; render(); setSync('coach'); window.scrollTo(0,0); toast(`Viewing ${coachMode.name}’s app`); break; }
    case 'coachexit': { if(!coachMode) break; const wasUid=coachMode.uid; state=coachMode.own.state; logs=coachMode.own.logs; coachMode=null; ui.tab=wasUid?'people':'today'; if(wasUid) loadPeople(); try{ fClearTimer(); }catch(e){} render(); setSync(CLOUD.ok?'cloud':'local'); window.scrollTo(0,0); toast('Back to your app'); break; }
    case 'opencoach': ui.tab='settings'; ui.open=ui.open||{}; ui.open.coach=true; render(); setTimeout(()=>{ const d=document.querySelector('#coachnote'); if(d){ d.closest('details').open=true; d.scrollIntoView({block:'center'}); } },50); break;
    case 'confirmok': { const cb=confirmCb; confirmCb=null; closeModal(); cb&&cb(); break; }
  }
});
document.addEventListener('submit', e=>{ const f=e.target.closest('[data-authform]'); if(!f) return; e.preventDefault(); authSubmit(f.dataset.authform); });
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='au-email'){ AUTH.email=t.value; return; } if(t.id==='au-pw'){ AUTH.pw=t.value; return; }
  if(t.dataset.f && state.draft){ const s=state.draft.sets[t.dataset.pk][+t.dataset.i]; s[t.dataset.f]=t.value.replace(/[^0-9.]/g,''); save(); return; }
  if(t.id==='libq'){ ui.libQ=t.value; const pos=t.selectionStart; render(); const n=$('#libq'); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.check && state.draft){ state.draft[t.dataset.check][t.dataset.k]=t.checked; save(); return; }
  if(t.dataset.set){ state.settings[t.dataset.set]=t.checked; save(); return; }
  if(t.id==='set-age'){ const v=parseInt(t.value,10); state.settings.age=isFinite(v)&&v>10&&v<110?v:null; save(); render(); return; }
  if(t.id==='set-comfort'){ state.settings.comfort=t.value; const rep=ensurePlan(); save(); render(); announceReplaced(rep); return; }
  if(t.id==='set-jumps'){ state.settings.jumps=t.checked; const rep=ensurePlan(); save(); render(); announceReplaced(rep); toast(t.checked?'Jumps and explosive moves are back in':'No more jumps or explosive moves'); return; }
  if(t.id==='wi-on'){ state.weigh.on=t.checked; state.weigh.touched=true; save(); render(); return; }
  if(t.id==='wi-day'){ state.weigh.day=+t.value; save(); render(); return; }
  if(t.id==='wi-hide'){ state.weigh.hide=t.checked; save(); render(); return; }
  if(t.id==='coachnote'){ state.coach.note=t.value.trim(); save(); return; }
  if(t.id==='libeasy'){ ui.libEasy=t.checked; render(); return; }
  if(t.id==='set-name'){ state.settings.name=t.value.trim().slice(0,30); save(); render(); return; }
  if(t.id==='set-bw'){ const v=parseFloat(t.value); state.settings.bw = isFinite(v)&&v>50&&v<700 ? v : null; save(); render(); toast(state.settings.bw?'Saved. New exercises use this for starting weights.':'Cleared'); return; }
  if(t.id==='libeq'){ ui.libEq=t.value; render(); }
  if(t.id==='libbody'){ ui.libBody=t.value; render(); }
  if(t.id==='libmove'){ ui.libMove=t.value; render(); }
  if(t.id==='lpq'){ ui.lp.q=t.value; const pos=t.selectionStart; libPickSheet(); const n=$('#lpq'); n.focus(); n.setSelectionRange(pos,pos); }
  if(['lpeq','lpbody','lpmove'].includes(t.id)){ ui.lp[{lpeq:'eq',lpbody:'body',lpmove:'move'}[t.id]]=t.value; libPickSheet(); }
  if(t.id==='histex'){ ui.histEx=t.value; render(); }
});

/* ---------------- Boot ---------------- */
(function boot(){
  const saved=loadLocal();
  if(saved && saved.state){ state=migrate(saved.state); logs=saved.logs||[]; }
  else { state=defaults(); state.updatedAt=0; }
  if(state.block && state.places && state.places.length){ const rep=ensurePlan(); if(rep.length) save(); }
  persistLocal();
  if(state.draft && !state.setup){ ui.tab='workout'; const st=state.draft.step;
    if(st && st.tEnd && st.tEnd>Date.now()){ ui.timer={end:st.tEnd,total:st.tTot||Math.ceil((st.tEnd-Date.now())/1000),label:st.ph==='rest'?'Rest':'Recover',tip:st.tTip||'',next:''}; timerInt=setInterval(tick,500); } }
  render();
  initRemote();
  setTimeout(()=>{ if(pendingQs().length && !ui.qsLater && !state.draft && !$('#modal').innerHTML) newQsPopup(); },900);
  if(!storageOk) toast('This browser is not saving data. Use Settings > Backup.');
})();
</script>
</body>
