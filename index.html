<style>
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
/* Layout: single phone column, sticky top bar, fixed bottom tab bar; soft white cards on blush, serif for titles and numbers, spaced caps for labels */
/* Shared theme tokens live in theme.css. */
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:var(--text-lg);line-height:1.4;-webkit-text-size-adjust:100%}
/* Keep touch gestures vertical without trapping document or sheet scrolling. */
html{touch-action:pan-y;overflow-x:clip}
body{padding-top:env(safe-area-inset-top,0px);overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{min-width:0;max-width:100%}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:var(--title-xl)} h2{font-size:var(--title-md)} h3{font-size:var(--title-xs)}
.num{font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-height) + 40px) max(16px,env(safe-area-inset-left,0px))}
.app-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);flex:none}
.top{background:var(--bg);border-bottom:1px solid var(--line)}
.sync-banner{display:block;width:100%;min-height:44px;border:0;border-bottom:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);font:inherit;text-align:left}
.sync-banner[hidden]{display:none}
.sync-banner .wrap{padding-top:10px;padding-bottom:10px;display:flex;align-items:center;gap:10px;font-size:var(--text-md)}
.sync-banner .sync-label{flex:1}
.sync-banner .sync-open{font-size:var(--text-xs);font-weight:700;white-space:nowrap}
.top .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{font-family:var(--display);font-weight:700;font-size:var(--title-sm);letter-spacing:.02em;text-transform:uppercase}
.brand b{color:var(--accent)}
.sync{font:inherit;font-size:var(--text-xs);color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;cursor:pointer;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)}
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:var(--text-md)} .tiny{font-size:var(--text-xs)}
.eyebrow{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:var(--label-track);font-size:var(--text-sm);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.sm{min-height:44px;padding:8px 12px;font-size:var(--text-md)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--text-xs);font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.S{color:var(--pS);border-color:currentColor} .chip.F{color:var(--pF);border-color:currentColor} .chip.T{color:var(--pT);border-color:currentColor}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* Today */
.hero{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px}
.stat .v{font-family:var(--display);font-size:var(--title-lg);font-weight:700;line-height:1}
.stat .l{font-size:var(--text-xs);color:var(--muted);margin-top:2px}
.weekbar{display:flex;gap:4px}
.weekbar span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.weekbar span.done{background:var(--ink)} .weekbar span.now{background:var(--accent)}
.day{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);width:100%;text-align:left}
.day .idx{font-family:var(--display);font-size:var(--title-lg);font-weight:700;width:34px;text-align:center;color:var(--muted)}
.day.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.day.next .idx{color:var(--accent)}
.day.done .idx{color:var(--good)}
/* Plan: schedule and repeating workout order are separate. */
.plan-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.plan-day{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-radius:10px;font-size:var(--text-xs);color:var(--muted)}
.plan-day.planned{background:var(--accent-soft);color:var(--accent);font-weight:700}
.plan-flex{color:var(--accent);font-weight:600}
.plan-place{padding:0 2px}
.plan-workout{padding:0;overflow:hidden}
.plan-workout .sec-head{gap:10px}
.plan-workout-label{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:4px}
.plan-number{font-family:var(--display);font-size:var(--title-lg);min-width:24px;color:var(--muted);text-align:center}
.plan-next{border-color:var(--accent)}
.plan-next .plan-number{color:var(--accent)}
.plan-schedule .linkbtn{min-height:44px}
.plan-help{color:var(--muted)}
.day .grow{flex:1;min-width:0}
.day .t{font-family:var(--display);font-size:var(--title-sm);font-weight:700}
/* Workout */
.phase{border-left:4px solid var(--ink);padding-left:12px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.check input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.check label{flex:1}
.ex{padding:0;overflow:hidden}
.ex .head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:6px}
.ex .name{font-family:var(--display);font-size:var(--title-md);font-weight:700;line-height:1.05}
.ex .n{font-family:var(--display);color:var(--accent);font-weight:700;margin-right:6px}
.target{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--sunk);padding:8px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:var(--text-md);flex-wrap:wrap}
.target b{font-family:var(--display);font-size:var(--title-xs)}
.sets{padding:8px 16px 12px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;padding:4px 0}
.set .sn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center;font-size:var(--text-xl)}
.set.isdone .sn{color:var(--good)}
.field{position:relative}
.field input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 34px 0 10px;font-size:var(--text-xl);font-weight:600;font-variant-numeric:tabular-nums}
.field span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:var(--text-2xs);color:var(--muted);pointer-events:none}
.tick{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:var(--title-xs);font-weight:700;color:var(--muted)}
.set.isdone .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.isdone input{background:var(--good-soft);border-color:transparent}
.cue{font-size:var(--text-md);color:var(--muted)}
.exfoot{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap}
.timer{position:fixed;left:0;right:0;bottom:var(--nav-height);z-index:6}
.timer .in{max-width:560px;margin:0 auto 8px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.timer .box{background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.timer .clock{font-family:var(--display);font-size:var(--title-xl);font-weight:700;min-width:72px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:rgba(127,127,127,.35);overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--accent)}
.timer button{background:transparent;border:1px solid rgba(127,127,127,.5);color:inherit;border-radius:8px;padding:6px 8px;font-weight:600;font-size:var(--text-md)}
/* Plan & library */
.pain-warning-title{display:flex;align-items:flex-start;gap:7px}
.pain-warning-badge{display:inline-flex;align-items:center;justify-content:center;flex:none;width:26px;height:26px;margin-top:1px;border-radius:999px;background:#fff1d6;color:#805000}
.pain-warning-box{background:#fff5e3;border:1px solid #e9c882;border-left:4px solid #bc790a;border-radius:12px;padding:13px 14px;color:#704600}
.pain-warning-heading{display:flex;gap:8px;align-items:center;font-size:var(--text-base);font-weight:800}
.pain-warning-box p{font-size:var(--text-md);line-height:1.5;margin:6px 0 0}
.pain-warning-box svg{flex:none}
.slotrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.slotrow:first-of-type{border-top:0}
.lib-item{border-top:1px solid var(--line);padding:10px 0}
.lib-item:first-child{border-top:0}
.lib-item button.lt{all:unset;cursor:pointer;display:block;width:100%}
.lib-item button.lt:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.lib-arrow{flex-shrink:0;color:var(--muted);opacity:.65;font-size:var(--title-md);font-weight:400;padding:0 4px}
.lib-item .ln{font-weight:600}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.search{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.search{grid-column:1/-1}
/* History */
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist:first-child{border-top:0}
.history-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;color:var(--ink);font:inherit;padding:8px 0;cursor:pointer;border-radius:6px}
.history-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.history-heading{display:grid;gap:6px;min-width:0;overflow-wrap:anywhere}
.history-action{display:flex;align-items:center;gap:6px;flex:none;color:var(--accent);font-size:var(--text-xs);font-weight:700}
.history-arrow{font-size:var(--title-sm);line-height:1;transform:rotate(90deg)}
.history-toggle[aria-expanded=true] .history-arrow{transform:rotate(-90deg)}
.history-details{padding:10px 0 4px;display:grid;gap:0}
.history-exercise{padding:14px 0;border-top:1px solid var(--line)}
.history-exercise h4{font:700 var(--text-base) var(--body);margin:0;overflow-wrap:anywhere}
.history-note{font-size:var(--text-xs);color:var(--muted);margin-top:4px}
.history-sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;list-style:none;padding:0;margin:10px 0 0;font-variant-numeric:tabular-nums}
.history-set{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;display:grid;align-content:start;gap:4px;font-size:var(--text-sm);min-width:0;overflow-wrap:anywhere}
.history-set-label{font-size:var(--text-2xs);color:var(--muted)}
.history-set b{font-size:var(--text-md)}
.history-set-result{color:var(--muted)}
.history-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.history-footer>.btn{flex:none;font-size:var(--text-xs);min-height:36px}
.history-context{flex:1;min-width:0;font-size:var(--text-sm);color:var(--muted)}
.history-context summary{cursor:pointer;min-height:36px;padding-top:8px;color:var(--accent);font-size:var(--text-xs)}
.history-context p{margin:8px 0;overflow-wrap:anywhere}
svg text{fill:var(--muted);font-family:var(--body);font-size:var(--text-2xs)}
.history-score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.history-score strong{font-size:38px;line-height:1.2;font-variant-numeric:tabular-nums}.history-change{color:var(--accent);font-size:var(--text-md);font-weight:600}
.history-breakdown{border-top:1px solid var(--line);padding-top:4px}.history-breakdown summary{color:var(--accent);cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:var(--text-sm);font-weight:600}
.history-breakdown summary::before{content:'▸';margin-right:6px}.history-breakdown[open]>summary::before{content:'▾'}
.history-score-link{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px 0;border:0;border-top:1px solid var(--line);background:transparent;color:var(--ink);font:13px var(--body);cursor:pointer}.history-score-link span{flex:none;color:var(--accent)}
.history-record{padding:14px 0;border-top:1px solid var(--line)}.history-record:first-child{border:0}.history-record .history-exercise{border:0;padding:0}.history-record .history-exercise h4{display:none}.history-record-heading{display:grid;gap:4px;margin-bottom:10px}
.history-exercise-toggle{scroll-margin-top:24px}.history-exercise-trend{border-top:1px solid var(--line);padding-top:8px}.history-exercise-trend summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-size:var(--text-sm);cursor:pointer}
.history-exercise-trend summary::before{content:'▸';margin-right:6px}.history-exercise-trend[open]>summary::before{content:'▾'}
/* Settings */
.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.toggle:first-of-type{border-top:0}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px;font-size:var(--text-xs);font-family:ui-monospace,monospace}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) var(--nav-bottom) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:transparent;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--text-xs);font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
/* Modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;touch-action:pan-y;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + var(--safe-bottom)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);color:var(--ink);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:30;font-weight:600;font-size:var(--text-md);max-width:90%}
@media (prefers-reduced-motion: no-preference){ .timer .bar i{transition:width .9s linear} }

/* Blush theme refinements */
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;font-size:inherit}
:root{ --h1:color-mix(in srgb, var(--rose) 50%, var(--mskin)); --h2:var(--rose); --h3:var(--accent); }
.mthumb{flex:none;width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--sunk);border:1.5px solid var(--line);padding:0;display:inline-flex;align-items:center;justify-content:center}
.mthumb svg{width:100%;height:100%;display:block}
button.mthumb:active{transform:scale(.96)}
.slotrow.mrow3{grid-template-columns:46px 1fr auto;gap:10px}
.musline{font-size:var(--text-sm);color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.musline .dotp,.musline .dots,.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.musline .dotp{background:var(--accent)} .musline .dots{background:var(--rose);margin-left:6px}
.bodypair{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--sunk);border-radius:14px;padding:10px}
.bodybig{width:100%;height:auto;max-height:300px}
:root{--map-skin:color-mix(in srgb,var(--surface) 40%,var(--mskin))}
.bodybig .selected-region{stroke:var(--ink);stroke-width:1.15;paint-order:stroke fill}
#musclemap{--mbase:color-mix(in srgb,var(--mskin) 55%,var(--muted));--h1:color-mix(in srgb,var(--rose) 55%,var(--mskin));--h2:color-mix(in srgb,var(--rose) 85%,var(--accent))}
#musclemap .bodypair{padding:16px 10px 12px;gap:14px;background:linear-gradient(180deg,var(--surface),var(--sunk))}
#musclemap .bodybig{display:block;max-height:320px}
.map-view-label{text-align:center;font-size:var(--text-xs);color:var(--muted);margin-top:6px;letter-spacing:.06em}
#musclemap .legend{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:var(--text-2xs)}
#musclemap .legend span{gap:4px;white-space:nowrap}
#musclemap .legend i{width:8px;height:8px}
.map-detail.is-selected{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:12px}
.map-select-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:6px}
.map-select-header .selector-count{font-family:var(--body);font-size:var(--text-xs);font-weight:800;color:var(--accent);flex:none;white-space:nowrap}
.map-detail .mrow{grid-template-columns:36px 1fr;padding:8px 0}
.map-detail .mthumb{width:36px;height:36px}
.map-detail .eyebrow{font-size:var(--text-2xs)}
.muscle-chooser-btn{width:100%;display:flex;justify-content:space-between;align-items:center;border-color:var(--accent);color:var(--accent);background:var(--surface);margin-top:4px;min-height:48px}
.muscle-chooser-btn .selector-caret{display:block;width:18px;height:18px;flex:none;color:var(--accent)}
.map-detail.is-selected .muscle-chooser-btn{width:auto;max-width:100%;display:inline-flex;gap:14px;text-align:left;border:1.5px solid var(--accent);border-radius:12px;padding:9px 14px;color:var(--ink);margin-top:0}
.map-detail.is-selected .selector-name{font-family:var(--display);font-size:var(--title-sm);font-weight:700;line-height:1.2;min-width:0}
.sheet.muscle-picker{padding:0;gap:0;overflow:hidden;max-height:85dvh}
.picker-head{padding:20px 16px 12px;flex:none;border-bottom:1px solid var(--line)}
.picker-head h2{font-size:var(--title-lg)}
.picker-head p{margin:8px 0 0}
.picker-content{padding:16px 16px max(16px,var(--safe-bottom));overflow:auto;overscroll-behavior:contain}
.picker-content section+section{margin-top:18px}
.picker-content h3{font-family:var(--body);font-size:var(--text-xs);font-weight:800;color:var(--muted);letter-spacing:var(--label-track);text-transform:uppercase;margin-bottom:8px}
.picker-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.picker-grid button{min-height:44px;width:100%;text-align:left;display:flex;align-items:center;padding:8px 10px;line-height:1.25;font-size:var(--text-md);border-radius:10px;background:var(--sunk);border:1px solid var(--line);font-weight:600}
.picker-grid button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.legend{gap:12px;font-size:var(--text-xs);color:var(--muted)} .legend span{display:inline-flex;align-items:center;gap:5px}
.pchip{background:var(--accent);color:var(--on-accent);border-color:transparent}
.schip{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.mrow{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.timer .box{flex-wrap:wrap}
.tlabel{flex-basis:100%;font-size:var(--text-md);line-height:1.3}
body.has-timer #app{padding-bottom:calc(140px + var(--safe-bottom))}
.tlabel .tip{opacity:.85;font-size:var(--text-sm)}
.adj{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.adj:first-child{border-top:0}
.adj input{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 10px;font-size:var(--text-xl);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.select{width:100%;height:48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 40px 0 14px;font-weight:700;font-size:var(--text-lg);color:var(--ink);appearance:none;-webkit-appearance:none;box-shadow:var(--shadow);
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat}
h1,h2,h3{font-weight:600;letter-spacing:0}
h1{font-size:var(--title-xl);font-style:italic}
h2{font-size:var(--title-lg)} h3{font-size:var(--title-sm)}
.brand{font-family:var(--display);font-style:italic;font-weight:600;font-size:var(--title-md);text-transform:none;letter-spacing:0}
.brand b{color:var(--rose);font-weight:500;margin:0 2px}
.top{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.card,.day{border-color:transparent;box-shadow:var(--shadow)}
.eyebrow{font-family:var(--body);font-weight:800;font-size:var(--text-2xs);letter-spacing:var(--label-track);color:var(--accent)}
.stat{background:var(--sunk);border-radius:14px}
.stat .l{font-family:var(--body);font-weight:800;font-size:var(--text-2xs);letter-spacing:var(--label-track);text-transform:uppercase;color:var(--rose)}
.stat:nth-child(3) .l{color:var(--gold)}
.stat .v{font-weight:500;font-size:var(--title-xl)}
.weekbar span.done{background:var(--rose)} .weekbar span.now{background:var(--accent)}
.btn{border-radius:999px;font-weight:700}
.btn.primary{box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.chip{font-weight:700}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.day .idx,.set .sn,.ex .n,.timer .clock,.stat .v,.target b{font-family:var(--display)}
.day .idx{font-weight:500;font-size:var(--title-md)}
.day .t{font-weight:600;font-size:var(--title-sm)}
.day.next{border-color:transparent;box-shadow:var(--shadow),0 0 0 2px var(--rose) inset}
.ex .name{font-weight:600;font-size:var(--title-sm)}
.ex .n{color:var(--rose);font-style:italic;font-weight:500}
.target{background:var(--sunk);border-color:var(--line)}
.target b{font-weight:600;font-size:var(--title-xs)}
.field input{border-radius:12px;font-family:var(--body);font-weight:700}
.tick{border-radius:12px}
.set.isdone .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.isdone .sn{color:var(--accent)}
.set.isdone input{background:var(--accent-soft)}
.phase{border-left:0;position:relative;padding-left:20px}
.phase::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--rose)}
.check input{accent-color:var(--accent)}
.timer .box{background:var(--accent);color:var(--on-accent);border-radius:20px}
.timer .bar i{background:var(--on-accent)}
.timer .bar{background:rgba(255,255,255,.3)}
.timer .clock{font-weight:500}
nav.tabs{box-shadow:0 -4px 18px rgba(120,60,75,.06);border-top-color:var(--line)}
.sheet{border-radius:24px 24px 0 0}
.banner{background:var(--accent-soft);border-radius:var(--r)}
.toast{background:var(--accent);color:var(--on-accent);border-radius:20px;text-align:center;padding:11px 18px;line-height:1.35;width:max-content;max-width:min(320px,88vw)}
.filters select,.search,#histex{border-radius:12px}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swatch{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:var(--text-xs);font-weight:700;color:var(--ink)}
.swatch i{display:flex;width:36px;height:36px;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch i b{flex:1}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
/* Profile dropdown */
.prof-head{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px}
.prof-av{flex:none;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:var(--title-sm);font-weight:600}
.prof-chev{color:var(--accent);font-size:var(--text-xl)}

/* ---------- Setup wizard and new screens ---------- */
body.in-setup nav.tabs{display:none}
body.in-setup .wrap{padding-bottom:calc(24px + var(--safe-bottom))}
.ob{width:100%;min-width:0;max-width:430px;margin:0 auto;min-height:calc(100vh - 80px);padding:2px 0 24px;display:flex;flex-direction:column;gap:16px}
.ob-top{display:flex;align-items:center;justify-content:space-between;min-height:24px}
.ob-back{border:0;background:none;padding:0;font-weight:700;color:var(--muted);font-size:var(--text-base)}
.ob-step{font-size:var(--text-xs);font-weight:800;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted)}
.ob-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ob-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.ob h1{font-size:var(--title-xl);line-height:1.08}
.ob .lead{font-size:var(--text-base);color:var(--muted);margin:-6px 0 0}

.ob.auth-screen{min-height:0;padding-bottom:calc(72px + var(--safe-bottom))}
.auth-screen :is(button,input){scroll-margin-bottom:calc(72px + var(--safe-bottom))}
.auth-policies{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + var(--safe-bottom)) max(16px,env(safe-area-inset-left,0px));justify-content:center;gap:16px}

.opt .ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:var(--text-xl);font-weight:800}
.opt b{font-size:var(--text-xl);display:block}.opt span.d{font-size:var(--text-md);color:var(--muted);display:block;margin-top:2px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.opt.sel .ic{background:var(--accent);color:var(--on-accent)}
.tkb{flex:none;align-self:center;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--text-md);font-weight:800;color:var(--on-accent)}
.opt.sel .tkb{background:var(--accent);border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.painchip{min-height:44px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:var(--text-base);color:var(--ink)}
.painchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.health{background:var(--warn-soft);border-radius:16px;padding:12px 14px;font-size:var(--text-md);line-height:1.45}
.spacer{flex:1}
.cta{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;min-height:52px;font-weight:800;font-size:var(--text-lg);width:100%;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.cta:disabled{opacity:.45;box-shadow:none;cursor:default}
.later{border:0;background:none;text-align:center;font-size:var(--text-md);font-weight:700;color:var(--muted);margin-top:-6px;padding:6px}
.result{background:var(--surface);box-shadow:var(--shadow);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.badge{align-self:flex-start;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:var(--text-2xs);letter-spacing:var(--label-track);text-transform:uppercase;padding:5px 10px;border-radius:999px}
.wk{display:grid;grid-template-columns:90px 1fr;gap:10px;font-size:var(--text-md);padding:8px 0;border-top:1px solid var(--line)}
.wk b{font-family:var(--display);font-size:var(--text-lg)}
.app-version{display:block;margin:8px auto 0;padding:10px 8px;border:0;background:none;color:var(--muted);font-size:var(--text-xs);font-weight:400;line-height:1.4;overflow-wrap:anywhere}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:800;font-size:var(--text-md);text-decoration:underline;text-underline-offset:3px}
.lvl{display:block;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;border-radius:18px;padding:12px 14px;color:var(--ink)}
.lvl.sel{border-color:var(--accent)}
.lvl .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl .h b{font-size:var(--text-lg)}
.lvlpick{border:0;background:none;padding:0;text-align:left;color:inherit;display:block}
.lvl .more{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:var(--text-md);display:flex;flex-direction:column;gap:5px}
.field2{display:flex;flex-direction:column;gap:6px}
.flabel{font-weight:700;font-size:var(--text-base)}
.field2 .in{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:0 14px;font-size:var(--text-xl);font-weight:600;color:var(--ink)}
.inwrap{position:relative;display:block}

.inwrap .u{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:var(--text-sm);color:var(--muted);font-weight:700}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1}
.two{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
.eqhead{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.eqhead b{font-family:var(--body);font-size:var(--text-xs);font-weight:800;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--accent)}
.selall{border:0;background:none;padding:0;font-size:var(--text-sm);font-weight:800;color:var(--accent)}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:var(--text-sm);font-weight:700;line-height:1.15;min-height:104px;color:var(--ink)}
.eq svg{width:46px;height:46px;color:var(--ink);opacity:.35}

.eq.on .tk{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day7{aspect-ratio:1/1.15;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:var(--text-md);gap:2px;color:var(--ink);padding:0}
.day7 small{font-size:var(--text-2xs);font-weight:700;color:var(--muted)}
.day7.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.day7.on small{color:var(--on-accent);opacity:.85}
.mins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.min{border-radius:16px;border:1.5px solid var(--line);background:var(--surface);padding:10px 4px;text-align:center;color:var(--ink)}
.min b{font-family:var(--display);font-size:var(--title-md);display:block;line-height:1}
.min span{font-size:var(--text-xs);color:var(--muted);font-weight:700}
.min.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.note2{background:var(--sunk);border-radius:14px;padding:10px 12px;font-size:var(--text-md)}
.wday{background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px}
.wday .h{display:flex;justify-content:space-between;align-items:baseline}
.wday .h b{font-family:var(--display);font-size:var(--title-xs)}
.wex{display:flex;justify-content:space-between;gap:8px;font-size:var(--text-md);padding:5px 0;border-top:1px solid var(--line)}
.wex:first-of-type{border-top:0}
.wex span:last-child{color:var(--muted);white-space:nowrap}
.why{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px}
.why summary{cursor:pointer;font-weight:600;min-height:44px;align-content:center}
.why-body{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.today-progress .rings{grid-template-columns:132px minmax(0,1fr);gap:18px;padding:4px 0;width:fit-content;max-width:100%;margin-inline:auto;text-align:left}
.today-progress .rings svg{width:132px;height:132px}
.today-progress .rings .mv{font-size:var(--title-lg);white-space:nowrap}
.today-progress .rings .mv small{display:inline;margin-left:4px}

@media(max-width:360px){
  .today-progress .rings{grid-template-columns:112px minmax(0,1fr);gap:12px}

  .today-progress .rings .mv small{font-size:var(--text-2xs)}
  .today-progress .rings .ml{font-size:var(--text-2xs)}
}
.today-workout{gap:12px}
.today-workout h1{margin:0}

@media(max-width:360px){.today-workout-summary{grid-template-columns:minmax(0,1fr) 104px;gap:8px}.today-muscle-preview{width:104px;gap:0}.today-muscle-preview svg{width:52px;height:104px}.today-schedule{gap:4px 6px}}

.today-strength-row{grid-template-columns:24px minmax(0,1fr) auto;padding:14px 0;gap:10px}

.today-exercise-preview{position:relative;width:88px;height:88px;overflow:hidden;padding:0;border:0;border-radius:10px;background:var(--sunk);color:var(--muted);display:grid;place-items:center}

@media(max-width:359px){.today-strength-row.has-preview{grid-template-columns:18px 88px minmax(0,1fr) auto;gap:6px}.today-strength-row.has-preview>.pnum{width:18px}.today-strength-row.has-preview>.btn{padding-left:6px;padding-right:6px}}

.today-plan-heading svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.today-plan-group{display:flex;align-items:center;justify-content:space-between;gap:12px}

.cm-today{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 44px 12px 16px}

.wcard .ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700}

/* Week order */
.ordrow{display:flex;align-items:center;gap:10px;background:var(--sunk);border-radius:14px;padding:8px 8px 8px 12px}
.ordday{flex:none;width:38px;font-weight:800;font-size:var(--text-md);color:var(--accent)}

/* Settings sections */
.settings-menu{display:grid;gap:12px}
/* Profile & settings: coaching first, then compact icon rows. */
.settings-list{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.settings-row{display:flex;align-items:center;gap:14px;min-height:76px;width:100%;padding:16px;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}

.settings-heading p{margin:0}
.settings-back{align-self:flex-start;padding-left:0}

.settings-coaching .row.between{flex-wrap:wrap;gap:10px}
.settings-coaching .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;white-space:normal;overflow-wrap:anywhere}

.settings-coaching-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.settings-fields .row{flex-wrap:wrap}
.settings-fields select{max-width:100%}
.settings-fields>.field2{width:100%}
.settings-save-note{margin:0}
@media(max-width:360px){.settings-row{gap:10px;padding:14px 12px}.settings-row b{font-size:var(--text-base)}}
.settings-link{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;color:var(--ink);cursor:pointer;font-family:var(--body)}
.settings-link>span:first-child{min-width:0;display:grid;gap:5px}
.settings-link b{font-family:var(--display);font-size:var(--title-md);font-weight:600}
.settings-link>span:last-child{font-size:var(--title-lg);color:var(--accent)}
.sec-head .tiny{overflow-wrap:anywhere}
.sec-body .row{flex-wrap:wrap}
.sec-body select{max-width:100%}

.sec-head{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:16px}

.sec-body{padding:2px 16px 16px;border-top:1px solid var(--line);padding-top:12px}
/* Warm-up / cool-down rows */

.xbtns{display:flex;gap:4px;flex:none}
.xd{display:block;font-size:var(--text-md)}
.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:var(--text-sm);font-weight:700;color:var(--muted)}
/* Progress rings */
.rings{display:grid;grid-template-columns:132px 1fr;gap:18px;align-items:center;padding:20px}
.rings svg{width:132px;height:132px;display:block}
.rings .ml{font-family:var(--body);font-weight:800;font-size:var(--text-2xs);letter-spacing:var(--label-track);text-transform:uppercase}
.rings .mv{font-family:var(--display);font-size:var(--title-lg);font-weight:500;line-height:1.05;font-variant-numeric:tabular-nums}
.rings .mv small{font-family:var(--body);font-size:var(--text-xs);color:var(--muted);font-weight:600;margin-left:4px}
.rings .m{margin-bottom:10px} .rings .m:last-child{margin-bottom:0}
.rings .r1{color:var(--accent)} .rings .r2{color:var(--rose)} .rings .r3{color:var(--gold)}
@media (prefers-reduced-motion: no-preference){ .rings circle.arc{transition:stroke-dasharray .8s ease} }

/* focus workout flow */
body.in-focus nav.tabs, body.in-focus header.top{display:none}
/* Let the banner and safe-area padding take their share of the viewport before
   the workout expands. A viewport-sized child adds those offsets a second time. */
body.in-focus{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
body.in-focus>#app-shell{flex:1;display:flex;flex-direction:column;padding-bottom:calc(24px + var(--safe-bottom))}
body.in-focus #app{flex:1}
.focus{display:flex;flex:1;flex-direction:column;gap:14px;min-height:0}
.focus h1{font-size:var(--title-xl);line-height:1.1;margin:2px 0 0}
.focus.fcenter{align-items:center;text-align:center}
.ftop{display:flex;align-items:center;gap:10px;width:100%;padding-top:4px}
.ficon{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);font-size:var(--text-xl);font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.ficon.sm{width:44px;height:44px;font-size:var(--title-sm)}
.fsegs{display:flex;gap:4px;flex:1}.fsegs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.fsegs i.d{background:var(--accent)}.fsegs i.c{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.ffoot{margin-top:auto;display:flex;flex-direction:column;gap:6px;width:100%;padding-top:6px}
.fbig{min-height:58px;border-radius:18px;font-size:var(--text-xl);font-weight:800}
.ftarget{margin:2px 0}.ftarget .big{font-size:44px;font-weight:600}.ftarget .mid{font-size:var(--title-lg)}
.fstep{flex:1;background:var(--sunk);border:1px solid var(--line);border-radius:18px;padding:10px 8px;text-align:center;min-width:0}
.fstep .fl{font-size:var(--text-xs);font-weight:800;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted)}
.fstep .frow{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.fval{display:flex;align-items:baseline;justify-content:center;min-width:0;flex:1}
.fval input{width:100%;max-width:84px;border:0;background:transparent;text-align:center;font-size:var(--title-xl);font-weight:600;padding:0}
.fval input:focus{outline:2px solid var(--accent);border-radius:8px}
.fval small{font-size:var(--text-sm);color:var(--muted);margin-left:-2px}
.fdots{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.fdot{width:10px;height:10px;border-radius:5px;border:0;padding:0;background:var(--line)}
.fdot.d{background:var(--accent);cursor:pointer}.fdot.c{width:28px;background:var(--accent)}
.fdots .tiny{margin-left:6px}
.fcue{background:var(--sunk);box-shadow:none;border:1px solid var(--line)}
.flinks{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.flinks .linkbtn{text-decoration:none;font-size:var(--text-base)}
.fring{width:250px;height:250px;margin:4px 0}
.fclock{font-family:var(--display);font-size:60px;font-weight:600;fill:var(--ink)}
.fsub{font-family:var(--body);font-size:var(--text-base);font-weight:700;fill:var(--muted)}
.fdone{width:64px;height:64px;border-radius:50%;background:var(--good-soft);color:var(--good);font-size:var(--title-xl);font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto}
.frec{background:var(--accent);color:var(--on-accent);display:flex;justify-content:space-between;align-items:center;gap:10px}
.frec .num{font-size:40px;font-weight:600;line-height:1.1}
.fnote{border:0;text-align:left;font-size:var(--text-md);background:var(--warn-soft);box-shadow:none}
.fl-list .xrow{padding:10px 0}
.fl-sheet{display:flex;flex-direction:column;background:var(--surface);border-radius:18px;padding:2px 14px;box-shadow:var(--shadow)}
.fli{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.fli:first-child{border-top:0}
.fmark{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--text-sm);color:var(--muted)}
.fmark.d{background:var(--good-soft);color:var(--good);border-color:transparent}.fmark.c{background:var(--accent);color:var(--on-accent);border-color:transparent}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.gring{width:230px;height:230px;margin:2px 0}
.ficon:disabled{opacity:.3;cursor:default}
.gringw{position:relative;width:200px;height:200px;flex:none}.gringw.sm{width:150px;height:150px}
.gringw .gring{width:100%;height:100%;margin:0}
.gringt{position:absolute;inset:16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.gclock{font-family:var(--display);font-weight:600;font-size:50px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.gringw.sm .gclock{font-size:38px}
.gsub{font-size:var(--text-xs);font-weight:800;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--muted);line-height:1.25;overflow-wrap:anywhere}
.gchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.gchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:var(--text-md);font-weight:700;cursor:pointer;max-width:100%}
.gchip .num{color:var(--muted);font-weight:800}
.gchip.on{background:var(--accent);border-color:transparent;color:var(--on-accent)}.gchip.on .num{color:inherit;opacity:.85}
.gchip.done{opacity:.5}
.ghint{font-size:var(--text-md);font-weight:700;color:var(--accent);margin-top:-4px}
.gtools{display:flex;gap:6px;align-items:center}
.gtool{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.focus.gcompact{gap:10px}
.focus.gcompact h1{font-size:var(--title-md);line-height:1.15}
.gc{width:58px;height:58px;color:var(--ink)}.gc.big{width:74px;height:74px;background:var(--accent);color:var(--on-accent)}
.setnav{display:flex;align-items:center;justify-content:center;gap:12px}
.setnav .linkbtn{font-size:var(--text-md)}
.fsetdone{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.fsetchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:var(--text-sm);color:var(--ink);cursor:pointer}
.fsetchip b{color:var(--accent);font-weight:800;margin-left:4px}
/* Workout screens, one-card layout: labelled progress, one card, one button row */
.ftop .fprog{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.ftop .fprog .fsegs{flex:none}
.ftop .ficon{width:44px;height:44px}
.acard .gchip{min-height:44px}
.ftop .flabel{font-size:var(--text-xs);font-weight:800;letter-spacing:var(--label-track);text-transform:uppercase;color:var(--accent);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ahead{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.ahead .asub{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.ahead .asub>:first-child{min-width:0;flex:1}
.howbtn{flex:none;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:var(--text-md);font-weight:800;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.howbtn svg{width:14px;height:14px}
.acard{width:100%;border-radius:24px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;text-align:left}
.acard .ach{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.acard .ach>b{font-family:var(--display);font-weight:600;font-size:var(--title-sm);line-height:1.15}
.acard .ach>b span{color:var(--muted);font-weight:500}
.acard .ach .goal{font-size:var(--text-md);font-weight:700;color:var(--accent);text-align:right}
.asteps{display:flex;gap:10px}
.asteps .fstep{border:0;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.asteps .fstep .fl{font-size:var(--text-2xs);letter-spacing:var(--label-track)}
.asteps .fval{flex:none;max-width:100%}
.asteps .fval input{font-family:var(--display);font-size:46px;line-height:1;height:52px;max-width:118px;min-width:34px}
.asteps .fval small{font-size:var(--text-base);font-weight:700;margin-left:3px;white-space:nowrap}
.asteps .abtns{display:flex;gap:10px}
.abtn{width:48px;height:44px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:var(--title-md);font-weight:700;line-height:1;box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 16%,transparent);cursor:pointer}
.astrip{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.workout-path{width:100%;min-width:0;display:grid;grid-template-columns:16px minmax(0,1fr) 16px;padding:8px 0}
.path-scroll{overflow-x:auto;overflow-y:hidden;min-width:0;padding:4px 0;scrollbar-width:none;overscroll-behavior-x:contain}.path-scroll::-webkit-scrollbar{display:none}
.path-track{position:relative;isolation:isolate;display:flex;gap:0;width:max-content;min-width:100%;justify-content:center;align-items:center}
.path-track:before{content:'';position:absolute;left:20px;right:20px;top:50%;height:1px;background:var(--line);z-index:-1}
.path-stop{width:68px;flex:none;display:flex;flex-direction:column;align-items:center}.path-stop.rest{width:36px}
.path-stop button{font:600 var(--text-sm) var(--body);color:var(--ink);cursor:pointer}
.path-set{width:100%;min-height:44px;padding:7px 4px;border:1px solid transparent;border-radius:13px;background:var(--sunk);display:flex;align-items:center;justify-content:center;white-space:nowrap}
.path-set.done{background:color-mix(in srgb,var(--accent) 15%,var(--surface));color:var(--muted)}.path-set.current{background:var(--accent);color:var(--on-accent)}
.path-status,.workout-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.path-set[aria-pressed="true"]:not(.current){outline:1.5px solid var(--accent);outline-offset:2px}
.path-rest{width:36px;min-height:44px;display:grid;place-items:center;padding:0;border:0;background:var(--surface)}
.path-clock{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--muted)}.path-clock svg{width:21px;height:21px}
.path-rest.current .path-clock{background:var(--accent);color:var(--on-accent)}.path-rest[aria-pressed="true"]:not(.current) .path-clock{outline:1.5px solid var(--accent);outline-offset:2px}
@keyframes path-arrive{from{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent)}to{box-shadow:0 0 0 0 transparent}}
.path-set.path-arrive,.path-rest.path-arrive .path-clock{animation:path-arrive .5s ease-out}

// Stamped into this HTML by both deployment builds, so offline/older tabs keep their identity.
const APP_BUILD = {"id":"source","commit":null};
const APP_VERSION = APP_RELEASES[0].version;
function appVariant(){return APP_BUILD.variant||(IS_PRODUCTION?'main':'dev');}
function appVersionLabel(version=APP_VERSION,variant=appVariant()){return `v${version}${variant==='main'?'':'-'+variant}`;}
function appBuildLabel(){return `${appVersionLabel()} · ${APP_BUILD.id} · ${IS_PRODUCTION?'Live':'Testing'}`;}
function releaseNotes(version=APP_VERSION){
  const known=APP_RELEASES.some(r=>r.version===version);
  modal(`<div><div class="eyebrow">Strong Start</div><h2>Release notes</h2><p class="tiny muted" style="overflow-wrap:anywhere">${esc(appBuildLabel())}</p></div>
    ${APP_BUILD.commit?`<a class="tiny" href="https://github.com/knitko95/strong-start/commit/${esc(APP_BUILD.commit)}" target="_blank" rel="noopener noreferrer">View build source</a>`:'<p class="tiny muted">Unpackaged source; no deployment commit recorded.</p>'}
    ${!known?`<p class="small">Release notes are unavailable for ${esc(version||'this older build')}.</p>`:''}
    ${APP_RELEASES.map(r=>`<details class="card" ${r.version===version?'open':''}><summary><b>v${esc(r.version)} · ${esc(r.title)}</b><span class="tiny muted" style="display:block">${esc(r.date)}${r.version===APP_VERSION?' · This app version':''}</span></summary><ul class="small">${r.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`).join('')}
    <p class="tiny muted">Version tracking starts at v0.1.0. Earlier feedback has no recorded version. Testing changes await a live release.</p>
    <button class="btn" data-action="closemodal">Done</button>`);
}

// Enabled only by the dev2 build; regular dev and production retain sign-in.
const DEV2_DEMO_BUILD = false;
const DEMO_MODE = DEV2_DEMO_BUILD && !IS_PRODUCTION;
const storageKey = key => DEMO_MODE ? 'dev2_demo_' + key : IS_PRODUCTION ? key : 'dev_' + key;
if (!IS_PRODUCTION) {
  document.title = 'Strong Start · Testing';
  const banner = document.createElement('div');
  banner.id = 'environment-banner';
  banner.textContent = DEMO_MODE ? 'DEV2 DEMO · Sample user · Saved in this browser only' : 'TESTING · Separate test accounts and data';
  banner.setAttribute('role', 'status');
  banner.style.cssText = 'background:#704000;color:#fff;text-align:center;padding:7px 12px;font:700 12px system-ui;';
  document.body.insertBefore(banner, document.body.firstChild);
  const manifest = document.querySelector('link[rel="manifest"]');
  manifest.href = 'manifest.dev.webmanifest';
  document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'Strong Start Dev';
  document.querySelector('meta[name="application-name"]').content = 'Strong Start Dev';
}

function reqFor(e){

    if(c==='mc'){ const m=MACH_BY_NAME.find(([re])=>re.test(n)); g.push([m?m[1]:'chestpress']); continue; }
    if(c==='bb'){
      if(/^Trap Bar/.test(n)) g.push(['trap']);
      else if(/^EZ-Bar/.test(n)) g.push(['ez']);
      else if(/^Barbell (Curl|Skull)/.test(n)) g.push(['bb','ez']);
      else { g.push(['bb']); if(RACK_LIFTS.test(n)) g.push(['rack','smith']); }
      continue; }
    if(c==='bn'){
      if(STEP_UPS.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(SPLIT_BENCH.test(n)) g.push(['bn','adjb','bx','step','rigstep']);
      else if(INCLINE.test(n)) g.push(['adjb']);
      else g.push(['bn','adjb']);

    if(c==='bx'){ g.push(BOX_STEPS.test(n)?['bx','step','rigstep','bn','adjb']:PLATFORM_JUMPS.test(n)?['bx','step','rigstep']:['bx']); continue; }

}

// Session coverage uses the same exercise mapping as Plan, with primary taking
// precedence when a muscle also supports another exercise in this session.
function workoutMuscles(slots){
  const primary=new Set(), secondary=new Set(), items={};
  for(const slot of slots){
    const mapping=EXM[slot.id]; if(!mapping) continue;
    for(const [ids,role,set] of [[mapping.p,'Main',primary],[mapping.s,'Supporting',secondary]]){
      for(const m of ids){
        if(!MUSCLES[m]) continue;
        set.add(m); (items[m]??=[]).push({id:slot.id,role});
      }
    }
  }
  const p=[...primary],s=[...secondary].filter(m=>!primary.has(m));
  return {p,s,items,color:m=>primary.has(m)?'var(--accent)':secondary.has(m)?'var(--rose)':'var(--mbase)'};
}
function workoutMuscleSummary(coverage){
  const grouped={front_delts:'Shoulders',side_delts:'Shoulders',rear_delts:'Shoulders',abs:'Core',obliques:'Core',hip_flexors:'Hip flexors',forearms:'Forearms'};
  const labels=[...new Set(coverage.p.map(m=>grouped[m]||MUSCLES[m]))];
  if(!labels.length) return 'View muscle details';
  const shown=labels.slice(0,4).map((name,i)=>i?name.toLowerCase():name);
  if(labels.length>4) return shown.join(', ')+` + ${labels.length-4} more`;
  return shown.length>1?shown.slice(0,-1).join(', ')+' & '+shown.at(-1):shown[0];
}

function weekMuscles(split){
  const map={}; Object.keys(MUSCLES).forEach(m=>map[m]={score:0,items:[]});

    const {p,s}=EXM[sl.id];

async function readAccountChanges(base,current){

    let account=copySync(base||{state:null,logs:[],deleted:[],revision:'0'}),after=null,revision=null;
    const byId=new Map(account.logs.map(l=>[l.id,l])),deleted=new Set(account.deleted||[]);
    do{
      const {data,error}=await sb.rpc('read_account_changes',{p_since:base?base.revision:null,p_after:after,p_expected:revision});
      if(!current())return null;
      if(error)throw error;
      if(!data)return null;
      if(data.restart){revision=null;break;}
      revision=data.revision;account.state=data.state;account.revision=revision;
      for(const row of data.changes){if(row.deleted){byId.delete(row.id);deleted.add(row.id);}else{byId.set(row.id,row.data);}}

async function connectSignIn(provider){
  if(IS_PRODUCTION||!AUTH.user||AUTH.access!=='ok'||coachMode||SIGNINS.busy||SIGNINS.loading||!['google','apple'].includes(provider)||!AUTH[provider])return;
  const uid=AUTH.user.id;SIGNINS.busy=true;SIGNINS.err='';SIGNINS.msg='';showSignInMethods();
  try{
    if(navigator.onLine===false)throw Error('network');
    const user=await freshSignInUser(uid);
    if(user.identities?.some(i=>i.provider===provider))throw Error('already connected');
    if(!await flushCloud())throw Error('sync pending');
    if(AUTH.user?.id!==uid||coachMode)throw Error('account changed');
    // A tab-scoped marker contains only the expected account ID and provider.
    // Failure to store it must stop the redirect rather than risk account switching.
    sessionStorage.setItem(LINK_KEY,JSON.stringify({uid,provider,started:Date.now()}));

    if(target.username||target.password||![SB_URL,providerOrigin].includes(target.origin))throw Error('invalid redirect');

function confirmDisconnect(provider,id){
  if(IS_PRODUCTION||!AUTH.user||coachMode||SIGNINS.busy||SIGNINS.loading||!['google','apple'].includes(provider))return;
  const identity=SIGNINS.identities.find(i=>i.provider===provider&&(i.identity_id||i.id)===id);
  if(!identity||!canDisconnect(identity,SIGNINS.identities))return;
  const uid=AUTH.user.id;

async function disconnectSignIn(provider,id,uid){
  if(IS_PRODUCTION||AUTH.user?.id!==uid||coachMode||SIGNINS.busy)return;
  SIGNINS.busy=true;SIGNINS.err='';SIGNINS.msg='';showSignInMethods();
  try{
    const user=await freshSignInUser(uid),list=user.identities||[],identity=list.find(i=>i.provider===provider&&(i.identity_id||i.id)===id);
    if(!identity||!['google','apple'].includes(provider)||!canDisconnect(identity,list))throw {code:'single_identity'};
    const {error}=await sb.auth.unlinkIdentity(identity);if(error)throw error;
    const updated=await freshSignInUser(uid);SIGNINS.identities=updated.identities||[];SIGNINS.msg=`${signInName(provider)} disconnected.`;

function finishAccountLink(){
  if(accountLinkFlight)return accountLinkFlight;
  const pending=pendingAccountLink;if(!pending)return Promise.resolve();
  accountLinkFlight=(async()=>{
    let user=null,message='';
    try{
      const {data,error}=await withTimeout(sb.auth.getUser(),10000);if(error)throw error;
      user=data?.user;
      if(!user||user.id!==pending.uid)throw Error('account mismatch');
      if(Date.now()-pending.started>30*60*1000||Date.now()<pending.started)throw Error('expired');
      if(!user.identities?.some(i=>i.provider===pending.provider))throw {code:'access_denied'};
      message=`${signInName(pending.provider)} is connected to this account.`;
    }catch(e){message=signInError(e);}
    finally{clearAccountLink();}
    if(user?.id===pending.uid){
      AUTH.access=null;await onSignedIn(user);
      Object.assign(SIGNINS,{uid:user.id,identities:user.identities||[],loading:false,busy:false,err:'',msg:message});
      ui.tab='settings';ui.settingsGroup='account';ui.open={...ui.open,account:true};render();
      if(AUTH.access==='ok')showSignInMethods();
    }else{
      // Do not load a different account or upload the original device copy to it.
      AUTH.user=null;AUTH.access=null;AUTH.coach=false;FB.owner=false;CLOUD.ok=false;clearTimeout(CLOUD.t);
      try{await sb.auth.signOut({scope:'local'});}catch(e){}
      lsSet(ACCT_KEY,null);closeModal();AUTH.err='Couldn’t confirm the account connection. Sign in with your original method. Your device copy has been kept.';render();
    }
  })().finally(()=>{accountLinkFlight=null;});
  return accountLinkFlight;
}

function authFriendly(e){
  const s=String((e&&(e.message||e.error_description))||e||'');
  if(/invalid login/i.test(s)) return 'That email and password don’t match. Check them, or reset your password.';
  if(/not confirmed/i.test(s)) return 'Please confirm your email first. Look for the link we sent you.';
  if(/already registered|already exists/i.test(s)) return 'There’s already an account with that email. Sign in instead.';
  if(/rate limit|too many/i.test(s)) return 'Too many tries. Wait a few minutes and try again.';
  if(/password/i.test(s) && /(6|8|short|weak|characters)/i.test(s)) return 'Pick a longer password (8 or more characters).';
  if(/fetch|network|timeout/i.test(s)) return 'Can’t reach the internet. Check your connection and try again.';
  return s || 'Something went wrong. Try again.';
}

  cmKeepDraft();CM.thread=null;
  if(CM.viewportFrame&&window.cancelAnimationFrame)window.cancelAnimationFrame(CM.viewportFrame);CM.viewportFrame=null;
  clearTimeout(CM.viewportSettleTimer);CM.viewportSettleTimer=null;
  document.documentElement.style.removeProperty('--cm-sheet-top');document.documentElement.style.removeProperty('--cm-sheet-height');
  const input=$('#cm-text');if(input&&document.activeElement===input)input.blur();
  document.body.classList.remove('coach-messaging-open','cm-keyboard-open');
  const lock=CM.viewportLock;if(!lock)return;CM.viewportLock=null;
  for(const [property,value,priority] of lock.styles){if(value)document.body.style.setProperty(property,value,priority);else document.body.style.removeProperty(property);}
  document.documentElement.classList.remove('cm-scroll-lock');
  window.scrollTo(lock.x,lock.y);

async function cmOpen(member=null,name='',logId=null){

  if(AUTH.coach&&!coach)return;

  cmKeepDraft();

  if(logId&&!coach)draft.workout=fbWorkout('coach',logId);
  const t={member:mid,coach,name:coach?name:CM.summary&&CM.summary.coach&&CM.summary.coach.name||'Your coach',messages:[],loading:true,err:'',draft,hasMore:false,busy:!!draft.sending};
  CM.thread=t;cmDraw();await cmLoad(t);

async function cmLoad(t,older=false){
  const owner=CM.owner,generation=CM.generation,request=t.readVersion=(t.readVersion||0)+1;
  t.loading=true;t.err='';cmDraw();
  try{const data=await cmRpc('read',t.member,older?{before:t.messages[0].id}:{});
    if(!cmCurrent(owner,generation)||CM.thread!==t||t.readVersion!==request)return;
    t.name=t.coach?data.member_name:data.coach_name;t.access=data.access||[];
    const merged=new Map((older?t.messages:[]).map(m=>[m.id,m]));data.messages.forEach(m=>merged.set(m.id,m));
    t.messages=[...merged.values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)||(BigInt(a.id)<BigInt(b.id)?-1:1));t.hasMore=data.has_more;t.through=data.through;t.needsReply=data.needs_reply;t.loading=false;cmDraw(!older);cmRefresh();
  }catch(e){if(cmCurrent(owner,generation)&&CM.thread===t&&t.readVersion===request){t.loading=false;t.err='Couldn’t load this conversation. Check your connection and try again.';cmDraw();}}
}

function cmLockPage(){
  if(CM.viewportLock)return;
  const properties=['position','top','left','width','overflow'];
  CM.viewportLock={x:window.scrollX,y:window.scrollY,width:window.innerWidth,height:Math.max(window.innerHeight,document.documentElement.clientHeight),styles:properties.map(p=>[p,document.body.style.getPropertyValue(p),document.body.style.getPropertyPriority(p)])};
  document.body.style.position='fixed';document.body.style.top=-CM.viewportLock.y+'px';document.body.style.left=-CM.viewportLock.x+'px';document.body.style.width='100%';document.body.style.overflow='hidden';
  document.documentElement.classList.add('cm-scroll-lock');

function cmSettleViewport(){
  if(!CM.thread)return;
  cmViewport();
  if(CM.viewportFrame&&window.cancelAnimationFrame)window.cancelAnimationFrame(CM.viewportFrame);
  if(window.requestAnimationFrame)CM.viewportFrame=window.requestAnimationFrame(()=>{
    cmViewport();CM.viewportFrame=window.requestAnimationFrame(()=>{CM.viewportFrame=null;cmViewport();});
  });
  // Home Screen viewport movement can complete after the first painted frame.
  clearTimeout(CM.viewportSettleTimer);CM.viewportSettleTimer=setTimeout(()=>{CM.viewportSettleTimer=null;cmViewport();},120);
}
function cmViewport(){
  if(!CM.thread)return;
  const scrim=$('#modal .coach-thread-scrim');if(!scrim)return;
  const viewport=window.visualViewport,height=viewport?viewport.height:window.innerHeight;
  // In the iOS Home Screen app the fixed overlay is already in the visible
  // coordinate space. Adding its keyboard pan again pushes the form underneath it.
  const top=hsStandalone()&&hsEnv().ios?0:viewport?viewport.offsetTop:0;
  // Keep the backdrop full-size. Position only the sheet inside it, accounting
  // for WebKit moving the fixed backdrop when the Home Screen keyboard pans.
  const layoutHeight=Math.max(document.documentElement.clientHeight,window.innerHeight),lock=CM.viewportLock;
  if(lock&&lock.width!==window.innerWidth){lock.width=window.innerWidth;lock.height=layoutHeight;}
  const keyboard=Math.max(layoutHeight,lock?lock.height:0)-height>120;
  document.body.classList.toggle('cm-keyboard-open',keyboard);
  const gap=keyboard||window.innerWidth<=600?0:Math.min(64,Math.max(0,height-240));
  document.documentElement.style.setProperty('--cm-sheet-top',(top-scrim.getBoundingClientRect().top+gap)+'px');
  document.documentElement.style.setProperty('--cm-sheet-height',Math.max(1,height-gap)+'px');
}
async function cmSend(){
  const t=CM.thread;if(!t||t.busy||t.draft.sending)return;cmKeepDraft();const message=t.draft.text.trim();if(!message){$('#cm-text').focus();return;}
  const owner=CM.owner,generation=CM.generation;
  t.draft.clientId=t.draft.clientId||crypto.randomUUID();const id=t.draft.clientId;
  const body={message,tag:t.draft.tag||null,client_id:id,through:cmThrough(t),workout:t.draft.workout};t.busy=true;t.draft.sending=true;t.err='';cmDraw();
  try{await cmRpc('send',t.member,body);if(!cmCurrent(owner,generation))return;
    if(t.draft.clientId===id){t.draft.text='';t.draft.tag='';t.draft.tagsOpen=false;t.draft.clientId=null;}
    CM.drafts[t.member]=t.draft;t.busy=false;t.draft.sending=false;
    const active=CM.thread;if(active&&active.member===t.member&&active.draft===t.draft){active.busy=false;await cmLoad(active);}cmRefresh();
  }catch(e){if(cmCurrent(owner,generation)){t.busy=false;t.draft.sending=false;const active=CM.thread;if(active&&active.member===t.member&&active.draft===t.draft){active.busy=false;active.err='Couldn’t confirm send. Your message is kept here. Retry to send it once.';cmDraw();}}}
}
async function cmDone(){const t=CM.thread;if(!t||!t.coach||t.busy)return;const owner=CM.owner,generation=CM.generation;t.busy=true;const through=cmThrough(t);try{await cmRpc('done',t.member,{through});if(!cmCurrent(owner,generation))return;t.busy=false;if(CM.thread===t)await cmLoad(t);cmRefresh();}catch(e){if(cmCurrent(owner,generation)){t.busy=false;t.err='Couldn’t mark done. Try again.';if(CM.thread===t)cmDraw();}}}
async function cmDismiss(){const c=CM.summary&&CM.summary.coach;if(!c||!c.unread)return;const owner=CM.owner,generation=CM.generation;try{await cmRpc('dismiss',null,{through:c.through});if(cmCurrent(owner,generation))await cmRefresh();}catch(e){if(cmCurrent(owner,generation))toast('Couldn’t dismiss the message. Check your connection and try again.');}}
function cmAction(a,b){
  if(a==='cmnew'){cmShowNew();return true;}
  if(a==='cmopen'){cmOpen(b.dataset.id||null,b.dataset.n||'',b.dataset.log||null);return true;}
  if(a==='cmrefresh'){cmRefresh();return true;}
  if(a==='cmdismiss'){cmDismiss();return true;}
  if(a==='cmfilter'){ui.cmFilter=b.dataset.v;render();return true;}
  if(a==='cmsend'){cmSend();return true;}
  if(a==='cmdone'){cmDone();return true;}
  const t=CM.thread;if(!t)return false;
  if(a==='cmreload'||a==='cmolder'){if(!t.loading&&!t.busy)cmLoad(t,a==='cmolder');return true;}
  if(a==='cmtags'){cmKeepDraft();if(t.draft.tag){t.draft.tag='';t.draft.clientId=null;}else t.draft.tagsOpen=!t.draft.tagsOpen;cmDraw();return true;}
  if(a==='cmtag'){cmKeepDraft();t.draft.tag=t.draft.tag===b.dataset.v?'':b.dataset.v;t.draft.tagsOpen=false;t.draft.clientId=null;cmDraw();return true;}
  return false;
}

/* Realtime is an invalidation signal; authorized RPCs remain the source of truth. */
function cmLiveVisible(){return document.visibilityState!=='hidden';}
function cmLiveCurrent(live){return CM.live===live&&cmCurrent(live.owner,live.generation)&&!coachMode&&AUTH.access==='ok';}
function cmLiveStop(){
  const live=CM.live;if(!live)return;CM.live=null;clearTimeout(live.timer);clearTimeout(live.retry);clearInterval(live.poll);
  if(live.channel){try{const removed=live.client.removeChannel(live.channel);if(removed&&removed.catch)removed.catch(()=>{});}catch(e){}}
}
function cmLiveStatus(){
  const label=!navigator.onLine?'Offline':!CM.live||CM.live.status!=='SUBSCRIBED'||CM.live.fetchFailed?'Reconnecting…':'';
  const el=$('#cm-live-status');if(el)el.textContent=label;
}
function cmLiveStart(){
  if(!sb||!AUTH.user||AUTH.deleting||coachMode||AUTH.access!=='ok'||!cmLiveVisible()||navigator.onLine===false)return;
  if(CM.live&&cmLiveCurrent(CM.live))return;
  cmLiveStop();const live={owner:CM.owner,generation:CM.generation,client:sb,status:'CONNECTING',channel:null,timer:null,poll:null,running:false,pending:false};CM.live=live;
  if(typeof sb.channel==='function')try{
    live.channel=sb.channel('coach-messages-'+live.owner+'-'+live.generation)
      .on('postgres_changes',{event:'INSERT',schema:'public',table:'coach_messages'},()=>cmLiveSchedule(live))
      .on('postgres_changes',{event:'UPDATE',schema:'public',table:'coach_messages'},()=>cmLiveSchedule(live));
    live.channel.subscribe(status=>{if(!cmLiveCurrent(live))return;live.status=status;cmLiveStatus();
      if(status==='SUBSCRIBED'){clearTimeout(live.retry);live.retry=null;cmLiveSchedule(live);}
      else if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)&&!live.retry)live.retry=setTimeout(()=>{if(cmLiveCurrent(live)){cmLiveStop();cmLiveStart();cmLiveSchedule();}},10000);
    });
  }catch(e){live.status='CHANNEL_ERROR';}
  // Also catches changes missed during disconnects or a failed subscription.
  live.poll=setInterval(()=>{if(cmLiveCurrent(live)&&cmLiveVisible())cmLiveSchedule(live);},15000);cmLiveStatus();
}
function cmLiveSchedule(live=CM.live){
  if(!live||!cmLiveCurrent(live)||!cmLiveVisible())return;live.pending=true;if(live.timer||live.running)return;
  live.timer=setTimeout(()=>{live.timer=null;cmLiveFlush(live);},180);
}
async function cmLiveFlush(live){
  if(!cmLiveCurrent(live)||!cmLiveVisible())return;
  const t=CM.thread;if(t&&(t.busy||t.loading||t.liveLoading)){live.timer=setTimeout(()=>{live.timer=null;cmLiveFlush(live);},300);return;}
  live.running=true;live.pending=false;
  try{await cmRefresh();if(cmLiveCurrent(live)&&cmLiveVisible()&&CM.thread)await cmLiveThread(CM.thread,live);}
  finally{live.running=false;if(live.pending&&cmLiveCurrent(live))cmLiveSchedule(live);}
}
function cmNearBottom(){const el=$('#cm-conversation');return !!el&&el.scrollHeight-el.scrollTop-el.clientHeight<64;}
function cmMessageMarkup(t){
  const latest=t.messages.filter(m=>m.sender_id===CM.owner).at(-1);let date='';
  return t.messages.map(m=>{const d=new Date(m.created_at).toLocaleDateString(undefined,{month:'short',day:'numeric'}),stamp=d!==date?`<div class="cm-date">${esc(d)}</div>`:'';date=d;
    return stamp+`<div class="cm-bubble ${m.sender_id===CM.owner?'mine':''} ${m.kind==='plan'?'plan-note':''}" data-message-id="${esc(m.id)}">${m.kind==='plan'?'<span class="chip">Plan update</span>':m.tag?`<span class="chip">${esc(fbTagName(m.tag))}</span>`:''}<p>${esc(m.message)}</p>${m.workout&&m.workout.name?`<span class="tiny muted">Workout: ${esc(m.workout.name)}${m.workout.status?' · '+esc(m.workout.status):''}</span>`:''}<span class="tiny muted">${esc(m.sender_id===CM.owner?'You':m.sender_name||t.name)}${m.sender_id!==CM.owner&&m.sender_role==='Coaching team'?' · Coaching team':''} · ${esc(new Date(m.created_at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}))}</span>${m===latest?`<span class="tiny muted cm-receipt" aria-label="Message ${m.read_at?'read':'sent'}">${m.read_at?'Read':'Sent'}</span>`:''}</div>`;
  }).join('');
}
function cmNewButton(){const host=$('#cm-new-host');if(host)host.innerHTML=CM.thread&&CM.thread.newCount?'<button class="btn sm" data-action="cmnew">New messages ↓</button>':'';}
async function cmLiveThread(t,live){
  if(CM.thread!==t||t.loading||t.busy||!cmLiveVisible())return;
  const request=t.readVersion=(t.readVersion||0)+1,follow=cmNearBottom()&&!t.newCount;const owner=CM.owner,generation=CM.generation;
  t.liveLoading=true;
  try{const data=await cmRpc(follow?'read':'peek',t.member);
    const known=new Set(t.messages.map(m=>m.id));let page=data;
    // Fetch any gap after an outage before replacing the visible history.
    while(page.has_more&&page.messages.length&&!page.messages.some(m=>known.has(m.id))){
      if(!cmLiveCurrent(live)||CM.thread!==t||!cmLiveVisible())return;
      page=await cmRpc('peek',t.member,{before:page.messages[0].id});data.messages=[...page.messages,...data.messages];
    }
    if(!cmCurrent(owner,generation)||!cmLiveCurrent(live)||CM.thread!==t||t.readVersion!==request||!cmLiveVisible())return;
    const el=$('#cm-conversation'),messages=$('#cm-messages');if(!el||!messages)return;
    const scroll=el.scrollTop,wasBottom=cmNearBottom()&&!t.newCount,oldIds=new Set(t.messages.map(m=>m.id)),previous=JSON.stringify(t.messages);
    const merged=new Map(t.messages.map(m=>[m.id,m]));data.messages.forEach(m=>merged.set(m.id,m));
    t.messages=[...merged.values()].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)||(BigInt(a.id)<BigInt(b.id)?-1:1));
    t.through=data.through;t.needsReply=data.needs_reply??t.messages.some(m=>m.sender_id!==owner&&!m.resolved_at);t.access=data.access||[];const access=$('#cm-access p');if(access)access.textContent=cmAccessText(t.access);live.fetchFailed=false;
    const fresh=data.messages.filter(m=>!oldIds.has(m.id)&&m.sender_id!==owner).length;
    if(!wasBottom)t.newCount=(t.newCount||0)+fresh;
    if(previous!==JSON.stringify(t.messages)){
      // Keep the actual composer node, focus, selection, and keyboard intact.
      messages.innerHTML=cmMessageMarkup(t);el.scrollTop=wasBottom?el.scrollHeight:scroll;
    }
    if(wasBottom)t.newCount=0;cmNewButton();
    if(t.coach){const status=$('#cm-reply-status'),done=$('#cm-done-host');if(status)status.textContent=t.needsReply?'Needs reply':'Done';if(done&&!!done.querySelector('[data-action="cmdone"]')!==!!t.needsReply)done.innerHTML=t.needsReply?'<div class="cm-done"><button class="btn sm ghost" data-action="cmdone">Mark done without replying</button></div>':'';}
    if(follow&&fresh)live.pending=true;
  }catch(e){if(cmLiveCurrent(live))live.fetchFailed=true;}
  finally{t.liveLoading=false;cmLiveStatus();}
}
function cmShowNew(){const t=CM.thread,el=$('#cm-conversation');if(!t||!el)return;t.newCount=0;cmNewButton();el.scrollTop=el.scrollHeight;cmLiveSchedule();}
document.addEventListener('scroll',e=>{if(e.target&&e.target.id==='cm-conversation'&&CM.thread&&cmNearBottom()&&cmLiveVisible()){

function ringStats(w, keys, wl, o){
  const L=o.L, wk=Math.min(w,L), perWeek=keys.length;
  const blockTotal = o.total + Math.max(0,perWeek-wl.length) + Math.max(0,L-wk)*perWeek;
  const fmtLeft=(n,u)=> n<=0 ? 'done!' : `${n} ${u}${n===1?'':'s'} to go`;
  return [
    {cls:'r1', label:'This week', v:wl.length, of:perWeek, unit:'workouts', sub: fmtLeft(perWeek-wl.length,'workout')},
    {cls:'r3', label:'This program', v:Math.max(0,wk-1)+(wl.length>=perWeek?1:0), of:L, unit:'weeks done', sub: (n=> n<=0 ? 'next program coming up' : `${n} week${n===1?'':'s'} until your next program`)(L-(wk-1)-(wl.length>=perWeek?1:0))},
  ];
}
function ringsCard(w, keys, wl, o){
  const R=ringStats(w,keys,wl,o), C=66, sw=16, gap=5;
  const arcs=R.map((m,i)=>{ const r=C-sw/2-i*(sw+gap), circ=2*Math.PI*r, f=m.of?Math.min(1,m.v/m.of):0;
    return `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
      <circle class="arc" cx="${C}" cy="${C}" r="${r}" fill="none" stroke="currentColor" style="color:var(--${['accent','gold'][i]})" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${(f*circ).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${C} ${C})" ${f===0?'stroke-opacity="0"':''}/>`; }).join('');
  return `<section class="card stack today-progress" aria-label="Progress">
    <div class="rings">
      <svg viewBox="0 0 ${2*C} ${2*C}" role="img" aria-label="${R.map(m=>`${m.label} ${m.v} of ${m.of}`).join(', ')}">${arcs}</svg>
      <div>${R.map(m=>`<div class="m"><div class="ml ${m.cls}">${m.label}</div><div class="mv">${m.v} / ${m.of}<small>${m.unit}</small></div></div>`).join('')}</div>
    </div>
  </section>`;
}
// Deliberate set edits change the requirement; skipping keeps unfinished work.
function updateDraftSetCount(pk){
  const d=state.draft; if(!d || !d.sets[pk]) return;
  d.planCounts=d.planCounts||{}; d.planCounts[pk]=d.sets[pk].length;
}
function workoutCompletion(d){
  let completed=0, planned=0;
  const keys=new Set([...Object.keys(d.planCounts||{}),...Object.keys(d.sets||{})]);
  for(const pk of keys){ const rows=d.sets[pk]||[], n=Math.max((d.planCounts||{})[pk]||0,rows.length); planned+=n; completed+=Math.min(n,rows.filter(s=>s.done&&+s.r>0).length); }
  return {completed,planned,status:planned>0&&completed>=planned?'complete':'partial'};
}
function resumePartial(){
  const d=state.draft; if(!d||!d.partialSaved) return;
  const slots=dSlots();
  for(const s of slots){
    const rows=d.sets[s.pk]||(d.sets[s.pk]=[]), want=Math.max((d.planCounts||{})[s.pk]||0,rows.length);
    while(rows.length<want) rows.push({w:defW(target(s)),r:'',done:false});
  }
  d.skipped={}; delete d.guide; delete d.listView;
  const next=slots.find(s=>(d.sets[s.pk]||[]).some(r=>!r.done||!(+r.r>0)));
  d.step=next?{ph:'ex',pk:next.pk}:{ph:'cool'};
  d.startedAt=Date.now(); d.partialSaved=false;
  save();
}
function startWorkout(key){
  const w=weekNum();
  state.draft = {key, week:Math.min(w,PROGRAM.blockLen), block:state.block.n, mode:splitN(), place:curPlace().k, startedAt:Date.now(), warm:{}, cool:{}, sets:{}, planCounts:{}, subs:{}, feel:{}};
  state.draft.prep=JSON.parse(JSON.stringify(savedPrep(key,curPlace().k)));
  for(const s of sessionSlots(key)){
    const t=target(s);
    state.draft.planned=state.draft.planned||{}; state.draft.planned[s.pk]=usesLoad(t.ex)?(t.w ?? t.sug ?? null):null;
    state.draft.sets[s.pk] = Array.from({length:t.sets},(_,i)=>({w: usesLoad(t.ex) ? String(t.w ?? (t.last&&t.last[i]?t.last[i].w:null) ?? t.sug ?? '') : '', r:'', done:false}));
    state.draft.planCounts[s.pk]=t.sets;
  }
  lockShape(state.draft);
  save();
  USAGE.capture('workout_started');
}

function historyExercise(e){

  const each=ex&&load&&(primeEq(ex)==='db'||(primeEq(ex)==='kb'&&!ex.uni&&/Farmer|Double|Gorilla|Rack/.test(ex.n)));
  const note=[each?'Weight per hand':'',ex?.uni?(timed?'Time per side':'Reps per side'):''].filter(Boolean).join(' · ');
  const unit=timed?'sec':'reps';

}

function exHowTo(ex){

  const ballistic = /^(Push Press|Kettlebell Swing|Kettlebell Snatch|Kettlebell Clean and Press|Dumbbell Jump Squat)$/.test(ex.n);
  if(ex.mode==='T') steps.push(hold
    ? 'Hold the position and breathe steadily. Stop when your form slips.'
    : 'Keep moving as described and breathe steadily. Stop when your form slips.');
  else if(ex.mode==='P' || ballistic) steps.push(ex.slots.includes('jump') && !ex.eq.includes('mb')
    ? 'Move fast, land softly and reset with control. Rest fully between sets.'
    : 'Use a quick, controlled effort. Reset with control and rest fully between sets.');
  else if(ex.slots.includes('carry')) steps.push('Keep breathing as you move. Set the weight down with control.');
  else steps.push('Breathe out on the hard part, in on the way back. Move smoothly and keep control throughout.');
  if(ex.uni) steps.push(ex.mode==='T'
    ? 'Do the timed interval on one side, then switch.'
    : /^(Skater Bound|Lateral Bound)$/.test(ex.n)
      ? 'Alternate sides as described, keeping each landing steady.'
      : 'Do all the reps on one side, then switch.');
  if(PLATFORM_JUMPS.test(ex.n) && hasEq(ex,new Set(['rigstep'])) && placeEq(state.curPlace||homeBase()).has('rigstep') && !placeEq(state.curPlace||homeBase()).has('bx')) steps.push('On a fold-down rig step: make sure it’s locked in, land in the middle, and step down. Don’t jump down.');
  return steps;
}

function unlockAudio(){

    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(audioCtx && audioCtx.state==='closed') audioCtx=null;
    const fresh=!audioCtx; if(fresh) audioCtx=new AC();
    const asleep=audioCtx.state!=='running';
    if(asleep){ const p=audioCtx.resume(); if(p&&p.catch) p.catch(()=>{}); }
    if(fresh||asleep){ const s=audioCtx.createBufferSource(); s.buffer=audioCtx.createBuffer(1,1,22050); s.connect(audioCtx.destination); s.start(0); }
  }catch(e){}
}

}
