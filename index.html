  const inW=!!(!coachMode&&ui.tab==='workout'&&state.draft?.sets[pk]);
  const cur=(inW?dSlots():weekKeys().flatMap(sessionSlots)).find(s=>s.pk===pk)?.id||planId(pk);
  if(!EX[cur])return;
  ui.swap={pk,cur,inW,q:'',eq:'',body:'',browse:false,limit:12};renderSwapPicker();
}
function swapGroups(L){
  const cur=EX[L.cur],main=EXM[L.cur]?.p||[];
  const rank=e=>similarity(cur,e)+prefBonus(e)*2;
  const pool=LIB.filter(e=>e.id!==L.cur&&available(e)&&allowed(e));
  const similar=pool.filter(e=>e.slots.some(s=>cur.slots.includes(s))).sort((a,b)=>rank(b)-rank(a)||a.n.localeCompare(b.n));
  const ids=new Set(similar.map(e=>e.id));
  const same=pool.filter(e=>!ids.has(e.id)&&(EXM[e.id]?.p||[]).some(m=>main.includes(m))).sort((a,b)=>rank(b)-rank(a)||a.n.localeCompare(b.n));
  return {similar,same};
}
function swapLibraryResults(L){
  const query=(L.q||'').trim().toLowerCase();
  return LIB.filter(e=>e.id!==L.cur&&(!L.eq||e.eq.includes(L.eq))&&(!L.body||LIB_BODY[L.body]?.[1].some(m=>EXM[e.id]?.p.includes(m)))&&(!query||(e.n+' '+e.m+' '+eqLabelList(e).join(' ')).toLowerCase().includes(query))).sort((a,b)=>a.n.localeCompare(b.n));
}

// Retain completed rows under their original exercise while replacing only unfinished work.
function applyExerciseSwap(pk,id,persistent){
  if(!EX[id]||!state.block||!TPL[pk.split('.')[0]]?.slots[+pk.split('.')[1]])return;
  const d=!coachMode&&state.draft?.sets[pk]?state.draft:null,old=d?dSlots().find(s=>s.pk===pk):null;
  if(old?.id===id){closeModal();return;}
  const rows=old?d.sets[pk]:[],done=rows.filter(r=>r.done),remaining=rows.length-done.length;
  if(old&&done.length&&!remaining){
    if(!persistent){toast('This exercise is complete. Update the plan for next time instead.');return;}
    state.block.plan[pk]=id;d.subs=d.subs||{};d.subs[pk]=old.id;save();USAGE.capture('swap_applied');closeModal();render();toast('Updated the plan for next time');return;
  }
  if(old&&done.length){
    d.completedSwaps=d.completedSwaps||[];const archived=pk+'~swap'+d.completedSwaps.length;
    d.completedSwaps.push({...JSON.parse(JSON.stringify(old)),pk:archived});
    d.sets[archived]=JSON.parse(JSON.stringify(done));d.planCounts=d.planCounts||{};d.planCounts[archived]=done.length;
    d.planned=d.planned||{};d.planned[archived]=d.planned[pk]??null;
    d.feel=d.feel||{};d.feel[archived]=d.feel[pk]??null;
  }
  if(persistent)state.block.plan[pk]=id;
  if(old){
    d.subs=d.subs||{};d.subs[pk]=id;
    resetRows(pk);
    if(done.length){const tg=target(dSlots().find(s=>s.pk===pk));d.sets[pk]=Array.from({length:remaining},()=>({w:defW(tg),r:'',done:false}));updateDraftSetCount(pk);}
    delete d.pathCurrent;delete d._x;delete d.skipped?.[pk];fClearTimer();d.step={ph:'ex',pk};
  }
  save();USAGE.capture('swap_applied');closeModal();render();toast(persistent?'Swapped from now on':`${EX[id].n} for today`);
}
function defW(tg){ if(!usesLoad(tg.ex)) return ''; const v=tg.w ?? tg.sug; return v!=null?String(v):''; }
function resetRows(pk){
  const d=state.draft; if(!d||!d.sets[pk]) return;
  const slot=dSlots().find(x=>x.pk===pk); if(!slot) return; const tg=target(slot);
  d.sets[pk]=Array.from({length:tg.sets},()=>({w:defW(tg),r:'',done:false}));
  updateDraftSetCount(pk);
  d.planned=d.planned||{}; d.planned[pk]=usesLoad(tg.ex)?(tg.w ?? tg.sug ?? null):null; if(d.feel) d.feel[pk]=null;
}

/* ---------------- Actions ---------------- */
function finishWorkout(){
  const d=state.draft, slots=dSlots().concat(state.draft.completedSwaps||[]), entries=[], completion=workoutCompletion(d);
  const previous=logs.find(l=>l.id===d.logId), orderAdvanced=d.key===nextWorkoutKey();
  d.progressBefore=d.progressBefore||{};
  for(const s of slots){
    const done=(d.sets[s.pk]||[]).filter(x=>x.done && (+x.r>0));
    if(!done.length) continue;
    const old=previous&&previous.entries.find(e=>e.pk===s.pk&&e.ex===s.id);
    const rows=done.map(x=>({w:x.w===''?null:+x.w,r:+x.r})), feel=(d.feel||{})[s.pk]||null;
    let msg;
    if(old && JSON.stringify(old.sets)===JSON.stringify(rows) && old.feel===feel) msg=old.msg;
    else {
      if(!Object.prototype.hasOwnProperty.call(d.progressBefore,s.id)) d.progressBefore[s.id]=JSON.parse(JSON.stringify(state.ex[s.id]||{}));
      state.ex[s.id]=JSON.parse(JSON.stringify(d.progressBefore[s.id]));
      msg=applyProgression(s,done,feel);
    }
    const tg0=target(s);
    entries.push({pk:s.pk, ex:s.id, name:EX[s.id].n, sets:done.map(x=>({w:x.w===''?null:+x.w, r:+x.r})), msg,
      plan:`${tg0.sets}×${usesLoad(tg0.ex)?tg0.lo+'–'+tg0.hi:tg0.r} ${tg0.unit}`, feel:(d.feel||{})[s.pk]||null, planned:(d.planned||{})[s.pk]||null,
      swap: s.placeFrom ? EX[s.placeFrom].n : (origId(s.pk) && s.id!==origId(s.pk) && EX[origId(s.pk)]) ? EX[origId(s.pk)].n : null, today:!!s.sub||!!s.placeFrom, place:s.placeFrom?curPlace().n:null, of:(d.sets[s.pk]||[]).length});
  }
  if(!entries.length){ toast('Mark at least one set done first.'); return; }
  const elapsed=(d.elapsedMs||0)+(d.partialSaved?0:Math.max(0,Date.now()-d.startedAt));
  const l={id:d.logId||newLogId(), date:previous?previous.date:new Date().toISOString(), updatedAt:Math.max(Date.now(),(previous&&previous.updatedAt||0)+1), units:state.settings.units, key:d.key, name:tplOf(d.key).name, block:d.block, week:d.week, mode:d.mode, dur:Math.round(elapsed/60000), entries, ...completion};
  if(completion.status==='complete'){ l.orderAdvanced=orderAdvanced; l.completedAt=new Date().toISOString(); if(d.block===state.block.n) l.week=weekNum(); }
  if(d.cardioDone) l.cardio=d.cardioDone;
  logs=logs.filter(x=>x.id!==l.id); logs.unshift(l);
  USAGE.capture('workout_saved',{status:l.status});
  if(l.status==='partial'){ d.logId=l.id; d.elapsedMs=elapsed; d.partialSaved=true; }
  else state.draft=null;
  fClearTimer(); ui.timer=null; clearInterval(timerInt); save(); pushLog(l);
  ui.tab='today'; render(); window.scrollTo(0,0);
  modal(`<div class="focus workout-summary">${aTop(l.name,'closemodal','')}
    <div class="ahead"><h1>${l.status==='partial'?'Partial workout saved':'Workout saved'}</h1><div class="small muted">${esc(l.name)} ${l.status==='partial'?'partly finished':'complete'}</div></div>
    <section class="card acard"><div class="ach"><b>Your workout</b><span class="goal">${l.status==='partial'?'Partial':'Complete'}</span></div><div class="astats"><div><b>${l.completed} / ${l.planned}</b><span>Working sets</span></div><div><b>${l.dur} min</b><span>Workout time</span></div></div>
      ${l.status==='partial'?'<div class="small muted">Resume the remaining sets from Today. This does not count as a completed workout.</div>':''}
      ${aFoot('<button class="btn primary fbig" data-action="closemodal">Done</button>')}
      <details class="workout-disclosure"><summary>Next targets</summary>${entries.map(e=>`<div class="asection"><b class="small">${esc(e.name)}</b><div class="small muted">${esc(e.msg)}</div></div>`).join('')}</details>
      <div class="anote small">${esc(saveStatus()[2])}${AUTH.user&&!AUTH.coach&&!coachMode?' Your coach can see this workout after it syncs.':''}</div></section>
    </div>`,{sheetClass:'workout-sheet'});
}

  if(t.id==='wi-hide'){ state.weigh.hide=t.checked; save(); render(); return; }
  if(t.id==='libeasy'){ ui.libEasy=t.checked; render(); return; }
  if(t.id==='set-name'){ state.settings.name=t.value.trim().slice(0,30); save(); render(); return; }
  if(t.id==='set-bw'){ const result=checkBodyWeight(t.value,state.settings.units,'set-bw',true); if(!result.ok) return; state.settings.bw=result.value; save(); render(); toast(state.settings.bw?'Saved. New exercises use this for starting weights.':'Cleared'); return; }
  if(t.id==='libeq'){ ui.libEq=t.value; render(); }
  if(t.id==='libbody'){ ui.libBody=t.value; render(); }
  if(t.id==='libmove'){ ui.libMove=t.value; render(); }
  if(['swapeq','swapbody'].includes(t.id)&&ui.swap){ui.swap[t.id==='swapeq'?'eq':'body']=t.value;ui.swap.limit=12;renderSwapPicker();return;}
  if(t.id==='lpq'){ ui.lp.q=t.value; const pos=t.selectionStart; libPickSheet(); const n=$('#lpq'); n.focus(); n.setSelectionRange(pos,pos); }
  if(['lpeq','lpbody','lpmove'].includes(t.id)){ ui.lp[{lpeq:'eq',lpbody:'body',lpmove:'move'}[t.id]]=t.value; libPickSheet(); }

});

/* ---------------- Boot ---------------- */
function seedDemo(){
  state=defaults(); logs=[];
  state.setup=null; state.onboarded=true;
  Object.assign(state.settings,{name:'Demo',goals:['muscle'],days:[1,3,5],split:'fb3',mins:45,comfort:'machines',tstyle:'machines',cardio:{style:'walk',jog:'none',after:0}});
  state.places=[{k:'gym',n:'Demo gym',eq:PLACE_TYPES.gym.eq.split(' ')}];
  state.curPlace='gym'; newBlock();
  SYNC={owner:null,base:null,conflict:null,recovery:null};
  if(PAGE.active)historySaved(PAGE.store.replace({state,logs:[],sync:compactSync(SYNC)}));
}
document.addEventListener('click',e=>{
  if(!DEMO_MODE || !e.target.closest('[data-action="demoreset"]')) return;
  confirmBox('Reset demo?','This clears the demo plan, weights and workout history in this browser and creates a fresh sample plan.','Reset demo',()=>{
    fClearTimer(); seedDemo(); ui.tab='today'; ui.qsLater=true; closeModal(); save(); render(); window.scrollTo(0,0);
  });
});
(async function boot(){
  let saved;
  try{saved=await openDevice();}catch(e){
    if(DEVICE.recovery)saved=await recoverDeviceCopies();
    else{document.getElementById('app').innerHTML='<div class="ob"><h1>Device storage unavailable</h1><p>Your saved copy has been kept. Close other app tabs and reload to try again.</p></div>';return;}
  }
  if(saved && saved.state){ if(saved.sync) SYNC=saved.sync; state=migrate(saved.state); logs=normalizeLogs(saved.logs||[],state.settings.units); }
  else { state=defaults(); state.updatedAt=0; }
  try{await enablePaged(saved);}catch(e){
    storageOk=false;DEVICE.error=e;
    document.getElementById('app').innerHTML='<div class="ob"><h1>Device storage unavailable</h1><p>Your existing saved copy has been kept. Close other app tabs and reload to retry migration.</p></div>';return;
  }
  if(DEMO_MODE){
    if(!saved || !saved.state) seedDemo();
    AUTH.ready=true; ui.qsLater=true;
  }
  if(state.block && state.places && state.places.length){ const rep=ensurePlan(); if(rep.length) save(); }
  persistLocal();
  if(state.draft && !state.setup && !state.draft.partialSaved){ ui.tab='workout'; fRestoreTimer(); }
  render();
  initRemote();
  setTimeout(()=>{ if(pendingQs().length && !ui.qsLater && !state.draft && !$('#modal').innerHTML) newQsPopup(); },900);
  if(!storageOk) toast('This browser is not saving data. Use Settings > Backup.');
})();
</script>
<script src="offline.js" defer></script>
